  parameters:
    ids:
      description: The requested identifier. FactSet identifiers, tickers, CUSIP,
        SEDOL, and ISIN are accepted inputs.<p><strong>IDs limit</strong> = 20 per
        non-batch request and 1000 per batch request.</p><p>Make note, <strong>GET</strong>
        Method URL request lines are also limited to a total length of 8192 bytes
        (8 KB). In cases where the service allows for large numbers of IDs, which
        may lead to exceeding this request line limit of 8 KB, it is advised that
        requests with large request lines be made through the respective <strong>POST</strong>
        method.</p>
      examples:
        oneId:
          summary: One Entity Identifier
          value:
          - 000C7F-E
        multipleIds:
          summary: Multiple Entity Identifiers
          value:
          - 000C7F-E
          - 0FPWZD-E
      explode: false
      in: query
      name: ids
      required: true
      schema:
        items:
          type: string
        maxItems: 1000
        minItems: 1
        type: array
      style: form
    _paginationLimit:
      description: Specifies the number of results to return per page.
      explode: true
      in: query
      name: _paginationLimit
      required: false
      schema:
        default: 5
        maximum: 500
        type: integer
      style: form
    _paginationOffset:
      description: Specifies the starting point for pagination. This parameter is
        used to identify the beginning of next set of results.
      explode: true
      in: query
      name: _paginationOffset
      required: false
      schema:
        default: 0
        type: integer
      style: form
    batch:
      description: |
        Enables the ability to asynchronously "batch" the request, supporting a long-running request for up to 20 minutes. Upon requesting batch=Y, the service will respond with an HTTP Status Code of 202.
        Once a batch request is submitted, use the corresponding `/batch-status` endpoint to see if the job has been completed. Once completed, retrieve the results of the request via the `/batch-result` endpoint.
      explode: true
      in: query
      name: batch
      required: false
      schema:
        $ref: '#/components/schemas/Batch'
      style: form
    batchId:
      allowEmptyValue: false
      description: Batch Request identifier.
      explode: true
      in: query
      name: id
      required: true
      schema:
        format: uuid
        type: string
      style: form
    supplyChainRelationshipType:
      description: |-
        Controls the type of supply chain relationship returned.
          * **CUSTOMER** = Returns entities to which the source company sells products/services.
          * **SUPPLIER** = Returns entities from which the source company purchases goods or services.
      example: CUSTOMER
      explode: true
      in: query
      name: relationshipType
      required: false
      schema:
        $ref: '#/components/schemas/SupplyChainRelationshipType'
      style: form
    relationshipsRelationshipType:
      description: |-
        Controls the relationship types returned in the response. Multiple relationship types can be selected simultaneously.

          * **COMPETITOR** = Returns entities disclosed by the source company as competitors or rivals.

          * **ALL_PARTNERS** = Returns all available partner relationship types in a single response.

          * **PARTNER_DISTRIBUTION** = Returns distribution partnership relationships.

          * **PARTNER_EQUITY_INVESTMENT** = Returns equity investment partnership relationships.

          * **PARTNER_INTEGRATED_PRODUCT_OFFERING** = Returns integrated product offering partnerships.

          * **PARTNER_INVESTORS** = Returns investor-related partnership relationships.

          * **PARTNER_JOINT_VENTURE** = Returns joint venture partnership relationships.

          * **PARTNER_IN_LICENSING** = Returns in-licensing partnership relationships.

          * **PARTNER_OUT_LICENSING** = Returns out-licensing partnership relationships.

          * **PARTNER_MANUFACTURING** = Returns manufacturing partnership relationships.

          * **PARTNER_MARKETING** = Returns marketing partnership relationships.

          * **PARTNER_RESEARCH_COLLABORATION** = Returns research collaboration partnership relationships.
      example:
      - COMPETITOR
      - PARTNER_MARKETING
      explode: true
      in: query
      name: relationshipType
      required: false
      schema:
        $ref: '#/components/schemas/RelationshipsRelationshipType'
      style: form
    supplyChainFields:
      description: |
        A specific set of attributes to return in the response.
        If omitted, all fields are returned.
      explode: false
      in: query
      name: fields
      required: false
      schema:
        $ref: '#/components/schemas/SupplyChainFields'
      style: form
    relationshipsFields:
      description: |
        A specific set of attributes to return in the response. If omitted, all fields are returned.
      explode: false
      in: query
      name: fields
      required: false
      schema:
        $ref: '#/components/schemas/RelationshipsFields'
      style: form
    date:
      description: The date requested in YYYY-MM-DD format. If left blank, the API
        will default to the most recent available data. Future dates (T+1) are not
        accepted in this endpoint.
      example: 2025-12-31
      explode: true
      in: query
      name: date
      required: false
      schema:
        $ref: '#/components/schemas/DateSchema'
      style: form
