    SupplyChainItem_allOf_centrality:
      description: |
        Centrality metrics representing the entity's relative importance and connectivity within the supply chain network.
      nullable: true
      properties:
        degree:
          description: Degree centrality represents the number of direct connections
            with suppliers and customers. The value is normalized by the number of
            entities in the supply chain database at each calculation date.
          example: 0.842697
          format: double
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        eigenvector:
          description: Eigenvector centrality assigns higher scores to companies connected
            to well-connected firms. This measure is calculated in an undirected network,
            meaning both supplier-customer and customer-supplier relationships are
            considered. All scores are normalized by L2 norm at each calculation date.
          example: 5.420991
          format: double
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        productKatz:
          description: Katz centrality assesses both direct and downstream connections
            while reducing the influence of indirect connections based on distance.
            PRODUCT_KATZ reflects the impact of both direct and indirect suppliers.
            All scores are normalized by L2 norm at each calculation date.
          example: 5.460563
          format: double
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        cashKatz:
          description: Katz centrality assesses both direct and downstream connections
            while reducing the influence of indirect connections based on distance.
            CASH_KATZ reflects the impact of both direct and indirect customers. All
            scores are normalized by L2 norm at each calculation date.
          example: 0.556619
          format: double
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        customer:
          description: Customer centrality is derived from the HITS (Hyperlink-Induced
            Topic Search) algorithm, assigning higher scores to customers connected
            to suppliers relied upon by many other customers. All scores are normalized
            by L1 norm at each calculation date.
          example: 0.268328
          format: double
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        supplier:
          description: Supplier centrality is derived from the HITS (Hyperlink-Induced
            Topic Search) algorithm, assigning high scores to suppliers connected
            to customers with high customer centrality. All scores are normalized
            by L1 norm at each calculation date.
          example: 0.030261
          format: double
          maximum: 100
          minimum: 0
          nullable: true
          type: number
      type: object
    SupplyChainItem_allOf:
      properties:
        relationshipType:
          description: Code denoting the type of relationship. For supply chain endpoints,
            values are CUSTOMER or SUPPLIER.
          enum:
          - CUSTOMER
          - SUPPLIER
          example: CUSTOMER
          type: string
        direction:
          description: Indicates whether the relationship is direct, reverse, or mutual.
            A direct relationship is disclosed by the source company, while a reverse
            relationship is disclosed by another company regarding the source company.
            A mutual relationship indicates that both companies have disclosed the
            relationship.
          enum:
          - DIRECT
          - REVERSE
          - MUTUAL
          example: DIRECT
          nullable: true
          type: string
        revenuePct:
          description: Percentage of revenue that the source company derived from
            this relationship in the reporting period. This field is only applicable
            to relationships reported as Customer and only then for those cases where
            the reporting company provides a percentage.
          example: 15.97
          format: double
          nullable: true
          type: number
        relevanceGrade:
          description: Integer value between 1 and 10,000 indicating the relevance
            factors' grade for this relationship. A higher grade indicates a more
            significant supply chain relationship.
          example: 8
          format: int32
          maximum: 10000
          minimum: 0
          nullable: true
          type: integer
        supplierSubsidiaries:
          description: List of supplier subsidiaries involved in this relationship.
            Only present when a subsidiary is disclosed as the specific entity involved
            in a relationship.
          example:
          - name: NASA
            entityId: 0RXZ3R-E
          - name: JAXA
            entityId: 0645P3-E
          items:
            $ref: '#/components/schemas/Subsidiary'
          nullable: true
          type: array
        customerSubsidiaries:
          description: List of customer subsidiaries involved in this relationship.
            Only present when a subsidiary is disclosed as the specific entity involved
            in a relationship.
          example:
          - name: Honeywell Aerospace & Defense
            entityId: 000KYG-E
          - name: Lockheed Martin Aeronautics
            entityId: 0A1BCD-E
          items:
            $ref: '#/components/schemas/Subsidiary'
          nullable: true
          type: array
        centrality:
          $ref: '#/components/schemas/SupplyChainItem_allOf_centrality'
        relationshipKeywords:
          description: Related keywords associated with the relationship to assist
            in discovering additional related data. Each inner array represents a
            grouped set of related keywords.
          example:
          - - NASA Air Traffic Management
            - ecoDemonstrator Explorer
          - - X-37B
          - - O3b mPOWER Satellites
          - - CST-100 Starliner
          - - U.S. Air Force Research Laboratories
            - Ghost Bat
          items:
            items:
              type: string
            type: array
          nullable: true
          type: array
      type: object
