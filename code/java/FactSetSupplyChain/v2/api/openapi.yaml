        "200":
          content:
            application/json:
              examples:
                Competitor relationships for one successful entity:
                  $ref: '#/components/examples/competitorResponseExample'
                Competitor relationships for partial successful entities:
                  $ref: '#/components/examples/competitorResponsePartialExample'
                Partner relationships for one successful entity:
                  $ref: '#/components/examples/partnerResponseExample'
                Partner relationships for partial successful entities:
                  $ref: '#/components/examples/partnerResponsePartialExample'
              schema:
                $ref: '#/components/schemas/RelationshipsResponse'
          description: The Relationships response object. The schema of each item
            in the `data` array depends on the `relationshipType` parameter.
        "400":
          content:
            application/json:
              examples:
                Bad Request - Missing Required Parameter:
