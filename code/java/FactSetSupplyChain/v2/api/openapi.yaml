openapi: 3.0.0
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: |
    FactSet Supply Chain Relationships data exposes and classifies the business
    relationships and interconnections among global companies.

    Relationship information is sourced from trusted primary sources and
    reverse-linked to non-disclosing parties, creating a comprehensive and
    consistent relationship graph.

    Access the complex networks of companies' key customers, suppliers,
    competitors, and strategic partners, including both direct
    (named by company) and reverse (named by other companies) relationships.

    Over **43,000 companies** are actively covered and involved in more than
    **735,000 relationships**.

    Sources include primary public sources such as:

    - SEC 10-K annual filings
    - Investor presentations
    - Press releases

    This API provides the following endpoints:

    - `/supply-chain` — Retrieve supplier and customer relationships with
      centrality measures, relevance grades, and revenue percentages
    - `/relationships` — Retrieve competitor and partner relationships with
      sector overlap and relationship keywords

    **Rate limits**

    - 10 requests per second
    - 10 concurrent requests per user
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: FactSet Supply Chain API
  version: 2.0.0
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/factset-supply-chain-api
servers:
- description: Production
  url: https://api.factset.com/content/factset-supply-chain/v2
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- description: Retrieve supplier and customer relationships for requested entities,
    including subsidiaries, revenue percentages, relevance grades, centrality measures,
    and relationship keywords.
  name: Supply Chain
- description: Retrieve competitor and partner relationships for requested entities.
    The response schema varies based on the `relationshipType` parameter - competitor
    responses include overlapping sector counts, while partner responses include specific
    partner type classifications.
  name: Relationships
- description: Manage asynchronous requests by checking their status and retrieving
    results for long-running batch jobs."
  name: Batch Processing
paths:
  /supply-chain:
    get:
      description: |
        Retrieve supplier and customer relationships for the requested
        entity or entities.

        Includes:

        - subsidiaries
        - revenue percentages
        - relevance grades
        - centrality measures
        - relationship keywords

        Use the `relationshipType` parameter to filter by:

        - `CUSTOMER`
        - `SUPPLIER`

        Historical data can be accessed only with the Historical product
        subscription. If the product is not subscribed, data for the latest
        available period will be returned.
      operationId: listSupplyChain
      parameters:
      - description: The requested identifier. FactSet identifiers, tickers, CUSIP,
          SEDOL, and ISIN are accepted inputs.<p><strong>IDs limit</strong> = 20 per
          non-batch request and 1000 per batch request.</p><p>Make note, <strong>GET</strong>
          Method URL request lines are also limited to a total length of 8192 bytes
          (8 KB). In cases where the service allows for large numbers of IDs, which
          may lead to exceeding this request line limit of 8 KB, it is advised that
          requests with large request lines be made through the respective <strong>POST</strong>
          method.</p>
        examples:
          oneId:
            summary: One Entity Identifier
            value:
            - 000C7F-E
          multipleIds:
            summary: Multiple Entity Identifiers
            value:
            - 000C7F-E
            - 0FPWZD-E
        explode: false
        in: query
        name: ids
        required: true
        schema:
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type: array
        style: form
      - description: |-
          Controls the type of supply chain relationship returned.
            * **CUSTOMER** = Returns entities to which the source company sells products/services.
            * **SUPPLIER** = Returns entities from which the source company purchases goods or services.
        example: CUSTOMER
        explode: true
        in: query
        name: relationshipType
        required: false
        schema:
          $ref: '#/components/schemas/SupplyChainRelationshipType'
        style: form
      - description: The date requested in YYYY-MM-DD format. If left blank, the API
          will default to the most recent available data. Future dates (T+1) are not
          accepted in this endpoint.
        example: 2025-12-31
        explode: true
        in: query
        name: date
        required: false
        schema:
          $ref: '#/components/schemas/DateSchema'
        style: form
      - description: |
          A specific set of attributes to return in the response.
          If omitted, all fields are returned.
        explode: false
        in: query
        name: fields
        required: false
        schema:
          $ref: '#/components/schemas/SupplyChainFields'
        style: form
      - description: |
          Enables the ability to asynchronously "batch" the request, supporting a long-running request for up to 20 minutes. Upon requesting batch=Y, the service will respond with an HTTP Status Code of 202.
          Once a batch request is submitted, use the corresponding `/batch-status` endpoint to see if the job has been completed. Once completed, retrieve the results of the request via the `/batch-result` endpoint.
        explode: true
        in: query
        name: batch
        required: false
        schema:
          $ref: '#/components/schemas/Batch'
        style: form
      - description: Specifies the number of results to return per page.
        explode: true
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 5
          maximum: 500
          type: integer
        style: form
      - description: Specifies the starting point for pagination. This parameter is
          used to identify the beginning of next set of results.
        explode: true
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Supply Chain relationships for successful entity:
                  $ref: '#/components/examples/supplyChainResponseExample'
                Supply Chain relationships for partial success:
                  $ref: '#/components/examples/supplyChainResponsePartialExample'
              schema:
                $ref: '#/components/schemas/SupplyChainResponse'
          description: Successful response containing supply chain relationships for
            the requested entity IDs.
        "400":
          content:
            application/json:
              examples:
                Bad Request - Missing Required Parameter:
                  $ref: '#/components/examples/badRequestRequiredParameter'
                Bad Request - Invalid Parameter:
                  $ref: '#/components/examples/badRequestInvalidParameters'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request. This can occur for several reasons. Please review
            the "message" for more details.
        "401":
          content:
            application/json:
              examples:
                User Authentication - Failed:
                  $ref: '#/components/examples/unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from. For more help, select the **Report Issue** in the top right corner
            of this Developer Portal specification card and choose Connectivity 401
            or 403 Responses.
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  $ref: '#/components/examples/forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. The request was a legal request, but the server
            is refusing to respond. Please reach out to FactSet Account Team for assistance
            with authorization.
        "404":
          content:
            application/json:
              examples:
                Bad Request - Endpoint Not Found:
                  $ref: '#/components/examples/notFound'
                Bad Request - Data Not Found:
                  $ref: '#/components/examples/dataNotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The requested resource was not found.
        "415":
          content:
            application/json:
              examples:
                Unsupported Media Type:
                  $ref: '#/components/examples/unsupportedMediaType'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported Media Type. This error may be returned when the
            caller sends a resource in a format that is not accepted by the server.
            This can be fixed by ensuring that Content-Type header is set to the correct
            value. In this instance, "application/json" would be the appropriate value.
        "422":
          content:
            application/json:
              examples:
                Validation Error:
                  $ref: '#/components/examples/unprocessableEntity'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unprocessable Entity. Your request data was syntactically correct but semantically invalid.
            Check the required parameters and their value constraints.
        "500":
          content:
            application/json:
              examples:
                Internal Server Error - Not Writable:
                  $ref: '#/components/examples/notWritable'
                Internal Server Error - General Exception:
                  $ref: '#/components/examples/generalException'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
      summary: Get supply chain relationships for requested entities.
      tags:
      - Supply Chain
      x-accepts: application/json
    post:
      description: |
        Retrieve supplier and customer relationships for a large list of
