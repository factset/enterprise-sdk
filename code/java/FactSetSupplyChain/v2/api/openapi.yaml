      type: array
      uniqueItems: true
    Subsidiary:
      description: |
        Subsidiary information including the subsidiary name and its FactSet-generated entity identifier, if available.
      properties:
        name:
          description: The proper name of the subsidiary.
          example: NASA
          nullable: true
          type: string
