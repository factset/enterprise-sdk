            Internal Server Error - General Exception:
              $ref: '#/components/examples/generalException'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Internal Server Error.
  schemas:
    IdentifierResponseFields:
      additionalProperties: true
      description: Reusable component containing the standard `requestId` field used
        in response objects
      properties:
        requestId:
          description: The requested identifier sent as input.
          example: 000C7F-E
          type: string
        date:
          description: The requested date in YYYY-MM-DD format.
          example: 2025-02-26
          format: date
          nullable: true
          type: string
      title: Common Identifier and Date Response Fields
      type: object
    EntityResponseFields:
      additionalProperties: true
      description: Reusable component containing standard entity fields used in relationship
        response objects
      properties:
        entityId:
          description: Unique FactSet-generated identifier representing the related
            entity. Six alpha-numeric characters with a -E suffix (XXXXXX-E).
          example: 05MCSG-E
          type: string
        entityName:
          description: The proper name of the related entity.
          example: Apple Inc.
          type: string
      title: Common Entity Response Fields
      type: object
    RelationshipTypeEnum:
      description: Supported relationship types
      enum:
      - COMPETITOR
      - ALL_PARTNERS
      - PARTNER_DISTRIBUTION
      - PARTNER_EQUITY_INVESTMENT
      - PARTNER_INTEGRATED_PRODUCT_OFFERING
      - PARTNER_INVESTORS
      - PARTNER_JOINT_VENTURE
      - PARTNER_IN_LICENSING
      - PARTNER_OUT_LICENSING
      - PARTNER_MANUFACTURING
      - PARTNER_MARKETING
      - PARTNER_RESEARCH_COLLABORATION
      title: Relationship Type Names
      type: string
    SupplyChainFieldsEnum:
      description: Supported field names for Supply Chain responses
      enum:
      - supplierSubsidiaries
      - customerSubsidiaries
      - relationshipKeywords
      - revenuePct
      - relevanceGrade
      - centrality
      - direction
