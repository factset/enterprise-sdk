                  $ref: '#/components/examples/USBranchesResponseExample'
                Credit Union Branches:
                  $ref: '#/components/examples/CUBranchesResponseExample'
                Australia Bank Branches:
                  $ref: '#/components/examples/AustraliaBranchesResponseExample'
