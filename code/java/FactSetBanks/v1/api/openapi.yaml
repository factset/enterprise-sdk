    FinancialsRequest_data:
      description: Financial data query parameters.
      example:
        coverage: US
        endDate: 2023-12-31T00:00:00.000+0000
        periodicity: ANN
        ids:
        - 000BDX-E
        currency: USD
        metrics:
        - FB_SM_BHC_ASSETS
        startDate: 2023-01-01T00:00:00.000+0000
      properties:
        ids:
          description: Array of security identifiers. Accepted ID types include Market
            Tickers, SEDOL, ISINs, CUSIPs, or FactSet Entity IDs.
          example:
          - 000BDX-E
          items:
            type: string
          minItems: 1
          type: array
        periodicity:
          description: |
            Periodicity or frequency of the fiscal periods, where
              * **ANN**  = Annual - Original
              * **QTR**  = Quarterly - Original
              * **SEMI** = Semi-Annual

            If omitted, defaults to `ANN`.
          enum:
          - ANN
          - QTR
          - SEMI
          example: ANN
          type: string
        startDate:
          description: |
            Filters for fiscal periods ending on or after this date in YYYY-MM-DD format.
            Use with `endDate` for a date range, or alone to return all periods from this date forward.
            If both `startDate` and `endDate` are omitted, the most recent available period is returned.
          example: 2023-01-01
          format: date
          type: string
        endDate:
          description: |
            Filters for fiscal periods ending on or before this date in YYYY-MM-DD format.
            Use with `startDate` for a date range, or alone to return the most recent period on or before this date.
            If both `startDate` and `endDate` are omitted, the most recent available period is returned.
          example: 2023-12-31
          format: date
          type: string
        coverage:
          description: |
            Data source region or institution type.
              * **US** — US banks, thrifts, and depository institutions, including bank holding companies (FFIEC/FDIC)
              * **CANADA** — Canadian banks regulated by OSFI
              * **AUSTRALIA** — Australian banks regulated by APRA
              * **CREDIT_UNION** — US credit unions regulated by NCUA
          enum:
          - US
          - CANADA
          - AUSTRALIA
          - CREDIT_UNION
          example: US
          type: string
        metrics:
          description: |
            Array of metric codes to retrieve. Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.
          example:
          - FB_SM_BHC_ASSETS
          items:
            type: string
          minItems: 1
          type: array
        currency:
          description: Currency code (ISO 4217). For a list of currency codes, see
            [OA Page 1470](https://my.apps.factset.com/oa/pages/1470).
          example: USD
          maxLength: 3
          minLength: 3
          nullable: true
          type: string
      required:
      - coverage
      - ids
      - metrics
      type: object
    PerformanceRequest_data:
      description: UBPR performance metrics query parameters.
      example:
        endDate: 2023-12-31T00:00:00.000+0000
        periodicity: ANN
        ids:
        - 000BDX-E
        currency: USD
        metrics:
        - FF_ROA
        - FF_ROE
        startDate: 2023-01-01T00:00:00.000+0000
      properties:
        ids:
          description: Array of security identifiers. Accepted ID types include Market
            Tickers, SEDOL, ISINs, CUSIPs, or FactSet Entity IDs.
          example:
          - 000BDX-E
          items:
            type: string
          minItems: 1
          type: array
        periodicity:
          description: |
            Periodicity of the UBPR fiscal periods, where
              * **ANN** = Annual
              * **QTR** = Quarterly

            If omitted, defaults to `ANN`.
          enum:
          - ANN
          - QTR
          example: ANN
          type: string
        startDate:
          description: |
            Filters for fiscal periods ending on or after this date in YYYY-MM-DD format.
            Use with `endDate` for a date range, or alone to return all periods from this date forward.
            If both `startDate` and `endDate` are omitted, the most recent available period is returned.
          example: 2023-01-01
          format: date
          type: string
        endDate:
          description: |
            Filters for fiscal periods ending on or before this date in YYYY-MM-DD format.
            Use with `startDate` for a date range, or alone to return the most recent period on or before this date.
            If both `startDate` and `endDate` are omitted, the most recent available period is returned.
          example: 2023-12-31
          format: date
          type: string
        currency:
          description: Currency code (ISO 4217). For a list of currency codes, see
