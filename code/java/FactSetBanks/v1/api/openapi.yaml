components:
  examples:
    badRequestRequiredParameter:
      description: This error message occurs when the request does not include the
        required parameters. Required parameters are indicated with a red asterisk
        symbol in the specification file.
      summary: Bad Request - Required Parameter Missing
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Bad Request
          title: Missing Required Parameter
          detail: The parameter 'ids' is required and may not be empty.
    badRequestInvalidParameter:
      description: This error message occurs when a request parameter is not recognized
        or contains an invalid value. Please revise your request to use parameters
        and values outlined in the specification.
      summary: Bad Request - Invalid Parameter
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Bad Request
          title: Invalid Parameter
          detail: 'The ''coverage'' field must be one of: US, CANADA, AUSTRALIA, CREDIT_UNION'
    badRequestMalformedJSON:
      description: This error may be returned when the request body is specified as
        JSON but is not in proper JSON format.
      summary: Bad Request - Malformed JSON Request
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Bad Request
          title: Malformed JSON Request
          detail: Malformed JSON Request
    unauthenticated:
      description: This occurs when a user is not properly authenticated or recognized
        by the service. Please double check the USERNAME-SERIAL and API-Key used to
        request and ensure you are within the IP range specified for the Key.
      summary: User Authentication Failed
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Bad Request
          title: Authentication Failed
          detail: User Authentication Failed.
    forbidden:
      description: The USERNAME-SERIAL attempted to request an endpoint it is not
        authorized to access. Please reach out to your FactSet Account Team for assistance
        with authorization.
      summary: Forbidden
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Forbidden
          title: Authentication Failed
          detail: USERNAME-SERIAL does not have permission to use /factset-banks/v1/{endpoint}
    notFound:
      description: The requested endpoint could not be found.
      summary: Not Found
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Not Found
          title: No endpoint found
          detail: The requested endpoint could not be found.
    unsupportedMediaType:
      description: This bad request occurs when the media type passed in the request
        is not supported. Currently the APIs only support 'application/json'.
      summary: Unsupported Media Type
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Unsupported Media Type
          title: Unsupported Media Type
          detail: text/html media type is not supported. Supported media types are
            application/json
    unprocessableEntityDateRange:
      description: This error occurs when startDate is after endDate.
      summary: Validation Error - Invalid Date Range
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: ValidationError
          title: Invalid Date Range
          detail: startDate '2024-12-31' cannot be after endDate '2024-01-01'
    unprocessableEntityMetricCode:
      description: This error occurs when one or more metric codes supplied in the
        request are not valid for the requested coverage or endpoint.
      summary: Validation Error - Invalid Metric Code
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: ValidationError
          title: Invalid Metric Code
          detail: The metric 'INVALID_METRIC' is not valid. Use the /metrics endpoint
            to retrieve available metric codes.
    generalException:
      description: This is the most general error that can be returned by the service.
        Please Report Issue to FactSet.
      summary: Internal Server Error - General Exception
      value:
        errors:
        - id: adb01824-252f-4420-b0c6-35a1e3507ef5
          code: Internal Server Error
          title: Internal Server Error
          detail: An unexpected error occurred. Please try again later or contact
            FactSet support.
