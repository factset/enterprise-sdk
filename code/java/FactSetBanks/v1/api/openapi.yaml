    BranchesRequest_data:
      description: Branch query parameters.
      example:
        coverage: US
        country: CA
        locationNames:
        - Nassau
        - Suffolk
        hasDriveThru: true
        hasMemberServices: true
        hasAtm: true
        zipCodes:
        - "11501"
        - "11701"
        city: San Francisco
        postalCode: "94102"
        locationType: ALL
        marketShareType: ALL
        maxBranchCount: 6
        minTotalDeposits: 1000
        stateName: New South Wales
        countyFipsCodes:
        - "36059"
        - "36103"
        maxTotalDeposits: 0.8008281904610115
        serviceChannelType: ALL
        ids:
        - 000BDX-E
        minBranchCount: 1
        region: "ON"
        isMainOffice: true
        msaCodes:
        - "35620"
        branchTypes:
        - Full service brick and mortar branch
      properties:
        ids:
          description: Array of security identifiers. Accepted ID types include Market
            Tickers, SEDOL, ISINs, CUSIPs, or FactSet Entity IDs.
          example:
          - 000BDX-E
          items:
            type: string
          minItems: 1
          type: array
        coverage:
          description: |
            Data source region or institution type:
            * **US** — US FDIC-insured bank branches — branch counts and deposit market share by county, ZIP, and MSA
            * **CREDIT_UNION** — US credit union individual locations (NCUA)
            * **AUSTRALIA** — Australian bank service channels (APRA)
            * **GLOBAL** — Global bank locations (ex-US)
          enum:
          - US
          - CREDIT_UNION
          - AUSTRALIA
          - GLOBAL
          example: US
          type: string
        marketShareType:
          default: ALL
          description: |
            Geographic aggregation level for US FDIC deposit data (Applicable only to US):
            * **COUNTY** — Aggregated by FIPS county code (`marketShareCode` = 5-digit FIPS)
            * **ZIP** — Aggregated by ZIP code (`marketShareCode` = 5-digit ZIP)
            * **MSA** — Aggregated by Metropolitan Statistical Area (`marketShareCode` = MSA code)
            * **STATE** — One row per state (the only rows carrying a populated `state_province_code` in the underlying data)
            * **ALL** — All aggregation levels (default)

            Use the `stateCode` filter alongside any `marketShareType` to narrow
            results to a single state — e.g. `stateCode=NY` with
            `marketShareType=COUNTY` returns every New York county row.
          enum:
          - COUNTY
          - ZIP
          - MSA
          - STATE
          - ALL
          type: string
        stateCode:
          $ref: '#/components/schemas/USStateCode'
        countyFipsCodes:
          description: |
            Filter by 5-digit FIPS county codes (e.g. "36059" = Nassau, NY).
            Implicitly narrows results to county-type rows. (Applicable only to US)
          example:
          - "36059"
          - "36103"
          items:
            type: string
          type: array
        msaCodes:
          description: |
            Filter by MSA (Metropolitan Statistical Area) codes (e.g. "35620" = NY-Newark-Jersey City).
            Implicitly narrows results to msa-type rows. (Applicable only to US)
          example:
          - "35620"
          items:
            type: string
          type: array
        zipCodes:
          description: |
            Filter by 5-digit ZIP codes. Implicitly narrows results to zip-type rows. (Applicable only to US)
          example:
          - "11501"
          - "11701"
          items:
            type: string
          type: array
        locationNames:
          description: |
            Case-insensitive substring match against the county/city portion of `locationDescription`
            (e.g. ["Nassau", "Suffolk"] to match "New York, Nassau" and "New York, Suffolk").
            Use this when you know the place name but not the FIPS/MSA code. (Applicable only to US)
          example:
          - Nassau
