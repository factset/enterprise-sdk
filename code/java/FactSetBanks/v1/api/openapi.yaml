          example: USD
          maxLength: 3
          minLength: 3
          nullable: true
          type: string
        metrics:
          description: |
            Array of UBPR metric codes to retrieve. Examples include financial ratios, performance metrics, and peer group statistics. Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.
          example:
