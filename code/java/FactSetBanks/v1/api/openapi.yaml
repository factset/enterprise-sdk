  /metrics:
    get:
      description: |
        Returns list of available metrics that can be used in the metrics parameter of related endpoints.

        Use this endpoint to discover available financial metrics, their definitions, and metadata. Filter by category and subcategory to narrow results.

        **For methodology definitions**, reference the `oaPageId` or `oaUrl` response items to launch the available methodology page.
      operationId: getMetrics
      parameters:
      - description: |
          Free-text search to filter metrics whose metric code or description contains the supplied text. Case-insensitive partial matching.
        example: return on assets
        explode: true
        in: query
        name: searchText
        required: false
        schema:
          type: string
        style: form
      - description: |
          Filter metrics by major category:
          - **FINANCIALS** - Financial statement data, demographics, and core institution identifiers (US, Canada, Australia, Credit Union, Industry, Specialty Finance). Endpoint: `/financials`, `/aum`, `/focus`
          - **FILINGS** - Regulatory filing data (10-D). Endpoint: `/ten-d`
          - **PERFORMANCE** - Uniform Bank Performance Report (UBPR) metrics. Endpoint: `/ubpr`
          - **EXPOSURE** - Country exposure data (Form 009a). Endpoint: `/country-exposure`
        explode: true
        in: query
        name: category
        required: false
        schema:
          enum:
          - FINANCIALS
          - FILINGS
          - PERFORMANCE
          - EXPOSURE
          type: string
        style: form
      - description: |
          Sub-category filter for the primary category:
          - **US** - United States regulatory financials. Endpoint: `/financials`
          - **CANADA** - Canadian OSFI regulatory financials. Endpoint: `/financials`
          - **AUSTRALIA** - Australian regulatory financials. Endpoint: `/financials`
          - **CREDIT_UNION** - Credit union financial data. Endpoint: `/financials`
          - **INDUSTRY** - Industry-level financial aggregates. Endpoint: `/financials`
          - **SPECIALTY_FINANCE** - Specialty finance industry data including FOCUS reports, Form ADV, and Business Development Corporations. Endpoint: `/aum`, `/focus`
          - **TEN_D** - Form 10-D securitization filings. Endpoint: `/ten-d`
          - **UBPR** - Uniform Bank Performance Report metrics. Endpoint: `/ubpr`
          - **COUNTRY** - Country exposure metrics. Endpoint: `/country-exposure`
        explode: true
        in: query
        name: subcategory
        required: false
        schema:
          enum:
          - US
          - CANADA
          - AUSTRALIA
          - CREDIT_UNION
          - INDUSTRY
          - SPECIALTY_FINANCE
          - TEN_D
          - UBPR
          - COUNTRY
          type: string
        style: form
      - description: Filter by metric data type
        explode: true
        in: query
        name: dataType
        required: false
        schema:
          enum:
          - string
          - number
          - date
          - boolean
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Metrics Response:
                  $ref: '#/components/examples/MetricsResponseExample'
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: Available metrics data
        "400":
          content:
            application/json:
              examples:
                Bad Request - Missing Required Parameter:
                  $ref: '#/components/examples/badRequestRequiredParameter'
                Bad Request - Invalid Parameter:
                  $ref: '#/components/examples/badRequestInvalidParameter'
                Bad Request - Malformed JSON:
                  $ref: '#/components/examples/badRequestMalformedJSON'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request. This can occur for several reasons. Please review
            the "detail" for more details.
        "401":
          content:
            application/json:
              examples:
                User Authentication - Failed:
                  $ref: '#/components/examples/unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from. For more help, select the **Report Issue** in the top right corner
            of this Developer Portal specification card and choose Connectivity 401
