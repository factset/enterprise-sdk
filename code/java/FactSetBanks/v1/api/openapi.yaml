openapi: 3.0.0
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: |
    The FactSet Banks API provides comprehensive banking industry data including regulatory financials, performance metrics, branch networks, and specialized reporting across US, Canadian, and Australian institutions.

    **Key Features:**
    - Multi-jurisdiction regulatory financials (US, Canada, Australia)
    - Unified endpoint structure for banks, credit unions, and specialty finance
    - UBPR performance metrics and peer group analysis
    - Branch and ATM location data with market share
    - Country exposure and risk metrics
    - Regulatory filings (10-D, UCC-1)
    - Deposit rates and specialty finance reporting
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: FactSet Banks API
  version: 1.0.0
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/factset-banks-api
servers:
- description: Production
  url: https://api.factset.com/content/factset-banks/v1
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- description: Regulatory financial statements across jurisdictions (US, Canada, Australia)
  name: Financials
- description: Branch and ATM locations with geographic data and market share
  name: Branches
- description: UBPR ratios, performance metrics, and peer group analysis
  name: UBPR Performance
- description: Country exposure and risk concentration data (Form 009a)
  name: Exposure
- description: Regulatory filings including 10-D and UCC-1
  name: Filings
- description: Deposit rates and product-level pricing data
  name: Deposit Rates
- description: Form ADV (AUM) and FOCUS reports for specialty finance institutions
  name: Specialty Finance
- description: Metric definitions
  name: Metrics
paths:
  /financials:
    post:
      description: |
        Returns regulatory financial statements for banks and financial institutions. Use the `coverage` field to specify the data source:

        * **US** — US banks, thrifts, and depository institutions (FFIEC/FDIC/Federal Reserve sources). Covers 11,000+ bank holding companies (forms FR Y-9C/SP/LP/15) and 10,000+ banking institutions (FFIEC 031/041/051/101/102), with history back to 1991 for BHCs and 2002 for institutions. Includes demographics (charter class, specialization, established and deposit-insurance dates) and 3,000+ metrics covering profitability, capital adequacy (Basel III), loan/deposit composition, asset quality, yields, and funding costs. Also includes industry aggregates for 800+ US banking institutions with annual, quarterly, LTM, and YTD data since 2010.
        * **CANADA** — Canadian banks regulated by OSFI. 148+ institutions; 800+ data items; history since 2017. Balance sheet data is updated monthly; supplementary reports (Capital Components, Credit Losses, Derivative Contracts, Foreign Bank Branch, Income Statement) are updated quarterly.
        * **AUSTRALIA** — Australian banks regulated by APRA. 100+ institutions, interim-period balance sheet data; LTM history since 2002; 30+ data items.
        * **CREDIT_UNION** — US credit unions regulated by NCUA. 5,800+ credit unions, quarterly data since 2017; 2,400+ data items.

        Find available metrics via [`/metrics`](#operation/getMetrics) with:

        * **category**: `FINANCIALS`
        * **subcategory**: `US`, `CANADA`, `AUSTRALIA`, `CREDIT_UNION`, `INDUSTRY`
      operationId: getFinancials
      requestBody:
        content:
          application/json:
            examples:
              US Bank Request:
                $ref: '#/components/examples/FinancialsRequestUSBank'
              Canadian Bank Request:
                $ref: '#/components/examples/FinancialsRequestCanadianBank'
              Australian Bank Request:
                $ref: '#/components/examples/FinancialsRequestAustralianBank'
              Credit Union Request:
                $ref: '#/components/examples/FinancialsRequestCreditUnion'
            schema:
              $ref: '#/components/schemas/FinancialsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                US Bank Response:
                  $ref: '#/components/examples/FinancialsResponseUSBank'
                Canadian Bank Response:
                  $ref: '#/components/examples/FinancialsResponseCanadianBank'
                Australian Bank Response:
                  $ref: '#/components/examples/FinancialsResponseAustralianBank'
                Credit Union Response:
                  $ref: '#/components/examples/FinancialsResponseCreditUnion'
              schema:
                $ref: '#/components/schemas/FinancialsResponse'
          description: Successful response with financial statement data
        "400":
          content:
            application/json:
              examples:
                Bad Request - Missing Required Parameter:
                  $ref: '#/components/examples/badRequestRequiredParameter'
                Bad Request - Invalid Parameter:
                  $ref: '#/components/examples/badRequestInvalidParameter'
                Bad Request - Malformed JSON:
                  $ref: '#/components/examples/badRequestMalformedJSON'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request. This can occur for several reasons. Please review
            the "detail" for more details.
        "401":
          content:
            application/json:
              examples:
                User Authentication - Failed:
                  $ref: '#/components/examples/unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from. For more help, select the **Report Issue** in the top right corner
            of this Developer Portal specification card and choose Connectivity 401
            or 403 Responses.
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  $ref: '#/components/examples/forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. The request was a legal request, but the server
            is refusing to respond. Please reach out to FactSet Account Team for assistance
            with authorization.
        "404":
          content:
            application/json:
              examples:
                Not Found:
                  $ref: '#/components/examples/notFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The requested endpoint could not be found.
        "415":
          content:
            application/json:
              examples:
                Unsupported Media Type:
                  $ref: '#/components/examples/unsupportedMediaType'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported Media Type. This error may be returned when the
            caller sends a resource in a format that is not accepted by the server.
            This can be fixed by ensuring that Content-Type header is set to the correct
            value. In this instance, "application/json" would be the appropriate value.
        "422":
          content:
            application/json:
              examples:
                Validation Error - Invalid Date Range:
                  $ref: '#/components/examples/unprocessableEntityDateRange'
                Validation Error - Invalid Metric Code:
                  $ref: '#/components/examples/unprocessableEntityMetricCode'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unprocessable Entity. Your request data was syntactically correct but semantically invalid.
            Check the required parameters and their value constraints.
        "500":
          content:
            application/json:
              examples:
                Internal Server Error - General Exception:
                  $ref: '#/components/examples/generalException'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
      summary: Returns bank financial statement data
      tags:
      - Financials
      x-factset-sdk-main-example: true
      x-contentType: application/json
      x-accepts: application/json
  /branches:
    post:
      description: |
        Returns branch and location data for banks and financial institutions. Use the `coverage` field to specify the data source:

        * **US** — FDIC-insured bank branches with branch counts and deposit market share by county, ZIP, and MSA. 85,000+ current branches across 9,000+ banks and BHCs. Sourced from the FDIC Summary of Deposits (annual) and Institutions and Locations (weekly). Current-only feed; deposit balances as of the most recent June 30.
        * **CREDIT_UNION** — US credit union branches and ATMs with service flags. 5,800+ credit unions, 21,000+ branches, and 17,000+ ATM addresses; reported quarterly since September 2022.
        * **AUSTRALIA** — Service channel locations with remoteness classifications. 149+ banks; 30,000+ branches, 47,000+ ATMs, 6,600+ other face-to-face, and 4.9M+ EFTPOS channels. Annual data as of June 30.
        * **GLOBAL** — Global bank branches and ATMs ex-US with country, region, city, lat/long, postal, and street details where available. 300,000+ banks, 800,000+ locations, 180+ countries. Current-only feed.
      operationId: getBranches
      requestBody:
        content:
          application/json:
            examples:
              US Bank Branches:
                $ref: '#/components/examples/BranchesRequestUSBank'
              Credit Union Branches:
                $ref: '#/components/examples/BranchesRequestCreditUnion'
              Australia Branches:
                $ref: '#/components/examples/BranchesRequestAustralia'
              Global Branches:
                $ref: '#/components/examples/BranchesRequestGlobal'
            schema:
              $ref: '#/components/schemas/BranchesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
