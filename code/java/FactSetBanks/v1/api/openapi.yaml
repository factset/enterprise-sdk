    ExposureRequest_data:
      description: Country exposure query parameters.
      example:
        country: AU
        endDate: 2023-12-31T00:00:00.000+0000
        ids:
        - 000BDX-E
        currency: USD
        metrics:
        - CB_CLAIMS_EXCL_DERIV_GT
        - CLAIMS_DERIV_GT
        - CLAIMS_GT
        startDate: 2023-01-01T00:00:00.000+0000
      properties:
        ids:
          description: Array of security identifiers. Accepted ID types include Market
            Tickers, SEDOL, ISINs, CUSIPs, or FactSet Entity IDs.
          example:
          - 000BDX-E
          items:
            type: string
          minItems: 1
          type: array
        startDate:
          description: |
            Filters for fiscal periods ending on or after this date in YYYY-MM-DD format.
            Use with `endDate` for a date range, or alone to return all periods from this date forward.
            If both `startDate` and `endDate` are omitted, the most recent available period is returned.
          example: 2023-01-01
          format: date
          type: string
        endDate:
          description: |
            Filters for fiscal periods ending on or before this date in YYYY-MM-DD format.
            Use with `startDate` for a date range, or alone to return the most recent period on or before this date.
            If both `startDate` and `endDate` are omitted, the most recent available period is returned.
          example: 2023-12-31
          format: date
          type: string
        country:
          description: Filter by ISO 3166-1 alpha-2 country code (e.g., "AU", "GB").
            Omit to retrieve all countries.
          example: AU
          maxLength: 2
          minLength: 2
          type: string
        currency:
          description: Currency code (ISO 4217). For a list of currency codes, see
            [OA Page 1470](https://my.apps.factset.com/oa/pages/1470).
          example: USD
          maxLength: 3
          minLength: 3
          nullable: true
          type: string
        metrics:
          description: |
            Array of country exposure metric codes to retrieve. Available metrics include:
            - CB_CLAIMS_EXCL_DERIV_GT: Cross-border claims excluding derivatives
            - CLAIMS_DERIV_GT: Gross claims from derivative products
            - CLAIMS_GT: Total cross-border and local claims
            - LR_CLAIMS_EXCL_DERIV_GT: Local resident claims excluding derivatives
            - CLAIMS_GT_BK: Claims by borrower type - Banks
            - CLAIMS_GT_NBFI: Claims by borrower type - Non-bank financial institutions
            - CLAIMS_GT_PUB: Claims by borrower type - Public sector
            - CLAIMS_GT_OTH: Claims by borrower type - Other

            Omit to retrieve all available metrics. Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.
          example:
          - CB_CLAIMS_EXCL_DERIV_GT
          - CLAIMS_DERIV_GT
          - CLAIMS_GT
          items:
            type: string
          minItems: 1
          type: array
      required:
      - ids
      - metrics
      type: object
    TenDFilingsRequest_data:
      description: Form 10-D filing query parameters.
      example:
        endDate: 2024-12-31T00:00:00.000+0000
        ids:
        - 000BDX-E
        currency: USD
        metrics:
        - PRIN_RECEIV_END
        - RECEIV_CURR
        - RECEIV_DELQ_30_OVER
        startDate: 2024-01-01T00:00:00.000+0000
      properties:
        ids:
          description: Array of security identifiers. Accepted ID types include Market
            Tickers, SEDOL, ISINs, CUSIPs, or FactSet Entity IDs.
          example:
          - 000BDX-E
          items:
            type: string
          minItems: 1
          type: array
        startDate:
          description: |
            Filters for filings with a `filingDate` on or after this date in YYYY-MM-DD format.
            Use with `endDate` for a date range, or alone to return all filings from this date forward.
            If both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.
          example: 2024-01-01
          format: date
          type: string
        endDate:
          description: |
            Filters for filings with a `filingDate` on or before this date in YYYY-MM-DD format.
            Use with `startDate` for a date range, or alone to return the most recent filings on or before this date.
            If both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.
          example: 2024-12-31
          format: date
          type: string
        currency:
          description: Currency code (ISO 4217). For a list of currency codes, see
            [OA Page 1470](https://my.apps.factset.com/oa/pages/1470).
          example: USD
          maxLength: 3
          minLength: 3
          nullable: true
          type: string
        metrics:
          description: |
            Array of Form 10-D metric codes to retrieve. Available metrics include:
            - Principal Receivables: PRIN_RECEIV_BEG, PRIN_RECEIV_END, PRIN_RECEIV_NET_CHG
            - Finance Charge Receivables: FIN_CHRG_RECEIV_BEG, FIN_CHRG_RECEIV_END, FIN_CHRG_RECEIV_NET_CHG
            - Current/Delinquent: RECEIV_CURR, RECEIV_DELQ_1_29, RECEIV_DELQ_30_59, RECEIV_DELQ_60_89, RECEIV_DELQ_90_119, RECEIV_DELQ_120_149, RECEIV_DELQ_150_179, RECEIV_DELQ_180_OVER
            - Delinquency Percentages: RECEIV_CURR_PCT, RECEIV_DELQ_1_29_PCT, RECEIV_DELQ_30_OVER, RECEIV_DELQ_60_OVER, RECEIV_DELQ_90_OVER, RECEIV_DELQ_120_OVER, RECEIV_DELQ_150_OVER
            - Number of Receivables: NO_RECEIV_DELQ_1_29, NO_RECEIV_DELQ_30_59, NO_RECEIV_DELQ_TOT
            - Monthly Collections: MTC_PRIN, MTC_FIN_CHRG_TOT, MTC_FIN_CHRG_FEE, MTC_INVEST_INC, MTC_ICF, MTC_RECOV

            Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.
          example:
          - PRIN_RECEIV_END
          - RECEIV_CURR
          - RECEIV_DELQ_30_OVER
          items:
            type: string
          minItems: 1
          type: array
      required:
      - ids
      - metrics
      type: object
