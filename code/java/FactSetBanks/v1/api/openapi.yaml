    StartDateFiscal:
      description: |
        Filters for fiscal periods ending on or after this date in YYYY-MM-DD format.
        Use with `endDate` for a date range, or alone to return all periods from this date forward.
        If both `startDate` and `endDate` are omitted, the most recent available period is returned.
      example: 2023-01-01
      format: date
      type: string
    EndDateFiscal:
      description: |
        Filters for fiscal periods ending on or before this date in YYYY-MM-DD format.
        Use with `startDate` for a date range, or alone to return the most recent period on or before this date.
        If both `startDate` and `endDate` are omitted, the most recent available period is returned.
      example: 2023-12-31
      format: date
      type: string
    StartDateFiling:
      description: |
        Filters for filings with a `filingDate` on or after this date in YYYY-MM-DD format.
        Use with `endDate` for a date range, or alone to return all filings from this date forward.
        If both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.
      example: 2024-01-01
      format: date
      type: string
    EndDateFiling:
      description: |
        Filters for filings with a `filingDate` on or before this date in YYYY-MM-DD format.
        Use with `startDate` for a date range, or alone to return the most recent filings on or before this date.
        If both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.
      example: 2024-12-31
      format: date
      type: string
    StartDateUCC1:
      description: |
        Filters for UCC-1 filings with an `effectiveDate` on or after this date in YYYY-MM-DD format.
        Use with `endDate` for a date range, or alone to return all filings from this date forward.
        If both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.
      example: 2024-01-01
      format: date
      type: string
    EndDateUCC1:
      description: |
        Filters for UCC-1 filings with an `effectiveDate` on or before this date in YYYY-MM-DD format.
        Use with `startDate` for a date range, or alone to return all filings up to this date.
        If both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.
      example: 2024-12-31
      format: date
      type: string
    StartDateRates:
      description: |
        Filters for deposit rate records with an `asOfDate` on or after this date in YYYY-MM-DD format.
        Use with `endDate` for a date range, or alone to return all records from this date forward.
        If both `startDate` and `endDate` are omitted, the most recent available rates are returned.
      example: 2024-01-01
      format: date
      type: string
    EndDateRates:
      description: |
        Filters for deposit rate records with an `asOfDate` on or before this date in YYYY-MM-DD format.
        Use with `startDate` for a date range, or alone to return the most recent rates on or before this date.
        If both `startDate` and `endDate` are omitted, the most recent available rates are returned.
      example: 2024-12-31
      format: date
      type: string
