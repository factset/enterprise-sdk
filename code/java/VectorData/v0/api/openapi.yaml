        uploadUrl:
          description: |
            ### CRITICAL CLIENT UPLOAD PROTOCOL INSTRUCTIONS
            This is a short-lived presigned HTTPS URL for uploading the document directly to S3.

            When executing your HTTP PUT binary stream transfer out to this exact URL, your client-side code **MUST** explicitly attach these exact matching metadata headers:
            * `x-amz-meta-request-id` : Set to matching response requestId value.
            * `x-amz-meta-document-id` : Set to matching response documentID value.

            Failure to pass these identical headers will cause an immediate HTTP 403 Forbidden error from Amazon S3.
          example: https://fdss3-content-api-docs-dev.s3.amazonaws.com/vector_data/inbound......
          format: url
          type: string
      type: object
