openapi: 3.0.0
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: "\nFactSet's Vector Data API helps asset managers, hedge funds, investment\
    \ banks, and financial technology firms accelerate the development of next-generation\
    \ AI and machine learning solutions by simplifying and optimizing access to unstructured\
    \ financial documents.\n\n This API provides streamlined access to vector data\
    \ through its defined endpoints. It supports retrieving detailed vector data based\
    \ on user-defined parameters. Efficiently processing associated text data for\
    \ enhanced performance.\n\n This API is designed to enable developers to integrate\
    \ vector data into their applications, ensuring flexibility and performance while\
    \ leveraging the specified endpoint functionalities.\n\n  > Access to the AI Ready\
    \ version of FactSet collected documents with enrichments. Meant as an input to\
    \ a client's RAG experience.\n\n **Note:** Vector Data API performs semantic search\
    \ across vectorized financial documents and returns results ranked by similarity\
    \ score. Supports filtering by themes, sentiment, form types, date ranges, and\
    \ entity identifiers.\n\n `API Build & Advantages:`\n\n **AI-Ready Unstructured\
    \ Data Processing Pipeline:** Automate the ingestion, chunking, embedding, and\
    \ indexing of high-value financial text-removing the need for manual pipeline\
    \ development.\n   > **Out-of-the-box** support for FactSet proprietary and third-party\
    \ datasets (StreetAccount News, CallStreet Transcripts, EDGAR Filings, MT Newswire\
    \ and more to come).\n\n   > **Benchmark-driven** chunking strategies ensure optimal\
    \ results for GenAI and RAG use.\n\n **Platform & Embedding Model Agnostic:**\
    \ Seamlessly integrate with any AI stack-works with cloud and on-prem environments\
    \ and supports any embedding model you choose.\n\n **Native Integration with Model\
    \ Context Protocol (MCP):** Enable direct, standardized connectivity between your\
    \ unstructured data workflows and MCP-compliant AI solutions, supporting context-aware\
    \ generative AI, retrieval-augmented generation, and document-level search intelligence.\
    \ Rich Metadata, Tagging, and Entity Resolution: Enhance AI models with entity\
    \ and date resolution, topic tagging, sentiment labels, and links to FactSet's\
    \ Unstructured Knowledge Graph, enabling richer, more accurate search and analysis.\n\
    \ \n \n"
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Vector Data API
  version: 0.4.0
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/vector-data-api
servers:
- url: https://api.factset.com/content/vector/v0
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- description: Endpoints providing access to vector data. **These endpoints will be
    deprecated soon. We encourage you to explore and adopt the new **Vector Search**
    endpoints**
  name: Vector
- description: Semantic search endpoints for discovering relevant content
  name: Vector Search
- description: 'Endpoints for the Intelligent Document Service, enabling users to
    upload and search their own proprietary documents.  '
  name: Intelligent Document Service
paths:
  /data:
    post:
      description: Returns the vector information.
      operationId: postVector
      requestBody:
        content:
          application/json:
            examples:
              Request for data endpoint:
                $ref: '#/components/examples/dataRequest'
              Request for data endpoint for semantic query:
                $ref: '#/components/examples/searchRequestForQuery'
              Request for data endpoint for optional parameters:
                $ref: '#/components/examples/searchRequestForOptional'
            schema:
              $ref: '#/components/schemas/VectorDataRequest'
        description: Input parameters for vector data.
      responses:
        "200":
          content:
            application/json:
              examples:
                sampleResponse:
                  $ref: '#/components/examples/SampleVectorDataResponse'
                sampleResponseTrimmed:
                  $ref: '#/components/examples/SampleVectorDataResponseTrimmed'
              schema:
                $ref: '#/components/schemas/VectorDataResponse'
          description: Returns vector data
        "400":
          content:
            application/json:
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request.
        "401":
          content:
            application/json:
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from. For more help, select the Report Issue in the top right corner of
            this Developer Portal specification card and choose Connectivity 401 or
            403 Responses.
        "403":
          content:
            application/json:
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. The request was a legal request, but the server
            is refusing to respond. Please reach out to FactSet Account Team for assistance
            with authorization.
        "500":
          content:
            application/json:
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Return vector information based on the input parameters below
      tags:
      - Vector
      x-contentType: application/json
      x-accepts: application/json
  /chunk-text:
    get:
      description: Returns content and link of provided vector id.
      operationId: getCount
      parameters:
      - description: Unique identifier for a document
        examples:
          oneId:
            summary: One ID
            value:
            - 0001493152-24-046748-1_0001493152-24-046748-1_text_236_0
          multipleIds:
            summary: Multiple IDs
            value:
            - 0001493152-24-046748-1_0001493152-24-046748-1_text_236_0
            - 3063689-t_3063689-t_qna_3_0
        explode: true
        in: query
        name: vectorId
        required: true
        schema:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        style: form
      - description: Number of results to return per page.
        example: 20
        explode: true
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 25
          format: int32
          type: integer
        style: form
      - description: 'Page number of the results to return. '
        explode: true
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                sa200response:
                  $ref: '#/components/examples/SampleChunkTextResponseSA'
                fcst200Response:
                  $ref: '#/components/examples/SampleChunkTextResponseFCST'
                edg200Response:
                  $ref: '#/components/examples/SampleChunkTextResponseEDG'
              schema:
                $ref: '#/components/schemas/ChunkTextResponse'
          description: Success
        "400":
          content:
            application/json:
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request.
        "401":
          content:
            application/json:
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from. For more help, select the Report Issue in the top right corner of
            this Developer Portal specification card and choose Connectivity 401 or
            403 Responses.
        "403":
          content:
            application/json:
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. The request was a legal request, but the server
            is refusing to respond. Please reach out to FactSet Account Team for assistance
            with authorization.
        "500":
          content:
            application/json:
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Returns chunked text for the given vectorId.
      tags:
      - Vector
      x-accepts: application/json
