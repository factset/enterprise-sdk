    SearchRequest_data:
      description: Elements of search request.
      example:
        formTypes:
        - 10-K
        - 10-Q
        - 8-K
        sources:
        - EDG
        - FCST
        - SA
        - MTN
        endDate: 2024-12-31T00:00:00.000+0000
        query: What are companies saying about AI investment and infrastructure?
        ids:
        - AAPL-US
        - MSFT-US
        startDate: 2024-01-01T00:00:00.000+0000
        resultsBySource: false
      properties:
        query:
          description: |-
            > Natural language search query.
            > **Note:** currently, we allow the following special characters: space, `,`, `%`, `&`, `/`,` -`, `?`
          example: What are companies saying about AI investment and infrastructure?
          maxLength: 1000
          minLength: 1
          type: string
        startDate:
          description: The date for (or from which) the data is required. Supports
            in YYYY-MM-DD format.
          example: 2024-01-01
          format: date
          type: string
        endDate:
          description: The date to which data is required. Supports in YYYY-MM-DD
            format.
          example: 2024-12-31
          format: date
          type: string
        formTypes:
          description: |-
            > The search to include valid form type for the provided sources. Use the `/form-types` endpoint to get a list of all available form types.
            > **Note:** When used in conjunction with the `sources` parameter set to 'EDG', the API considers these form type values for data retrieval. For non-EDGAR/filings sources, this parameter is ignored.
          example:
          - 10-K
          - 10-Q
          - 8-K
          items:
            type: string
          maxItems: 3
          type: array
          uniqueItems: true
        sources:
          description: Data sources to search. Use the `/sources` endpoint to get
            a list of all available sources. Available sources include EDGAR (EDG),
            StreetAccount News (SA), FactSet CallStreet Transcripts (FCST), MT Newswire
            (MTN).
          example:
          - EDG
          - FCST
          - SA
          - MTN
          items:
            type: string
          maxItems: 4
          minItems: 1
          type: array
          uniqueItems: true
        ids:
          description: Requested symbols or securities. Each symbol can be a FactSet
            exchange symbol
          example:
          - AAPL-US
          - MSFT-US
          items:
            type: string
          maxItems: 100
          type: array
        resultsBySource:
          default: false
          description: |
            When true, applies the `limit` parameter individually to each specified source.
            For example, if you specify sources EDG, FCST, SA and MTN with `limit=10` and `resultsBySource=true`, you will receive up to 10 results from each source (up to 30 total).
            When false or omitted, `limit` applies to the overall number of results across all sources.
          type: boolean
      required:
      - endDate
      - query
      - sources
      - startDate
      type: object
