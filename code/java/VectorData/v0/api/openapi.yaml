  /search:
    post:
      description: Performs semantic search across vectorized financial documents
        and returns results ranked by similarity score. Supports filtering by themes
        (including ESG themes and search concepts), sentiment, form types, date ranges,
        and entity identifiers.
      operationId: postSearch
      requestBody:
        content:
          application/json:
            examples:
              basicSearchRequest:
                $ref: '#/components/examples/BasicSearchRequest'
              advancedSearchRequest:
                $ref: '#/components/examples/AdvancedSearchRequest'
            schema:
              $ref: '#/components/schemas/SearchRequest'
        description: Input parameters for semantic search.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                sampleSearchResponseSA:
                  $ref: '#/components/examples/SampleResponseSA'
                sampleSearchResponseEDG:
                  $ref: '#/components/examples/SampleResponseEDG'
                sampleSearchResponseFCST:
                  $ref: '#/components/examples/SampleResponseFCST'
                sampleSearchResponseMTN:
                  $ref: '#/components/examples/SampleResponseMTN'
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: Returns search results with similarity scores
        "400":
          content:
            application/json:
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Bad request.
        "401":
          content:
            application/json:
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from.
        "403":
          content:
            application/json:
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. Please reach out to FactSet Account Team for assistance
            with authorization.
        "422":
          content:
            application/json:
              examples:
                default422Response:
                  $ref: '#/components/examples/ValidationErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Unprocessable Entity. Validation failed for one or more request
            parameters or body fields.
        "500":
          content:
            application/json:
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Internal Server Error
      summary: Perform semantic search and return ranked results with similarity scores
      tags:
      - Vector Search
      x-contentType: application/json
      x-accepts: application/json
  /vector:
    get:
      description: Retrieves the complete vector embedding and all associated metadata
        for one or more vector IDs. Optionally returns trimmed vectors (metadata only)
        when the trimmed parameter is set to true.
      operationId: getVector
      parameters:
      - description: Unique identifier for a document
        examples:
          oneId:
            summary: One ID
            value:
            - 0001493152-24-046748-1_0001493152-24-046748-1_text_236_0
          multipleIds:
            summary: Multiple IDs
            value:
            - 0001493152-24-046748-1_0001493152-24-046748-1_text_236_0
            - 3063689-t_3063689-t_qna_3_0
        explode: true
        in: query
        name: vectorId
        required: true
        schema:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        style: form
      - description: If true, returns metadata only without vector embeddings. If
          false, includes full vector embeddings in the response.
        example: false
        explode: true
        in: query
        name: trimmed
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Number of results to return per page.
        example: 20
        explode: true
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 10
          format: int32
          maximum: 20
          minimum: 1
          type: integer
        style: form
      - description: 'Page number of the results to return. '
        explode: true
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                sampleSAresponse:
                  $ref: '#/components/examples/SampleVectorResponseSA'
                sampleEDGresponse:
                  $ref: '#/components/examples/SampleVectorResponseEDG'
                sampleFCSTresponse:
                  $ref: '#/components/examples/SampleVectorResponseFCST'
                sampleMTNresponse:
                  $ref: '#/components/examples/SampleVectorResponseMTN'
              schema:
                $ref: '#/components/schemas/VectorResponse'
          description: Success
        "400":
          content:
            application/json:
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Bad request.
        "401":
          content:
            application/json:
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from.
        "403":
          content:
            application/json:
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. Please reach out to FactSet Account Team for assistance
            with authorization.
        "404":
          content:
            application/json:
              examples:
                default500Response:
                  $ref: '#/components/examples/NotFoundDetails'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Not Found
        "422":
          content:
            application/json:
              examples:
                default422Response:
                  $ref: '#/components/examples/ValidationErrorDetails'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Unprocessable Entity. Validation failed for one or more request
            parameters or body fields.
        "500":
          content:
            application/json:
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Internal Server Error
      summary: Returns vector data and metadata for specified vector IDs
      tags:
      - Vector Search
      x-accepts: application/json
  /sources:
    get:
      description: Retrieves and delivers a comprehensive list of all available `sources`.
      operationId: retrieveSources
      parameters:
      - description: If true, returns only entitled sources. If false, returns all
          the available sources.
        example: false
        explode: true
        in: query
        name: entitledSources
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Filters type of sources.
        explode: true
        in: query
        name: type
        required: false
        schema:
          items:
            enum:
            - News
            - Filings
            - Transcripts
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                sources:
                  summary: Sample 200 Response for Sources Parameter
                  value:
                    data:
                    - source: EDG
                      description: EDGAR
                      type:
                      - Filings
                    - source: SA
                      description: StreetAccount News
                      type:
                      - News
                    - source: FCST
                      description: FactSet CallStreet Transcripts
                      type:
                      - Transcripts
                    - source: MTN
                      description: MT Newswire
                      type:
                      - News
              schema:
                $ref: '#/components/schemas/SourceResponseData'
          description: Success
        "400":
          content:
            application/json:
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Bad request.
        "401":
          content:
            application/json:
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorInfo'
              schema:
                $ref: '#/components/schemas/ErrorResult'
          description: Unauthenticated USERNAME-SERIAL. Ensure you are logged in and
            have successfully generated an API KEY for the IP range you are connecting
            from.
        "403":
          content:
            application/json:
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorInfo'
              schema:
