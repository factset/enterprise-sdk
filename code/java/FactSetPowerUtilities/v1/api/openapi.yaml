openapi: 3.0.0
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: |
    The FactSet Power & Utilities API provides comprehensive global power generation and energy market data. Coverage includes power plant metadata and technical specifications, balancing authority supply and demand, power spot and forward prices, spark spreads, capacity prices, and hourly and monthly plant-level generation and emissions.

    **Note:** Plant metadata and reference/mapping endpoints (Plants, ISO/TSO mapping, zone mapping) reflect current data only — historical or point-in-time values are not retained. The exception is `GET /reference/entity-history`, which provides historical entity and ownership records. Unit-level mapping information (unit names, EIA codes, project grades, and regional mappings) are included in the `/units/details` metadata response.

    **Key Features:**
    - Global power plant metadata including ownership, location, pipeline connections, and fuel-specific technical specifications (solar, wind, thermal)
    - Balancing authority-level generation (by fuel type), demand, and net interchange data
    - Power spot prices, spark spreads, capacity auction clearing prices, and forward power curves
    - Hourly and monthly plant-level net generation with CO₂, N₂O, and SO₂ emissions data
    - Reference data for ISO/TSO codes, price zones and hubs, and entity/ownership history

    **Units and abbreviations used throughout this API:**
    - `MW` — megawatt (unit of instantaneous power capacity)
    - `MWh` — megawatt-hour (unit of energy; one MW delivered for one hour)
    - `$/MWh` — US dollars per megawatt-hour (power price unit)
    - `$/MW-day` — US dollars per megawatt per day (capacity market price unit)
    - `MMBtu` — million British thermal units (heat input unit)
    - `Dth` — dekatherm (one million BTU; unit for natural gas interconnection capacity)
    - `CO₂` — carbon dioxide; reported in metric tons
    - `SO₂` — sulfur dioxide; reported in metric tons (hourly) or short tons (monthly)
    - `N₂O` — nitrous oxide; reported in metric tons (hourly) or short tons (monthly)
    - `BA` — Balancing Authority; a grid operator responsible for balancing generation and load within its area
    - `ISO/TSO` — Independent System Operator / Transmission System Operator
    - `EIA` — US Energy Information Administration
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: FactSet Power & Utilities API
  version: 1.0.0
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/factset-power-utilities-api
servers:
- description: Production
  url: https://api.factset.com/content/factset-power-utilities/v1
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- description: Global power plant coverage, ownership, geographic location, gas pipeline
    connections, and fuel-specific technical specifications (solar, wind, thermal/fossil).
  name: Plants
- description: Power plant unit metadata and technical details including ownership,
    pipeline connections, and fuel-specific specifications.
  name: Units
- description: Balancing authority-level net generation, electricity demand, and net
    interchange data. Single `/market-data` endpoint with a `category` discriminator
    (generation, demand, interchange).
  name: Market Data
- description: Power price data including spot power prices, spark spreads, capacity
    auction clearing prices, and forward power curves.
  name: Prices
- description: Plant and unit-level net generation and emissions (CO₂, SO₂, N₂O) at
    hourly and monthly frequencies.
  name: Generation & Emissions
- description: Reference and mapping data for ISO/TSO codes, price zones and hubs,
    and entity/ownership history.
  name: Reference
paths:
  /plants/ids:
    get:
      description: |
        Returns a paginated list of FactSet power plant asset identifiers matching the specified filter criteria, along with plant name, status, fuel type, and geographic location (nearest city, region, country, continent, and coordinates).

        For unit-level metadata and technical details, see `POST /units/details`. You can provide either plant IDs or unit IDs to `/units/details` to retrieve unit-level data with full mapping information (unit names, EIA codes, grades, regions).

        Reflects current data only; historical or point-in-time values are not retained.
      operationId: listPlantIds
      parameters:
      - description: Filter plants by ISO/TSO market area code (e.g., `"ERCOT"`, `"PJM"`
          for US ISO/RTOs; other codes for non-US TSOs as coverage expands).
        example:
        - ERCOT
        explode: true
        in: query
        name: isoCode
        required: false
        schema:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        style: form
      - description: Filter plants by country name (e.g., `"United States"`, `"Canada"`,
          `"United Kingdom"`).
        example:
        - United States
        explode: true
        in: query
        name: country
        required: false
        schema:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        style: form
      - description: Filter plants by region (e.g., a US state name such as `"Texas"`,
          `"Tennessee"`).
        example:
        - Texas
        explode: true
        in: query
        name: region
        required: false
        schema:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        style: form
      - description: Filter plants by operational status.
        example:
        - Operational
        explode: true
        in: query
        name: plantStatus
        required: false
        schema:
          items:
            enum:
            - Operational
            - Planned
            - Retired
            - Cancelled
            type: string
          minItems: 1
          type: array
        style: form
      - description: Filter results to the specified FactSet plant asset identifiers.
          If omitted, all plants matching other filter criteria are returned.
        example:
        - B00121-M
        explode: true
        in: query
        name: plantIds
        required: false
        schema:
          items:
            type: string
          maxItems: 50
          minItems: 1
          type: array
        style: form
      - description: Filter plants by minimum nameplate capacity in megawatts (MW),
          inclusive. Returns plants with capacity greater than or equal to this value.
        example: 100
        explode: true
        in: query
        name: minCapacityMw
        required: false
        schema:
          minimum: 0
          type: number
        style: form
      - description: Filter plants by maximum nameplate capacity in megawatts (MW),
          inclusive. Returns plants with capacity less than or equal to this value.
        example: 5000
        explode: true
        in: query
        name: maxCapacityMw
        required: false
        schema:
          minimum: 0
          type: number
        style: form
      - description: Maximum number of results to return per request.
        explode: false
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 100
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: Number of results to skip. Use with `_paginationLimit` for paging
          through large result sets.
        explode: false
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Plant IDs Response:
                  $ref: '#/components/examples/PlantIdsResponseExample'
              schema:
                $ref: '#/components/schemas/PlantIdsResponse'
          description: Successful response with a list of plant identifiers
        "400":
          content:
            application/json:
              examples:
                Bad Request:
                  $ref: '#/components/examples/badRequestRequiredParameter'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request — the request was malformed or a required parameter
            was missing.
        "401":
          content:
            application/json:
              examples:
                Unauthenticated:
                  $ref: '#/components/examples/unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthenticated — no valid credentials were provided.
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  $ref: '#/components/examples/forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden — the credentials provided do not have access to
            this resource.
        "404":
          content:
            application/json:
              examples:
                Not Found:
                  $ref: '#/components/examples/notFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found — the requested resource was not found.
        "429":
          content:
            application/json:
              examples:
                Too Many Requests:
                  $ref: '#/components/examples/tooManyRequests'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests — the rate limit for this endpoint has been
            exceeded.
        "500":
          content:
            application/json:
              examples:
                Internal Server Error:
                  $ref: '#/components/examples/internalServerError'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error — an unexpected error occurred on the
            server.
        "503":
          content:
            application/json:
              examples:
                Service Unavailable:
                  $ref: '#/components/examples/serviceUnavailable'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable — the service is temporarily unavailable.
      summary: Returns discoverable power plant IDs
      tags:
      - Plants
      x-accepts: application/json
  /units/details:
    post:
      description: |
        Returns metadata and technical detail data for one of five categories, selected via the `category` discriminator in the request body:

        * **`Metadata`** — General plant metadata: plant name, ISO/TSO assignment, primary fuel type, nameplate capacity, operational status, owner details, and key lifecycle dates.
        * **`Pipeline`** — Gas pipeline connections: pipeline name and pipeline sequence (for units supplied by more than one pipeline).
        * **`Solar`** — Solar-specific technical specifications: installed capacity (DC), array/tracking type, tilt and azimuth angle, thin-film flag, and land area.
        * **`Wind`** — Wind turbine technical specifications: turbine count, model, manufacturer, hub height, and rotor swept area.
        * **`Thermal`** — Thermal/fossil technical specifications: design heat rate.

        For unit ownership details, use `POST /units/ownership`.

        This endpoint operates at the unit level, matching the underlying source data.

        Reflects current data only; historical or point-in-time values are not retained.

        **Input flexibility:** You can provide either plant IDs or unit IDs. When you provide a plant ID, all units within that plant are returned. Unit names, parent plant IDs, EIA codes, project grades, and regional mappings are included in the metadata response.
      operationId: listPlantUnits
      requestBody:
        content:
          application/json:
            examples:
              Metadata Request:
                $ref: '#/components/examples/PlantMetadataRequestExample'
              Pipeline Request:
                $ref: '#/components/examples/PlantPipelineRequestExample'
