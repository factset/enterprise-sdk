  responses:
    "400":
      content:
        application/json:
          examples:
            Bad Request:
              $ref: '#/components/examples/badRequestRequiredParameter'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Bad Request — the request was malformed or a required parameter
        was missing.
    "401":
      content:
        application/json:
          examples:
            Unauthenticated:
              $ref: '#/components/examples/unauthenticated'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unauthenticated — no valid credentials were provided.
    "403":
      content:
        application/json:
          examples:
            Forbidden:
              $ref: '#/components/examples/forbidden'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Forbidden — the credentials provided do not have access to this
        resource.
    "404":
      content:
        application/json:
          examples:
            Not Found:
              $ref: '#/components/examples/notFound'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Not Found — the requested resource was not found.
    "415":
      content:
        application/json:
          examples:
            Unsupported Media Type:
              $ref: '#/components/examples/unsupportedMediaType'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unsupported Media Type — the request body was not JSON or the Content-Type
        header was missing.
    "422":
      content:
        application/json:
          examples:
            Unprocessable Entity:
              $ref: '#/components/examples/unprocessableEntity'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unprocessable Entity — the request was syntactically valid but
        semantically incorrect (e.g., invalid date range).
    "429":
      content:
        application/json:
          examples:
            Too Many Requests:
              $ref: '#/components/examples/tooManyRequests'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Too Many Requests — the rate limit for this endpoint has been exceeded.
    "500":
      content:
        application/json:
          examples:
            Internal Server Error:
              $ref: '#/components/examples/internalServerError'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Internal Server Error — an unexpected error occurred on the server.
    "503":
      content:
        application/json:
          examples:
            Service Unavailable:
              $ref: '#/components/examples/serviceUnavailable'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Service Unavailable — the service is temporarily unavailable.
  schemas:
    PlantIds:
      description: Array of FactSet power plant asset identifiers (e.g., `"B00121-M"`).
        Use `GET /plants/ids` to discover valid identifiers.
      example:
      - B00121-M
      - B00987-M
      items:
        type: string
      maxItems: 100
      minItems: 1
      type: array
    PlantUnitIds:
      description: Array of FactSet power plant and/or plant unit asset identifiers.
        Accepts both plant IDs (e.g., `"B00121-M"`) and unit IDs (e.g., `"05RLSM-M"`).
        When a plant ID is provided, all units within that plant are returned.
      example:
      - B00121-M
      - 05RLSM-M
      items:
        type: string
      maxItems: 100
      minItems: 1
      type: array
    BalancingAuthorityIds:
      description: Array of FactSet balancing authority identifiers (e.g., `"05WTSJ-M"`).
        Used for the `Generation` category, which is reported at the balancing-authority
        level.
      example:
      - 05WTSJ-M
      items:
        type: string
      maxItems: 100
      minItems: 1
      type: array
    BalancingAuthoritySubRegionIds:
      description: Array of FactSet balancing authority sub-region identifiers (e.g.,
        `"05WTTF-M"`). Used for the `Demand` and `Interchange` categories, which are
        reported at the sub-region level.
      example:
      - 05WTTF-M
      items:
        type: string
      maxItems: 100
      minItems: 1
      type: array
    LocationIds:
      description: Array of power price location identifiers such as hub or zone codes
        (e.g., `"HB_NORTH"`, `"PJM_ATSI_BASE"`).
      example:
      - HB_NORTH
      - HB_HOUSTON
      items:
        type: string
      maxItems: 100
      minItems: 1
      type: array
    RequestPagination:
      description: Pagination parameters to control the size and offset of results
        returned.
      example:
        offset: 0
        limit: 81
      properties:
        limit:
          default: 100
          description: Maximum number of results to return per request.
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        offset:
          default: 0
          description: Number of results to skip. Use with `limit` for paging through
            large result sets.
          format: int32
          minimum: 0
          type: integer
      type: object
    RequestMeta:
      description: Optional request metadata for pagination control.
      example:
        pagination:
          offset: 0
          limit: 81
      properties:
        pagination:
          $ref: '#/components/schemas/RequestPagination'
      type: object
    ResponsePagination:
      description: Pagination details included in every collection response.
      example:
        total: 4250
        isEstimatedTotal: false
      properties:
        total:
          description: Total number of records the API returns for this query.
          example: 4250
          format: int64
          type: integer
        isEstimatedTotal:
          description: Whether the total count is exact or an estimate. Defaulted
            to `false` as the API returns exact counts.
          example: false
          type: boolean
      type: object
    ResponseMeta:
      description: Response metadata including pagination and request tracking.
      example:
        requestedIds: 2
        pagination:
          total: 4250
          isEstimatedTotal: false
        failedIds: []
      properties:
        pagination:
          $ref: '#/components/schemas/ResponsePagination'
        requestedIds:
          description: Total number of identifiers submitted in the request.
          example: 2
          format: int32
          type: integer
        failedIds:
          description: List of identifiers from the request that failed (invalid format,
            empty, or not found). Empty array when all submitted IDs resolved successfully.
          example: []
          items:
            type: string
          type: array
      type: object
    CollectionResponseMeta:
      description: Response metadata for endpoints that discover or list records rather
        than accepting requested identifiers. Includes pagination only.
      example:
        pagination:
          total: 4250
          isEstimatedTotal: false
      properties:
        pagination:
          $ref: '#/components/schemas/ResponsePagination'
      type: object
    ErrorResponse:
      description: Standard error response envelope.
      properties:
        errors:
          description: Array of one or more error objects describing what went wrong.
          items:
            $ref: '#/components/schemas/ErrorObject'
          type: array
      type: object
    ErrorObject:
      description: Individual error detail.
      properties:
        id:
          description: Unique error identifier for tracing.
          example: adb01824-252f-4420-b0c6-35a1e3507ef5
          format: uuid
          type: string
        code:
          description: Machine-readable error code in camelCase.
          example: parameterError
          type: string
        title:
          description: Short human-readable summary matching the HTTP status reason
            phrase.
          example: Bad Request
          type: string
        detail:
          description: Detailed human-readable explanation of this error occurrence.
          example: The parameter 'ids' is required and may not be empty.
          type: string
        links:
          $ref: '#/components/schemas/ErrorObject_links'
      required:
      - code
      - detail
      - title
      type: object
    CategoryMetadata:
      description: Discriminator value for plant unit metadata records.
      enum:
      - Metadata
      example: Metadata
      type: string
    CategoryPipeline:
      description: Discriminator value for plant pipeline connection records.
      enum:
      - Pipeline
      example: Pipeline
      type: string
    CategorySolar:
      description: Discriminator value for solar plant technical specifications.
      enum:
      - Solar
      example: Solar
      type: string
    CategoryWind:
      description: Discriminator value for wind plant technical specifications.
      enum:
      - Wind
      example: Wind
      type: string
    CategoryThermal:
      description: Discriminator value for thermal/fossil plant technical specifications.
      enum:
      - Thermal
      example: Thermal
      type: string
    CategoryGeneration:
      description: Discriminator value for balancing authority net generation.
      enum:
      - Generation
      example: Generation
      type: string
    CategoryDemand:
      description: Discriminator value for balancing authority electricity demand.
      enum:
