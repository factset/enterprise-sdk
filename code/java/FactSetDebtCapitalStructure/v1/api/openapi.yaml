    DetailsResponse:
      example:
        data:
        - instrumentType: Revolving Credit
          amountOutstanding: 250
          instrumentId: FDS1R56X6
          description: Unsec. Rev. Facility
          couponRate: 2.9
          reportDate: 2020-11-19T00:00:00.000+0000
          yieldToWorst: 2.9
          couponType: Variable
          maturityDate: 2020-11-19T00:00:00.000+0000
          requestId: IBM-USA
          currency: USD
          issueDate: 2020-11-19T00:00:00.000+0000
          seniority: Senior Secured
        - instrumentType: Revolving Credit
          amountOutstanding: 250
          instrumentId: FDS1R56X6
          description: Unsec. Rev. Facility
          couponRate: 2.9
          reportDate: 2020-11-19T00:00:00.000+0000
          yieldToWorst: 2.9
          couponType: Variable
          maturityDate: 2020-11-19T00:00:00.000+0000
          requestId: IBM-USA
          currency: USD
          issueDate: 2020-11-19T00:00:00.000+0000
          seniority: Senior Secured
      properties:
        data:
          description: Array of Details Objects
          items:
            $ref: '#/components/schemas/Detail'
          type: array
      title: Details Response
      type: object
    Detail:
      example:
        instrumentType: Revolving Credit
        amountOutstanding: 250
        instrumentId: FDS1R56X6
        description: Unsec. Rev. Facility
        couponRate: 2.9
        reportDate: 2020-11-19T00:00:00.000+0000
        yieldToWorst: 2.9
        couponType: Variable
        maturityDate: 2020-11-19T00:00:00.000+0000
        requestId: IBM-USA
        currency: USD
        issueDate: 2020-11-19T00:00:00.000+0000
        seniority: Senior Secured
      properties:
        instrumentId:
          description: Identifier for the debt instrument.
          example: FDS1R56X6
          nullable: true
          type: string
        instrumentType:
          description: Type of debt instrument.
          enum:
          - Revolving Credit
          - Term Loans
          - ST Debt Total
          - Notes/Bonds
          - Other
          example: Revolving Credit
          nullable: true
          type: string
        description:
          description: Description of the debt instrument.
          example: Unsec. Rev. Facility
          nullable: true
          type: string
        seniority:
          description: |
            Textual description of the instrument seniority type:
            * **Senior Unsecured**
            * **Senior Secured**
            * **Senior Subordinated**
            * **Collateralized**
            * **Subordinated**
            * **Junior**
            * **Junior Subordinated**
            * **Senior Conv.** = Senior Convertible
            * **Senior Sub. Conv.** = Senior Subordinated Convertible
            * **Sub. Conv.** = Subordinated Convertible
            * **Junior Conv.** = Junior Convertible
            * **Junior Sub. Conv.** = Junior Subordinated Convertible
            * **Preferred**
            * **Other**
          enum:
          - Senior Unsecured
          - Senior Secured
          - Senior Subordinated
          - Collateralized
          - Subordinated
          - Junior
          - Junion Subordinated
          - Senior Conv.
          - Senior Sub. Conv.
          - Sub. Conv.
          - Junior Conv.
          - Junion Sub. Conv.
          - Preferred
          - Other
          example: Senior Secured
          nullable: true
          type: string
        amountOutstanding:
          description: Balance sheet amount outstanding.
          example: 250
          nullable: true
          type: number
        currency:
          description: 'Currency code for the data. For a list of currency ISO codes,
            visit [Online Assistant Page #1470](https://oa.apps.factset.com/pages/1470).'
          example: USD
          nullable: true
          type: string
        couponRate:
          description: Coupon rate for the debt instrument.
          example: 2.9
          nullable: true
          type: number
        couponType:
          description: Type of debt instrument.
          enum:
          - Variable
          - Fixed
          - Cond
          - Zero
          example: Variable
          nullable: true
          type: string
        yieldToWorst:
          description: Most recent annual yield to worst value for the debt instrument.
          example: 2.9
          nullable: true
          type: number
        issueDate:
          description: Issue date for the debt instrument.
          example: 2020-11-19
          format: date
          nullable: true
          type: string
        reportDate:
          description: Reporting date for the debt instrument.
          example: 2020-11-19
          format: date
          nullable: true
          type: string
        maturityDate:
          description: Maturity date for the debt instrument.
          example: 2020-11-19
          format: date
          nullable: true
          type: string
        requestId:
          description: Identifier that was used for the request.
          example: IBM-USA
          type: string
      title: Detail Object
      type: object
    Date:
      description: Date in YYYY-MM-DD format.
      example: 2023-12-31
      format: date
      type: string
    Ids:
      description: |
        The requested list of security identifiers. Accepted ID types include Market Tickers, SEDOL, ISINs, CUSIPs, or FactSet Permanent Ids. Maximum of 25 IDs are supported.
      example:
      - FDS-US
      items:
        type: string
      type: array
    Periodicity:
      default: ANN
      description: |
        Periodicity of the fiscal periods, where
          * **ANN** = Annual Original,
          * **QTR** = Quarterly
      enum:
      - ANN
      - QTR
      example: QTR
      title: Periodicity
      type: string
    StartDate:
      description: |
        The date of the period requested in **YYYY-MM-DD** format. Future dates (T+1) are not accepted in this endpoint.
      example: 2017-12-01
      format: date
      title: StartDate
      type: string
    EndDate:
      description: |
        The date of the period requested in **YYYY-MM-DD** format. Future dates (T+1) are not accepted in this endpoint.
      example: 2018-12-01
      format: date
      title: EndDate
      type: string
    Frequency:
      default: AM
      description: |
        Controls the frequency of the data returned.
          * **D** = Daily
          * **W** = Weekly, based on the last day of the week of the start date.
          * **AM** = Monthly, based on the start date (e.g., if the start date is June 16, data is displayed for June 16, May 16, April 16 etc.).
          * **AQ** = Quarterly, based on the start date
          * **AY** = Actual Annual, based on the start date.
      enum:
      - D
      - W
      - AM
      - AQ
      - AY
      example: AM
      title: Frequency
      type: string
    Term:
      default: SHORT_TERM
      description: |
        Specifies whether to select short-term or long-term liquidity options.
          * **SHORT_TERM** = Short Term.
          * **LONG_TERM** = Long Term.
      enum:
      - SHORT_TERM
      - LONG_TERM
      example: SHORT_TERM
      title: Term
      type: string
    Metrics:
      description: |
        Requested List of Financial Statement Items or Ratios.
      items:
        example: '["total_st_debt"]'
        maxItems: 100
        minItems: 1
        type: string
      title: Metrics
      type: array
    Currency:
      default: LOCAL
      description: |
        Currency code for currency values. For a list of currency ISO codes, visit Online Assistant Page [OA1470](https://my.apps.factset.com/oa/pages/1470).
      example: USD
      title: Currency
      type: string
    ErrorResponse:
      description: Error Default Response
      properties:
        errors:
          description: An array containing errors
          items:
            $ref: '#/components/schemas/ErrorObject'
          type: array
      title: Error Response
      type: object
    ErrorObject:
      properties:
        id:
          description: A UUID for this particular occurrence of the problem.
          example: adb01824-252f-4420-b0c6-35a1e3507ef5
          type: string
        code:
          description: status
          example: Bad Request
          type: string
        title:
          description: The plain text error message
          example: Validation Error
          type: string
        detail:
          description: The detailed error message
          example: The request body is malformed. Please review the request body and
            try again.
          type: string
      type: object
