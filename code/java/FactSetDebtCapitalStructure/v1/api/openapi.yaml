          example: 2018-12-01
          format: date
          title: EndDate
          type: string
        frequency:
          $ref: '#/components/schemas/Frequency'
        metrics:
          description: |
            Requested List of Financial Statement Items or Ratios.
          items:
            example: '["total_st_debt"]'
            maxItems: 100
            minItems: 1
            type: string
          title: Metrics
          type: array
        currency:
          default: LOCAL
          description: |
            Currency code for currency values. For a list of currency ISO codes, visit Online Assistant Page [OA1470](https://my.apps.factset.com/oa/pages/1470).
          example: USD
          title: Currency
          type: string
      required:
      - ids
      - metrics
      - startDate
      title: DCS Totals Request Body
      type: object
    LiquidityRequest:
