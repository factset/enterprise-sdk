          example: 2017-12-01
          format: date
          title: StartDate
          type: string
        term:
          $ref: '#/components/schemas/Term'
        metrics:
          description: |
            Requested List of Financial Statement Items or Ratios.
          items:
            example: '["total_st_debt"]'
            maxItems: 100
            minItems: 1
            type: string
          title: Metrics
          type: array
      required:
      - ids
      - metrics
      - startDate
      title: Liquidity Request Body
      type: object
    DetailsRequest:
