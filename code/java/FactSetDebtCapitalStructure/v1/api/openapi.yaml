          category: secured/unsecured
        - metric: total_lt_secured_debt
          description: Total long-term secured debt
          category: secured/unsecured
      properties:
        data:
          description: |
            Array of metric objects representing the data items that can be requested from the Debt Capital Structure API.
          items:
            $ref: '#/components/schemas/Metric'
          type: array
      title: Metrics Response
      type: object
    Metric:
      description: Metric Object
      example:
        metric: total_lt_secured_debt
        description: Total long-term secured debt
        category: secured/unsecured
      properties:
