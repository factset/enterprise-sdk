openapi: 3.0.3
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: A service that provides access to Real Time or Delayed data snapped
    at hourly intervals for an entire Exchange. Clients that need access to the DFSnapshot
    product for a custom watchlist snapped at a client specified interval should use
    this API
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Exchange Snapshot API
  version: 1.0.1
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/exchange-datafeed-snapshot-api-entire-exchange
servers:
- url: https://api.factset.com/bulk-documents/exchange-snapshot/v1
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- description: Operations for retrieving exchange data snapshots
  name: ExchangeSnapshot
paths:
  /list-files:
    get:
      description: A service that provides access to Real Time or Delayed data snapped
        at hourly intervals for an entire Exchange
      operationId: getListFiles
      parameters:
      - description: any product subscribed by client
        explode: true
        in: query
        name: product
        required: true
        schema:
          example: 10001
          type: integer
        style: form
      - description: YYYYMMDD (Choose between 1 and 4 previous trading days). Also
          accepts `start_date` (snake_case), which is deprecated and exists for backward
          compatibility.
        explode: true
        in: query
        name: startDate
        required: true
        schema:
          format: date
          type: string
        style: form
      - description: YYYYMMDD (Choose between 1 and 4 previous trading days, greater
          than or equal to start date). Also accepts `end_date` (snake_case), which
          is deprecated and exists for backward compatibility.
        explode: true
        in: query
        name: endDate
        required: true
        schema:
          format: date
          type: string
        style: form
      - description: HHMM (24 hour time EST). Also accepts `start_time` (snake_case),
          which is deprecated and exists for backward compatibility.
        explode: true
        in: query
        name: startTime
        required: true
        schema:
          type: string
        style: form
      - description: HHMM (24 hour time EST). Also accepts `end_time` (snake_case),
          which is deprecated and exists for backward compatibility.
        explode: true
        in: query
        name: endTime
        required: true
        schema:
          type: string
        style: form
      - description: Option to select from static, DL or RT data
        explode: true
        in: query
        name: access
        required: false
        schema:
          default: DL
          enum:
          - static
          - DL
          - RT
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                sampleResponse:
                  $ref: '#/components/examples/sampleResponse'
              schema:
                $ref: '#/components/schemas/EntireExchangeSnapshotResponse'
          description: 'Success '
        "400":
          content:
            application/json:
              examples:
                badRequest:
                  $ref: '#/components/examples/badRequest'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            text/plain:
              schema:
                example: Authentication Failed
                type: string
          description: Authentication Failed
        "403":
          content:
            application/json:
              examples:
                Unauthorized:
                  $ref: '#/components/examples/forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The USERNAME-SERIAL attempted to request the endpoint is not
            authorized to access. The request was legal, but the server is refusing
            to respond. Please reach out to FactSet Account Team for assistance with
            authorization.
        "408":
          content:
            application/json:
              examples:
                Unauthorized:
                  $ref: '#/components/examples/timeout'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Request Timeout
        "500":
          content:
            application/json:
              examples:
                internalServerError:
                  $ref: '#/components/examples/internalServerError'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: List Files service returns downloadable Real Time, Delayed or Static
        Exchange Snapshot files for a specified product, date range, and time range
      tags:
      - ExchangeSnapshot
      x-accepts: application/json
components:
  examples:
    sampleResponse:
      summary: Sample Response
      value:
        data:
        - product: "10001"
          date: "20210604"
          time: "0800"
          responseType: DL
          fileName: 10001_20210604-0800.csv.gz
          url: https://cdn.example.com/file.csv.gz
        meta:
          sort:
          - ""
          pagination:
            total: 1
            isEstimatedTotal: false
            limit: 1
            offset: 1
          partial:
            isPartial: false
    forbidden:
      description: The USERNAME-SERIAL attempted to request the endpoint/ID which
        is not authorized to access. The request was legal, but the server is refusing
        to respond. Please reach out to FactSet Account Team for assistance with authorization.
      summary: Forbidden
      value:
        id: adb01824-252f-4420-b0c6-35a1e3507ef5
        code: notAuthorized
        title: USERNAME-SERIAL does not have permission to use this endpoint.
    badRequest:
      description: The User is forbidden access or has provided incorrect parameters.
      summary: Bad Request
      value:
        id: adb01824-252f-4420-b0c6-35a1e3507ef5
        code: parameterError
        title: Error:User is forbidden access with current credentials
    timeout:
      description: Request Timed Out as it too long for the server to respond.
      summary: Request Time Outstanding.
      value:
        id: adb01824-252f-4420-b0c6-35a1e3507ef5
        code: Request Timeout
        title: Error:Request Timeout
    internalServerError:
      description: An unexpected error occurred while processing the request.
      summary: Internal Server Error
      value:
        id: adb01824-252f-4420-b0c6-35a1e3507ef5
        code: genericServerError
        title: 'Error: An unexpected error occurred while processing the request.'
  parameters:
    product:
      description: any product subscribed by client
      explode: true
      in: query
      name: product
      required: true
      schema:
        example: 10001
        type: integer
      style: form
    startDate:
      description: YYYYMMDD (Choose between 1 and 4 previous trading days). Also accepts
        `start_date` (snake_case), which is deprecated and exists for backward compatibility.
      explode: true
      in: query
      name: startDate
      required: true
      schema:
        format: date
        type: string
      style: form
    endDate:
      description: YYYYMMDD (Choose between 1 and 4 previous trading days, greater
        than or equal to start date). Also accepts `end_date` (snake_case), which
        is deprecated and exists for backward compatibility.
      explode: true
      in: query
      name: endDate
      required: true
      schema:
        format: date
        type: string
      style: form
    startTime:
      description: HHMM (24 hour time EST). Also accepts `start_time` (snake_case),
        which is deprecated and exists for backward compatibility.
      explode: true
      in: query
      name: startTime
      required: true
      schema:
        type: string
      style: form
    endTime:
      description: HHMM (24 hour time EST). Also accepts `end_time` (snake_case),
        which is deprecated and exists for backward compatibility.
      explode: true
      in: query
      name: endTime
      required: true
      schema:
        type: string
      style: form
    access:
      description: Option to select from static, DL or RT data
      explode: true
      in: query
      name: access
      required: false
      schema:
        default: DL
        enum:
        - static
        - DL
        - RT
        type: string
      style: form
  responses:
    "400":
      content:
        application/json:
          examples:
            badRequest:
              $ref: '#/components/examples/badRequest'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Bad Request
    "401":
      content:
        text/plain:
          schema:
            example: Authentication Failed
            type: string
      description: Authentication Failed
    "403":
      content:
        application/json:
          examples:
            Unauthorized:
              $ref: '#/components/examples/forbidden'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The USERNAME-SERIAL attempted to request the endpoint is not authorized
        to access. The request was legal, but the server is refusing to respond. Please
        reach out to FactSet Account Team for assistance with authorization.
    "408":
      content:
        application/json:
          examples:
            Unauthorized:
              $ref: '#/components/examples/timeout'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Request Timeout
    "500":
      content:
        application/json:
          examples:
            internalServerError:
              $ref: '#/components/examples/internalServerError'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Internal Server Error
  schemas:
    EntireExchangeSnapshotResponse:
      description: Response containing the list of matching exchange snapshot files
        along with pagination metadata.
      example:
        data:
        - date: date
          product: product
          responseType: responseType
          fileName: fileName
          time: time
          url: url
        - date: date
          product: product
          responseType: responseType
          fileName: fileName
          time: time
          url: url
        meta:
          pagination:
            total: 0
            offset: 1
            limit: 6
            isEstimatedTotal: true
          sort:
          - sort
          - sort
          partial:
            isPartial: true
      properties:
        data:
          description: Array of exchange snapshot file entries matching the requested
            product, date, and time range.
          items:
            $ref: '#/components/schemas/EntireExchangeItems'
          type: array
        meta:
          $ref: '#/components/schemas/meta'
      type: object
    EntireExchangeItems:
      description: Entire Exchange Item
      example:
        date: date
        product: product
        responseType: responseType
        fileName: fileName
        time: time
        url: url
      properties:
        product:
          description: Product (Exchange) Code for which the data is requested
          type: string
        date:
          description: Date for which the snapshot is generated
          type: string
        time:
          description: Time for which the snapshot is generated
          type: string
        responseType:
          description: Type of data "RT" or "DL"
          type: string
        fileName:
          description: fileName a combination of product code, date of snapshot &
            time of snapshot
          type: string
        url:
          description: download link of snapshot file
          type: string
      type: object
    ErrorResponse:
      description: Error Default Response
      properties:
        id:
          description: A UUID for this particular occurrence of the problem.
          example: adb01824-252f-4420-b0c6-35a1e3507ef5
          format: uuid
          type: string
        code:
          description: A short code identifying the error type.
          example: notAuthorized
          type: string
        title:
          description: The plain text error message
          example: 'Error: Invalid start date parameter'
          type: string
      title: Error Response
      type: object
    meta_pagination:
      description: Pagination details for the returned `data` array.
      example:
        total: 0
        offset: 1
        limit: 6
        isEstimatedTotal: true
      properties:
        total:
          description: Total number of records available
          type: integer
        isEstimatedTotal:
          description: Whether the total is an estimate
          type: boolean
        limit:
          description: Maximum number of records returned
          type: integer
        offset:
          description: Number of records skipped
          type: integer
      type: object
    meta_partial:
      description: Indicates whether the returned data set is incomplete.
      example:
        isPartial: true
      properties:
        isPartial:
          description: Whether the response contains partial data
          type: boolean
      type: object
    meta:
      description: Metadata about the response
      example:
        pagination:
          total: 0
          offset: 1
          limit: 6
          isEstimatedTotal: true
        sort:
        - sort
        - sort
        partial:
          isPartial: true
      properties:
        sort:
          items:
            type: string
          type: array
        pagination:
          $ref: '#/components/schemas/meta_pagination'
        partial:
          $ref: '#/components/schemas/meta_partial'
      title: meta
      type: object
  securitySchemes:
    FactSetOAuth2:
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://auth.factset.com/as/token.oauth2
      type: oauth2
    FactSetApiKey:
      scheme: basic
      type: http

