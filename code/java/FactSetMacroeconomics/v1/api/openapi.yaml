        "403":
          content:
            application/json:
              examples:
                authorizationFailed:
                  $ref: '#/components/examples/Forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Forbidden - You do not have permission to access this endpoint or resource. Your API key or account may not have the required access level. Please reach out to your FactSet Account Team for assistance with authorization.
        "404":
          content:
            application/json:
              examples:
                endpointNotFound:
                  $ref: '#/components/examples/NotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Not Found - The requested endpoint or resource does not exist. Please verify that the endpoint path is correct, all required path parameters are provided, and the resource identifier (if any) is valid.
        "422":
          content:
            application/json:
              examples:
                invalidDateFormat:
                  $ref: '#/components/examples/BadRequest'
                invalidParameterValue:
                  $ref: '#/components/examples/BadRequestInvalidParameterFormat'
                missingRequiredParameter:
                  $ref: '#/components/examples/BadRequestMissingRequiredParameter'
                invalidEnumValue:
                  $ref: '#/components/examples/UnprocessableEntity'
                invalidDateRange:
                  $ref: '#/components/examples/InvalidDateRange'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unprocessable Entity - Your request data was syntactically correct but semantically invalid. This can occur for validation errors such as invalid date format, invalid parameter values, missing required parameters, invalid enum values, or invalid date ranges. Check the required parameters and their value constraints.
        "429":
          content:
            application/json:
              examples:
                RateLimitExceeded:
                  $ref: '#/components/examples/RateLimitExceeded'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Too Many Requests - You have exceeded the allowed request rate for this API. Please wait and retry your request after some time.
        "500":
          content:
            application/json:
              examples:
                serverError:
                  $ref: '#/components/examples/InternalServerError'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Internal Server Error - An unexpected error occurred on the server. Please try your request again. If the problem persists, contact FactSet support and provide the error ID from the response for investigation.
      summary: Retrieve reference data for events
      tags:
      - Reference Data
      x-accepts: application/json
  /meta/series:
    get:
      description: Returns series metadata with FDS code mappings. Use this endpoint
        to discover available series, categories, and FDS code associations.
      operationId: getFdsCodeMapping
      parameters:
      - description: Text to search for within series names. Restricts results to
          only series that match the provided search text.
        explode: true
        in: query
        name: searchText
        required: false
        schema:
          example: GDP
          type: string
        style: form
      - description: |
          Filter series by major category. The supported categories are:

          - `ECONOMICS`: Economic indicators and metrics.
          - `INTEREST_RATES`: Interest rate data and related metrics.

          Multiple categories can be provided as comma-separated values.
        examples:
          singleCategory:
            summary: Single category
            value:
            - ECONOMICS
          multipleCategories:
            summary: Multiple categories
            value:
            - ECONOMICS
            - INTEREST_RATES
        explode: false
        in: query
