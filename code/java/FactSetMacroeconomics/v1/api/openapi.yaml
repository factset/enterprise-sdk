                filteredByIndicator:
                  $ref: '#/components/examples/FdsCodeMappingFilteredExample'
                partialResults:
                  $ref: '#/components/examples/FdsCodeMappingPartialExample'
              schema:
                $ref: '#/components/schemas/MetaSeriesResponse'
          description: Successfully retrieved economic series metadata.
        "400":
          content:
            application/json:
              examples:
                malformedQueryString:
                  $ref: '#/components/examples/MalformedQueryString'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Bad Request. The request contains syntax errors or is malformed (e.g., malformed JSON, invalid protocol formatting, illegal characters in query strings). The server cannot parse the request.
        "401":
          content:
            application/json:
              examples:
                authenticationFailed:
