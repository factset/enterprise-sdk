openapi: 3.0.0
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: |
    The FactSet Macroeconomics API provides access to economic calendar events and historical time series data for global economic indicators. Use the reference endpoints to discover available indicators, regions, and FDS codes before querying event or series data.
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: FactSet Macroeconomics API
  version: 1.0.0
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/economics-api
servers:
- url: https://api.factset.com/content/economics/v1
security:
- FactSetApiKey: []
- FactSetOAuth2: []
tags:
- description: Historical economic time series data with support for frequency conversion
    and data transformation.
  name: As-Reported Economics
- description: Economic calendar events with release dates, actual values, consensus
    estimates, and prior period data.
  name: Economic Events Calendar
- description: Reference values for indicators, regions, and FDS codes used for filtering
    and discovery.
  name: Reference Data
paths:
  /economic-events:
    get:
      description: Returns economic calendar events for a specified date range, with
        optional filtering by country, indicator, and FDS code. Use `/meta/events`
        to discover available filter values (indicators, countries, FDS codes).
      operationId: getEconomicEvents
      parameters:
      - description: |
          FDS code to filter events by a specific economic indicator.
          Use the `/meta/events?type=fds-codes` endpoint to retrieve all available codes.

          - **Required:** startDate and endDate parameters must be provided when using this filter
        explode: false
        in: query
        name: fdsCode
        required: false
        schema:
          example: CPIMOM@US
          type: string
        style: form
      - description: |
          Economic indicator name for filtering events.
          Use the `/meta/events?type=indicators` endpoint to retrieve available indicators.

          - **Required:** startDate and endDate parameters must be provided when using this filter
        explode: true
        in: query
        name: indicator
        required: false
        schema:
          example: PRCPI
          type: string
        style: form
      - description: |
          ISO country code for filtering events by country. Use the `/meta/events?type=countries` endpoint to retrieve available country codes.
        explode: true
        in: query
        name: countryCode
        required: false
        schema:
          example: US
          type: string
        style: form
      - description: |
          Time zone for event dates and times in GMT offset format (e.g., GMT-5, GMT, GMT+9). Use the `/meta/events?type=TIMEZONES` endpoint to retrieve available time zone values. If left blank, the default time zone is GMT.
        explode: true
        in: query
        name: timeZone
        required: false
        schema:
          default: GMT
          example: GMT+05:00
          type: string
        style: form
      - description: |
          Start date for the query range.

          - **Required:** when `fdsCode` or `indicator` is specified
          - **Default:** If both `startDate` and `endDate` are omitted, the API defaults to the most recent available calendar day
          - **Maximum date range limit:** The maximum date range limit between `startDate` and `endDate` is up to 90 days. Requests with date ranges exceeding 90 days will result in a validation error.
        explode: true
        in: query
        name: startDate
        required: false
        schema:
          example: 2024-01-01
          format: date
          type: string
        style: form
      - description: |
          End date for the query range.

          - **Required:** when `fdsCode` or `indicator` is specified
          - **Default:** If both `startDate` and `endDate` are omitted, the API defaults to the most recent available calendar day
          - **Maximum date range limit:** The maximum date range limit between `startDate` and `endDate` is up to 90 days. Requests with date ranges exceeding 90 days will result in a validation error.
        explode: true
        in: query
        name: endDate
        required: false
        schema:
          example: 2024-03-28
          format: date
          type: string
        style: form
      - description: |
          Comma-separated list of fields to include in the `items` array for each event. Common event fields (`requestedFdsCode`, `eventName`, `countryCode`, `indicator`) are always returned. When omitted, all available fields in the items array are returned.

          **Available fields (for items array):**
          | Field | Description |
          |---|---|
          | `eventDateTime` | Scheduled release date and time (UTC) |
          | `period` | Reference period covered by the data |
          | `actual` | Released actual value |
          | `prior` | Value from the prior period |
          | `consensus` | Consensus market estimate |
          | `surprise` | Difference between actual and consensus |
        examples:
          coreOnly:
            summary: Core value fields only
            value:
            - eventDateTime
            - actual
            - consensus
          full:
            summary: All item fields (default behavior)
            value:
            - eventDateTime
            - period
            - actual
            - prior
            - consensus
            - surprise
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            enum:
            - eventDateTime
            - period
            - actual
            - prior
            - consensus
            - surprise
            type: string
          maxItems: 6
          type: array
        style: form
      - description: |
          Maximum number of results to return per page. If not specified, the default page size is applied.
        explode: true
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 25
          example: 25
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: |
          Number of results to skip before returning the first result. Used for pagination in combination with `_paginationLimit`.
        explode: true
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          example: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                default200Response:
                  $ref: '#/components/examples/EventSearchExample'
              schema:
                $ref: '#/components/schemas/EventResponse'
          description: Successfully retrieved economic events.
        "400":
          content:
            application/json:
              examples:
                malformedQueryString:
                  $ref: '#/components/examples/MalformedQueryString'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Bad Request. The request contains syntax errors or is malformed (e.g., malformed JSON, invalid protocol formatting, illegal characters in query strings). The server cannot parse the request.
        "401":
          content:
            application/json:
              examples:
                authenticationFailed:
                  $ref: '#/components/examples/Unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unauthenticated - API authentication failed. Ensure you have successfully generated a valid API key, included the API key in your request via Basic Auth, and the API key is valid for your IP range. For help with connectivity issues, please contact FactSet support.
        "403":
          content:
            application/json:
              examples:
                authorizationFailed:
                  $ref: '#/components/examples/Forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Forbidden - You do not have permission to access this endpoint or resource. Your API key or account may not have the required access level. Please reach out to your FactSet Account Team for assistance with authorization.
        "404":
          content:
            application/json:
              examples:
                endpointNotFound:
                  $ref: '#/components/examples/NotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Not Found - The requested endpoint or resource does not exist. Please verify that the endpoint path is correct, all required path parameters are provided, and the resource identifier (if any) is valid.
        "422":
          content:
            application/json:
              examples:
                invalidDateFormat:
                  $ref: '#/components/examples/BadRequest'
                invalidParameterValue:
                  $ref: '#/components/examples/BadRequestInvalidParameterFormat'
                missingRequiredParameter:
                  $ref: '#/components/examples/BadRequestMissingRequiredParameter'
                invalidEnumValue:
                  $ref: '#/components/examples/UnprocessableEntity'
                invalidDateRange:
                  $ref: '#/components/examples/InvalidDateRange'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unprocessable Entity - Your request data was syntactically correct but semantically invalid. This can occur for validation errors such as invalid date format, invalid parameter values, missing required parameters, invalid enum values, or invalid date ranges. Check the required parameters and their value constraints.
        "429":
          content:
            application/json:
              examples:
                RateLimitExceeded:
                  $ref: '#/components/examples/RateLimitExceeded'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Too Many Requests - You have exceeded the allowed request rate for this API. Please wait and retry your request after some time.
        "500":
          content:
            application/json:
              examples:
                serverError:
                  $ref: '#/components/examples/InternalServerError'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Internal Server Error - An unexpected error occurred on the server. Please try your request again. If the problem persists, contact FactSet support and provide the error ID from the response for investigation.
      summary: Retrieve economic calendar events
      tags:
      - Economic Events Calendar
      x-accepts: application/json
  /as-reported-economics:
    get:
      description: Returns as-reported economic time series data for a given series
        ID, with optional frequency conversion and data transformation. Use `/meta/series`
        to discover available series IDs.
      operationId: getAsReportedEconomics
      parameters:
      - description: |
          The Series ID identifying the economic series to retrieve.
          Use the `/meta/series` endpoint to get a list of available series IDs.
        explode: true
        in: query
        name: seriesId
        required: true
        schema:
          example: FRBRIFSPPCD90@US
          type: string
        style: form
      - description: |
          Start date for the query range.

          - **Default:** If both `startDate` and `endDate` are omitted, the API defaults to the most recent available calendar day
        explode: true
        in: query
        name: startDate
        required: false
        schema:
          example: 2026-01-01
          format: date
          type: string
        style: form
      - description: |
          End date for the query range.

          - **Default:** If both `startDate` and `endDate` are omitted, the API defaults to the most recent available calendar day
        explode: true
        in: query
        name: endDate
        required: false
        schema:
          example: 2026-07-01
          format: date
          type: string
        style: form
      - description: |
          ISO country code for filtering events by country. Use the `/meta/events?type=countries` endpoint to retrieve available country codes.
        explode: true
        in: query
        name: countryCode
        required: false
        schema:
          example: US
          type: string
        style: form
      - description: |
          Controls the output frequency of the data returned. The supported frequencies are:

          - **D**: Daily.
          - **W**: Weekly.
          - **M**: Monthly.
          - **Q**: Quarterly.
          - **Y**: Yearly.

          When `frequency` is not specified: If multiple frequencies are available for the seriesId, data is returned at the highest frequency (e.g., monthly over quarterly). If only one frequency is available, data is returned at that frequency.
        explode: true
        in: query
        name: frequency
        required: false
        schema:
          enum:
          - D
          - W
          - M
          - Q
          - "Y"
          example: D
          type: string
        style: form
      - description: |
          Maximum number of results to return per page. If not specified, the default page size is applied.
        explode: true
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 25
          example: 25
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: |
          Number of results to skip before returning the first result. Used for pagination in combination with `_paginationLimit`.
        explode: true
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          example: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                default200Response:
                  $ref: '#/components/examples/AsReportedEconomicsExample'
              schema:
                $ref: '#/components/schemas/AsReportedEconomicsResponse'
          description: Successfully retrieved as-reported economic data.
        "400":
          content:
            application/json:
              examples:
                malformedQueryString:
                  $ref: '#/components/examples/MalformedQueryString'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Bad Request. The request contains syntax errors or is malformed (e.g., malformed JSON, invalid protocol formatting, illegal characters in query strings). The server cannot parse the request.
        "401":
          content:
            application/json:
              examples:
                authenticationFailed:
                  $ref: '#/components/examples/Unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unauthenticated - API authentication failed. Ensure you have successfully generated a valid API key, included the API key in your request via Basic Auth, and the API key is valid for your IP range. For help with connectivity issues, please contact FactSet support.
        "403":
          content:
            application/json:
              examples:
                authorizationFailed:
                  $ref: '#/components/examples/Forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Forbidden - You do not have permission to access this endpoint or resource. Your API key or account may not have the required access level. Please reach out to your FactSet Account Team for assistance with authorization.
        "404":
          content:
            application/json:
              examples:
                endpointNotFound:
                  $ref: '#/components/examples/NotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Not Found - The requested endpoint or resource does not exist. Please verify that the endpoint path is correct, all required path parameters are provided, and the resource identifier (if any) is valid.
        "422":
          content:
            application/json:
              examples:
                invalidDateFormat:
                  $ref: '#/components/examples/BadRequest'
                invalidParameterValue:
                  $ref: '#/components/examples/BadRequestInvalidParameterFormat'
                missingRequiredParameter:
                  $ref: '#/components/examples/BadRequestMissingRequiredParameter'
                invalidEnumValue:
                  $ref: '#/components/examples/UnprocessableEntity'
                invalidDateRange:
                  $ref: '#/components/examples/InvalidDateRange'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unprocessable Entity - Your request data was syntactically correct but semantically invalid. This can occur for validation errors such as invalid date format, invalid parameter values, missing required parameters, invalid enum values, or invalid date ranges. Check the required parameters and their value constraints.
        "429":
          content:
            application/json:
              examples:
                RateLimitExceeded:
                  $ref: '#/components/examples/RateLimitExceeded'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Too Many Requests - You have exceeded the allowed request rate for this API. Please wait and retry your request after some time.
        "500":
          content:
            application/json:
              examples:
                serverError:
                  $ref: '#/components/examples/InternalServerError'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Internal Server Error - An unexpected error occurred on the server. Please try your request again. If the problem persists, contact FactSet support and provide the error ID from the response for investigation.
      summary: Retrieve as-reported economic time series data
      tags:
      - As-Reported Economics
      x-accepts: application/json
  /event-count:
    get:
      description: |
        Returns the number of economic events per calendar day for a specified date range. Weekends can be included or excluded via the `includeWeekends` parameter.

        Note: The response includes only dates with one or more events. Dates with no events are omitted from the response.
      operationId: getEconomicEventsCount
      parameters:
      - description: |
          Start date for the query range.

          - **Default:** If both `startDate` and `endDate` are omitted, the API defaults to the most recent available calendar day
          - **Maximum date range limit:** The maximum date range limit between `startDate` and `endDate` is up to 90 days. Requests with date ranges exceeding 90 days will result in a validation error.
        explode: true
        in: query
        name: startDate
        required: false
        schema:
          example: 2024-01-01
          format: date
          type: string
        style: form
      - description: |
          End date for the query range.

          - **Default:** If both `startDate` and `endDate` are omitted, the API defaults to the most recent available calendar day
          - **Maximum date range limit:** The maximum date range limit between `startDate` and `endDate` is up to 90 days. Requests with date ranges exceeding 90 days will result in a validation error.
        explode: true
        in: query
        name: endDate
        required: false
        schema:
          example: 2024-03-01
          format: date
          type: string
        style: form
      - description: Returned daily counts include weekends by default. Set this to
          `false` to exclude weekends.
        explode: true
        in: query
        name: includeWeekends
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: |
          Maximum number of results to return per page. If not specified, the default page size is applied.
        explode: true
        in: query
        name: _paginationLimit
        required: false
        schema:
          default: 25
          example: 25
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: |
          Number of results to skip before returning the first result. Used for pagination in combination with `_paginationLimit`.
        explode: true
        in: query
        name: _paginationOffset
        required: false
        schema:
          default: 0
          example: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                default200Response:
                  $ref: '#/components/examples/EventCountDefaultExample'
              schema:
                $ref: '#/components/schemas/EventCountResponse'
          description: Successfully retrieved economic events count.
        "400":
          content:
            application/json:
              examples:
                malformedQueryString:
                  $ref: '#/components/examples/MalformedQueryString'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Bad Request. The request contains syntax errors or is malformed (e.g., malformed JSON, invalid protocol formatting, illegal characters in query strings). The server cannot parse the request.
        "401":
          content:
            application/json:
              examples:
                authenticationFailed:
                  $ref: '#/components/examples/Unauthenticated'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unauthenticated - API authentication failed. Ensure you have successfully generated a valid API key, included the API key in your request via Basic Auth, and the API key is valid for your IP range. For help with connectivity issues, please contact FactSet support.
        "403":
          content:
            application/json:
              examples:
                authorizationFailed:
                  $ref: '#/components/examples/Forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Forbidden - You do not have permission to access this endpoint or resource. Your API key or account may not have the required access level. Please reach out to your FactSet Account Team for assistance with authorization.
        "404":
          content:
            application/json:
              examples:
                endpointNotFound:
                  $ref: '#/components/examples/NotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Not Found - The requested endpoint or resource does not exist. Please verify that the endpoint path is correct, all required path parameters are provided, and the resource identifier (if any) is valid.
        "422":
          content:
            application/json:
              examples:
                invalidDateFormat:
                  $ref: '#/components/examples/BadRequest'
