  /meta/events:
    get:
      description: Returns reference values for filtering and discovery. Use this
        endpoint to discover available indicators, countries, and FDS codes.
      operationId: getEconomicEventReferenceData
      parameters:
      - description: |
          Specifies the type of reference data to return. The supported values are:

          - `INDICATORS`: Returns available economic indicator codes for use with the `indicator` filter.
          - `COUNTRIES`: Returns supported country codes for use with the `countryCode` filter.
          - `FDS_CODES`: Returns available FDS codes.
          - `TIMEZONES`: Returns supported timezone values for use with the `timeZone` filter.
        explode: true
        in: query
        name: type
        required: true
        schema:
          enum:
          - INDICATORS
          - COUNTRIES
          - FDS_CODES
          - TIMEZONES
          example: INDICATORS
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                indicatorsExample:
                  $ref: '#/components/examples/IndicatorsExample'
                regionsExample:
                  $ref: '#/components/examples/RegionsExample'
                fdsCodesExample:
                  $ref: '#/components/examples/FdsCodesExample'
                timezonesExample:
                  $ref: '#/components/examples/TimezonesExample'
              schema:
                $ref: '#/components/schemas/MetaEventsResponse'
          description: Successful response containing reference data.
        "400":
          content:
            application/json:
              examples:
                malformedQueryString:
                  $ref: '#/components/examples/MalformedQueryString'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
