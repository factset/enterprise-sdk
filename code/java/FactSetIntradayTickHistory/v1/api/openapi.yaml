        default: XML
        enum:
        - XML
        - JSON
        - CSV
        - CSV_NO_HEADER
        type: string
      style: form
    id:
      description: 'Requested symbol or security. The symbol can be a FactSet ticker-exchange
        or ticker-region symbol, CUSIP, ISIN or SEDOL.  <p>**Note**: Only one identifier
        can be requested per API call. </p> <p>The sandbox environment provides access
        to the following list of symbols: </p> <p>BABA-USA,WALMEX-MX,7203-TKS,VOD-LON,NPN-JSE,MABAX,NZF,SPY-USA,AGG-USA,GLD-USA,AOR-USA,MNA-USA,UUP-USA,SP50-SPX,ESX-STX,XAO-ASX,WD-MSX,NG00-USA,GC00-USA,CC00-USA,C00-USA,FC00-USA,ER00-USA,EURUSD-FX1,USDMXN-FX1,AUDJPY-FX1,EURCZK-FX1,USDILS-FX1,USDZAR-FX1,US10YY-TU1</p>'
      explode: true
      in: query
      name: id
      required: true
      schema:
        type: string
      style: form
    fields:
      description: All available fields. This is a comma-separated list (no spaces).
        See definitions for details. Default is all fields when left blank.
      explode: true
      in: query
      name: fields
      required: false
      schema:
        type: string
      style: form
    startDate:
      description: 'This is the start date for the Snapshot History. Requests should
        be made in the format **YYYYMMDD**. Default is current business day. Field
        can be sd or date. **NOTE**: The sandbox environment cannot use current day.'
      explode: true
      in: query
      name: sd
      required: false
      schema:
        type: string
      style: form
    endDate:
      description: 'This is the end date for the Snapshot History. Requests should
        be made in the format **YYYYMMDD**. If the period requested is larger than
        Max Days requested, results will be limited to the Max Days starting at sd/date.
        Default is sd or date. **NOTE**: The sandbox environment cannot use current
        day.'
      explode: true
      in: query
      name: ed
      required: false
      schema:
        type: string
      style: form
    startTime:
      description: Requested start time. This is the start time for the snapshot history
        requested. Requests should be made in a **HHMMSS** format. Range from 000000
        - 235959.
      explode: true
      in: query
      name: st
      required: false
      schema:
        default: "040000"
        type: string
      style: form
    endTime:
      description: Requested end time. This is the end time for the snapshot history
        requested. Requests should be made in a **HHMMSS** format. Range from 000000
        - 235959.
      explode: true
      in: query
      name: et
      required: false
      schema:
        default: "200000"
        type: string
      style: form
    interval:
      description: Requested time interval. This is the interval the data is returned
        from the service. Possible values from 1 Second (1S) to 1 Hour (1H). A maximum
        of 10 Tick History Requests and a maximum of 100,000 rows of data may be made
        in any one-minute period. Additional subscription is available to access 20
        requests/200,000 rows of data per minute. Contact your FactSet team for details.
      explode: true
      in: query
      name: interval
      required: false
      schema:
        default: 1M
        enum:
        - "0"
        - 1S
        - 5S
        - 10S
        - 15S
        - 30S
        - 1M
        - 2M
        - 5M
        - 10M
        - 15M
        - 30M
        - 1H
        type: string
      style: form
    includeRequest:
      description: Flag to include request id and key in the CSV output.
      explode: true
      in: query
      name: include_request
      required: false
      schema:
        default: "false"
        enum:
        - "true"
        - T
        - "false"
        - F
        type: string
      style: form
    dataset:
      description: Decides what type of trades to return, default is all trades and
        quotes, alternatively charting can be selected which will filter out unofficial
        trades.
      explode: true
      in: query
      name: dataset
      required: false
      schema:
        enum:
        - charting
        type: string
      style: form
