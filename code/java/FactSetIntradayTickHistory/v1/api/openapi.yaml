openapi: 3.0.1
info:
  contact:
    email: api@factset.com
    name: FactSet Research Systems
    url: https://developer.factset.com/contact
  description: "<p>FactSet’s Tick History provides cost-effective access to real-time\
    \ and delayed global exchange data. Proprietary technology normalizes over 200\
    \ global exchanges and 19 tick history fields. Asset types integrated include\
    \ equities, futures, options, fixed income, mutual funds, ETFs, indices, commodities,\
    \ and FX rates.</p><p>Tick History provides dynamic access to tick data for a\
    \ specific security intra-day or historically via standard HTTPS protocol. History\
    \ is available for all quotes and trades for a trailing 6 months or 1-year, respectively.\
    \ Quotes and trade data for Options is available for 30 days. Tick History data\
    \ is also available in a separate end-of-day feed.</p>\n \n"
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Tick History
  version: 1.0.2
externalDocs:
  description: API Documentation
  url: https://developer.factset.com/api-catalog/factset-intraday-tick-history-api
servers:
- url: https://api.factset.com/TickHistory
- url: https://api-sandbox.factset.com/TickHistory
security:
- FactSetApiKey: []
- FactSetOAuth2: []
paths:
  /history:
    get:
      description: "When using an HTTP GET request, the search criteria is sent via\
        \ the query\nstring in the URL. Please make sure that all requests contain\
        \ a date\nwithin the past trailing year. Fields are added using ampersands,\
        \ with\nenumerations separated by commas. Please reach out to your account\
        \ manager for more information on available exchanges and venues. \nPlease\
        \ note you must be logged into the Developer Portal and authenticate to access\
        \ the API. Select Authorize button or visit Authentication Support for more\
        \ details\nSandbox environment (api-sandbox.factset.com) is available with\
        \ limited subset of symbols, no current data and with free access. \n"
      operationId: get_TickHistory
      parameters:
      - description: 'Requested symbol or security. The symbol can be a FactSet ticker-exchange
          or ticker-region symbol, CUSIP, ISIN or SEDOL.  <p>**Note**: Only one identifier
          can be requested per API call. </p> <p>The sandbox environment provides
          access to the following list of symbols: </p> <p>BABA-USA,WALMEX-MX,7203-TKS,VOD-LON,NPN-JSE,MABAX,NZF,SPY-USA,AGG-USA,GLD-USA,AOR-USA,MNA-USA,UUP-USA,SP50-SPX,ESX-STX,XAO-ASX,WD-MSX,NG00-USA,GC00-USA,CC00-USA,C00-USA,FC00-USA,ER00-USA,EURUSD-FX1,USDMXN-FX1,AUDJPY-FX1,EURCZK-FX1,USDILS-FX1,USDZAR-FX1,US10YY-TU1</p>'
        explode: true
        in: query
        name: id
        required: true
        schema:
          type: string
        style: form
      - description: Request Identification String. Can be used by the application
          to keep track of requests.  The id is not used by this service, however,
          it is included in the response.
        explode: true
        in: query
        name: req_id
        required: false
        schema:
          type: string
        style: form
      - description: 'The format of the output file. '
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: XML
          enum:
          - XML
          - JSON
          - CSV
          - CSV_NO_HEADER
          type: string
        style: form
      - description: All available fields. This is a comma-separated list (no spaces).
          See definitions for details. Default is all fields when left blank.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: 'This is the start date for the Snapshot History. Requests should
          be made in the format **YYYYMMDD**. Default is current business day. Field
          can be sd or date. **NOTE**: The sandbox environment cannot use current
          day.'
        explode: true
        in: query
        name: sd
        required: false
        schema:
          type: string
        style: form
      - description: 'This is the end date for the Snapshot History. Requests should
          be made in the format **YYYYMMDD**. If the period requested is larger than
          Max Days requested, results will be limited to the Max Days starting at
          sd/date. Default is sd or date. **NOTE**: The sandbox environment cannot
          use current day.'
        explode: true
        in: query
        name: ed
        required: false
        schema:
          type: string
        style: form
      - description: Requested start time. This is the start time for the snapshot
          history requested. Requests should be made in a **HHMMSS** format. Range
          from 000000 - 235959.
        explode: true
        in: query
        name: st
        required: false
        schema:
          default: "040000"
          type: string
        style: form
      - description: Requested end time. This is the end time for the snapshot history
          requested. Requests should be made in a **HHMMSS** format. Range from 000000
          - 235959.
        explode: true
        in: query
        name: et
        required: false
        schema:
          default: "200000"
          type: string
        style: form
      - description: Requested time interval. This is the interval the data is returned
          from the service. Possible values from 1 Second (1S) to 1 Hour (1H). A maximum
          of 10 Tick History Requests and a maximum of 100,000 rows of data may be
          made in any one-minute period. Additional subscription is available to access
          20 requests/200,000 rows of data per minute. Contact your FactSet team for
          details.
        explode: true
        in: query
        name: interval
        required: false
        schema:
          default: 1M
          enum:
          - "0"
          - 1S
          - 5S
          - 10S
          - 15S
          - 30S
          - 1M
          - 2M
          - 5M
          - 10M
          - 15M
          - 30M
          - 1H
          type: string
        style: form
      - description: Flag to include request id and key in the CSV output.
        explode: true
        in: query
        name: include_request
        required: false
        schema:
          default: "false"
          enum:
          - "true"
          - T
          - "false"
          - F
          type: string
        style: form
      - description: Decides what type of trades to return, default is all trades
          and quotes, alternatively charting can be selected which will filter out
          unofficial trades.
        explode: true
        in: query
        name: dataset
        required: false
        schema:
          enum:
          - charting
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                Request ID: ""
                Requested Symbol: IBM-USA
                Requested Fields: LAST_1,LAST_TIME_1,LAST_VOL_1
                Request Key: 5C8926159C36F315
                Error Code: 0
                Error Description: ""
                Field Names:
                - LAST_1
                - LAST_TIME_1
                - LAST_VOL_1
                Field IDs:
                - 300
                - 302
                - 304
                Key: IBM-USA:D
                Values:
                - - 139.59
                  - 105955785
                  - 326658
                - - 138.1872
                  - 115957067
                  - 444631
                - - 137.4711
                  - 125957913
                  - 477766
                - - 137.7599
                  - 135956519
                  - 252993
                - - 137.81
                  - 140059812
                  - 4595
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
            application/xml:
              example: <Response><Request id=""><RequestedSymbol>IBM-USA</RequestedSymbol><RequestedFields>LAST_1,LAST_TIME_1,LAST_VOL_1</RequestedFields><RequestKey>5C89235E1E3D65AE</RequestKey></Request><Error
                code="0" description=""/><Records req_sym="IBM-USA" key="IBM-USA:D"
                stale=""><Record><Fields><Field id="300" name="LAST_1" value="145.96"/><Field
                id="302" name="LAST_TIME_1" value="105959029"/><Field id="304" name="LAST_VOL_1"
                value="638559"/></Fields></Record><Record><Fields><Field id="300"
                name="LAST_1" value="145.95"/><Field id="302" name="LAST_TIME_1" value="115956985"/><Field
                id="304" name="LAST_VOL_1" value="359625"/></Fields></Record><Record><Fields><Field
                id="300" name="LAST_1" value="145.82"/><Field id="302" name="LAST_TIME_1"
                value="125955145"/><Field id="304" name="LAST_VOL_1" value="280630"/></Fields></Record><Record><Fields><Field
                id="300" name="LAST_1" value="145.74"/><Field id="302" name="LAST_TIME_1"
                value="135955094"/><Field id="304" name="LAST_VOL_1" value="256692"/></Fields></Record><Record><Fields><Field
                id="300" name="LAST_1" value="145.815"/><Field id="302" name="LAST_TIME_1"
                value="140055430"/><Field id="304" name="LAST_VOL_1" value="12274"/></Fields></Record></Records></Response>
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
            text/csv:
              example: |
                LAST_1,LAST_TIME_1,LAST_VOL_1 139.59,105955785,326658 138.1872,115957067,444631 137.4711,125957913,477766 137.7599,135956519,252993 137.81,140059812,4595
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
          description: OK
        "400":
          content:
            application/json:
              examples:
                BadRequest:
                  $ref: '#/components/examples/BadRequestExample'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  $ref: '#/components/examples/UnauthorizedExample'
              schema:
