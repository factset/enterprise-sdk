components:
  examples:
    BadRequestExample:
      summary: Malformed input
      value:
        code: 400
        status: Bad Request
        message: Invalid request or improper formatting of request parameters
    UnauthorizedExample:
      summary: No auth or expired
      value:
        code: 401
        status: Unauthorized
        message: Missing or invalid authentication.
    ForbiddenExample:
      summary: Insufficient permissions
      value:
        code: 403
        status: Forbidden
        message: User is forbidden access to this resource.
    MethodNotAllowedExample:
      summary: Wrong HTTP method
      value:
        code: 405
        status: Method Not Allowed
        message: Invalid HTTP method. Either the method is not GET or exceeds the
          maximum request length (currently set at 5000 bytes). The description field
          will indicate the exact reason.
    RequestTimeoutExample:
      summary: Request timed out
      value:
        code: 408
        status: Request Timeout
        message: The request timed out.
    TooManyRequestsExample:
      summary: Rate limit exceeded
      value:
        code: 429
        status: Too Many Requests
        message: Too many requests. Contact your sales representative for available
          request tiers.
    InternalServerErrorExample:
      summary: Server error
      value:
        code: 500
        status: Internal Server Error
        message: There was an error while retrieving the data
  parameters:
    reqId:
      description: Request Identification String. Can be used by the application to
        keep track of requests.  The id is not used by this service, however, it is
        included in the response.
      explode: true
      in: query
      name: req_id
      required: false
      schema:
        type: string
      style: form
    format:
      description: 'The format of the output file. '
      explode: true
      in: query
      name: format
      required: false
