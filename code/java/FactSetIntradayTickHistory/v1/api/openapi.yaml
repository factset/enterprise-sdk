          description: 'The date of the last trade or last trade in an interval. FID
            # 384'
          type: string
        LAST_TIME:
          description: 'The time of the last trade or last trade in an interval. FID
            # 383'
          type: string
        LAST_VOL:
          description: 'The trade volume, or the sum of all trade volumes inside a
            bin. FID # 31'
          type: integer
        LAST_EXCH:
          description: 'The exchange of the last trade or last trade in an interval.
            FID # 33.'
          type: string
        CVOL:
          description: 'The symbol''s daily cumulative volume, or the last cumulative
            volume in an interval. FID # 132'
          type: integer
        VWAP:
          description: 'The daily volume weighted average price, or the last VWAP
            in an interval. FID # 780'
          format: float
          type: number
        OPEN:
          description: 'The first trade of an interval. FID # 158'
          format: float
          type: number
        HIGH:
          description: 'The highest trade price in an interval. FID # 107'
          format: float
          type: number
        LOW:
          description: 'The lowest trade price in an interval. FID # 307'
          format: float
          type: number
        TRADE_CONDITION:
          description: 'Trade Condition. FID # 174'
          type: string
        GMT_OFFSET:
          description: 'GMT Offset in Minutes. FID # 389'
          type: integer
        PRICE_CURRENCY:
          description: 'Price Currency Code. FID # 62'
          type: string
