name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      apiIncludeList:
        description: 'Limit publishing to this list of API(s) and optional versions, uses the `normalizedName` like "PA Engine API" -> "PAEngine". Example: PAEngine:1,SPAREngine:3. Leave empty to publish every API in the repo.'
        required: false
        default: ""
      languageToPublish:
        description: "Language to publish"
        required: true
        type: choice
        options:
          - "all"
          - "dotnet"
          - "java"
          - "python"
          - "typescript"
      dryRun:
        description: "Dry run (does not actually publish)"
        required: false
        type: boolean
        default: true
      matrixLimit:
        description: "Max matrix jobs per language before packages are grouped into batches. 256 is the GitHub cap; lower it to exercise batching."
        required: false
        default: "256"

env:
  # Packages per matrix job. Only applies once a language exceeds matrixLimit
  # packages; below that each package gets its own job.
  BATCH_SIZE: 5

jobs:
  validate-inputs:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      dotnet_batches: ${{ steps.validate.outputs.dotnet_batches }}
      java_batches: ${{ steps.validate.outputs.java_batches }}
      python_batches: ${{ steps.validate.outputs.python_batches }}
      typescript_batches: ${{ steps.validate.outputs.typescript_batches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate apiIncludeList against repo folders
        id: validate
        env:
          API_INCLUDE_LIST: ${{ github.event.inputs.apiIncludeList }}
          LANGUAGE_TO_PUBLISH: ${{ github.event.inputs.languageToPublish }}
          MATRIX_LIMIT: ${{ github.event.inputs.matrixLimit }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/validate-inputs.sh"

  publish-typescript:
    name: publish-typescript (${{ matrix.batch.name }})
    needs: validate-inputs
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for OIDC
      contents: read

    if: ${{ (github.event.inputs.languageToPublish == 'all' || github.event.inputs.languageToPublish == 'typescript') && needs.validate-inputs.outputs.typescript_batches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.validate-inputs.outputs.typescript_batches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Publish packages
        env:
          LANGUAGE: typescript
          BATCH_ID: ${{ matrix.batch.id }}
          PKG_PATHS: ${{ matrix.batch.paths }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-batch.sh"

  # Builds the .nupkg files. Restore and pack run third-party build code, so this
  # job gets no id-token permission and can never obtain nuget.org credentials.
  pack-dotnet:
    name: pack-dotnet (${{ matrix.batch.name }})
    needs: validate-inputs
    runs-on: ubuntu-latest

    permissions:
      contents: read

    if: ${{ (github.event.inputs.languageToPublish == 'all' || github.event.inputs.languageToPublish == 'dotnet') && needs.validate-inputs.outputs.dotnet_batches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.validate-inputs.outputs.dotnet_batches) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Pack packages
        env:
          LANGUAGE: dotnet
          BATCH_ID: ${{ matrix.batch.id }}
          PKG_PATHS: ${{ matrix.batch.paths }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
          NUPKG_DIR: ${{ runner.temp }}/nupkgs
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-batch.sh"

      # Nothing is uploaded when every package in the batch was already published.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nupkgs/*.nupkg
          if-no-files-found: ignore
          retention-days: 1

  # Pushes every packed .nupkg with one short-lived key. It checks out no code and
  # runs no build, so the only thing that ever sees the key is dotnet nuget push.
  push-dotnet:
    name: push-dotnet
    needs: [validate-inputs, pack-dotnet]
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for NuGet Trusted Publishing (OIDC)

    # Runs even if some pack batches failed, so one broken SDK does not block the
    # rest of the release. Failed batches stay red and can be rerun safely.
    if: ${{ !cancelled() && needs.validate-inputs.result == 'success' && github.event.inputs.dryRun != 'true' && (github.event.inputs.languageToPublish == 'all' || github.event.inputs.languageToPublish == 'dotnet') && needs.validate-inputs.outputs.dotnet_batches != '[]' }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          path: nupkgs
          merge-multiple: true

      - name: Check for packages
        id: check
        run: |
          shopt -s nullglob
          files=(nupkgs/*.nupkg)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No new .NET packages to push."
          fi

      - name: Install .NET
        if: ${{ steps.check.outputs.count != '0' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # Exchanges this job's OIDC token for a 1-hour nuget.org API key, right
      # before the push. One key covers every package in the release.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        if: ${{ steps.check.outputs.count != '0' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name of the publishing account

      - name: Push packages
        if: ${{ steps.check.outputs.count != '0' }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          {
            echo "### .NET push"
            echo
            echo "| Package |"
            echo "| --- |"
            for f in nupkgs/*.nupkg; do echo "| \`$(basename "$f" .nupkg)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
