openapi: '3.0.0'
info:
  version: '1.0.0'
  title: 'FactSet Power & Utilities API'
  contact:
    name: 'FactSet Research Systems'
    email: 'api@factset.com'
    url: 'https://developer.factset.com/contact'
  license:
    name: 'Apache License, Version 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  description: "The FactSet Power & Utilities API provides comprehensive global power generation and energy market data. Coverage includes power plant metadata and technical specifications, balancing authority supply and demand, power spot and forward prices, spark spreads, capacity prices, and hourly and monthly plant-level generation and emissions.\n\n**Note:** Plant metadata and reference/mapping endpoints (Plants, ISO/TSO mapping, zone mapping) reflect current data only — historical or point-in-time values are not retained. The exception is `GET /reference/entity-history`, which provides historical entity and ownership records. Unit-level mapping information (unit names, EIA codes, project grades, and regional mappings) are included in the `/units/details` metadata response.\n\n**Key Features:**\n- Global power plant metadata including ownership, location, pipeline connections, and fuel-specific technical specifications (solar, wind, thermal)\n- Balancing authority-level generation (by fuel type), demand, and net interchange data\n- Power spot prices, spark spreads, capacity auction clearing prices, and forward power curves\n- Hourly and monthly plant-level net generation with CO₂, N₂O, and SO₂ emissions data\n- Reference data for ISO/TSO codes, price zones and hubs, and entity/ownership history\n\n**Units and abbreviations used throughout this API:**\n- `MW` — megawatt (unit of instantaneous power capacity)\n- `MWh` — megawatt-hour (unit of energy; one MW delivered for one hour)\n- `$/MWh` — US dollars per megawatt-hour (power price unit)\n- `$/MW-day` — US dollars per megawatt per day (capacity market price unit)\n- `MMBtu` — million British thermal units (heat input unit)\n- `Dth` — dekatherm (one million BTU; unit for natural gas interconnection capacity)\n- `CO₂` — carbon dioxide; reported in metric tons\n- `SO₂` — sulfur dioxide; reported in metric tons (hourly) or short tons (monthly)\n- `N₂O` — nitrous oxide; reported in metric tons (hourly) or short tons (monthly)\n- `BA` — Balancing Authority; a grid operator responsible for balancing generation and load within its area\n- `ISO/TSO` — Independent System Operator / Transmission System Operator\n- `EIA` — US Energy Information Administration\n"
externalDocs:
  description: 'API Documentation'
  url: 'https://developer.factset.com/api-catalog/factset-power-utilities-api'
servers:
  - url: 'https://api.factset.com/content/factset-power-utilities/v1'
    description: 'Production'
security:
  - FactSetApiKey: []
  - FactSetOAuth2: []
x-factset-sdk-has-main-example: true
tags:
  - name: 'Plants'
    description: 'Global power plant coverage, ownership, geographic location, gas pipeline connections, and fuel-specific technical specifications (solar, wind, thermal/fossil).'
  - name: 'Units'
    description: 'Power plant unit metadata and technical details including ownership, pipeline connections, and fuel-specific specifications.'
  - name: 'Market Data'
    description: 'Balancing authority-level net generation, electricity demand, and net interchange data. Single `/market-data` endpoint with a `category` discriminator (generation, demand, interchange).'
  - name: 'Prices'
    description: 'Power price data including spot power prices, spark spreads, capacity auction clearing prices, and forward power curves.'
  - name: 'Generation & Emissions'
    description: 'Plant and unit-level net generation and emissions (CO₂, SO₂, N₂O) at hourly and monthly frequencies.'
  - name: 'Reference'
    description: 'Reference and mapping data for ISO/TSO codes, price zones and hubs, and entity/ownership history.'
paths:
  /plants/ids:
    get:
      tags:
        - 'Plants'
      summary: 'Returns discoverable power plant IDs'
      operationId: 'listPlantIds'
      description: "Returns a paginated list of FactSet power plant asset identifiers matching the specified filter criteria, along with plant name, status, fuel type, and geographic location (nearest city, region, country, continent, and coordinates).\n\nFor unit-level metadata and technical details, see `POST /units/details`. You can provide either plant IDs or unit IDs to `/units/details` to retrieve unit-level data with full mapping information (unit names, EIA codes, grades, regions).\n\nReflects current data only; historical or point-in-time values are not retained.\n"
      parameters:
        - name: 'isoCode'
          in: 'query'
          required: false
          schema:
            type: 'array'
            minItems: 1
            maxItems: 50
            items:
              type: 'string'
          description: 'Filter plants by ISO/TSO market area code (e.g., `"ERCOT"`, `"PJM"` for US ISO/RTOs; other codes for non-US TSOs as coverage expands).'
          example:
            - 'ERCOT'
        - name: 'country'
          in: 'query'
          required: false
          schema:
            type: 'array'
            minItems: 1
            maxItems: 50
            items:
              type: 'string'
          description: 'Filter plants by country name (e.g., `"United States"`, `"Canada"`, `"United Kingdom"`).'
          example:
            - 'United States'
        - name: 'region'
          in: 'query'
          required: false
          schema:
            type: 'array'
            minItems: 1
            maxItems: 50
            items:
              type: 'string'
          description: 'Filter plants by region (e.g., a US state name such as `"Texas"`, `"Tennessee"`).'
          example:
            - 'Texas'
        - name: 'plantStatus'
          in: 'query'
          required: false
          schema:
            type: 'array'
            minItems: 1
            items:
              type: 'string'
              enum:
                - 'Operational'
                - 'Planned'
                - 'Retired'
                - 'Cancelled'
          description: 'Filter plants by operational status.'
          example:
            - 'Operational'
        - name: 'plantIds'
          in: 'query'
          required: false
          schema:
            type: 'array'
            minItems: 1
            maxItems: 50
            items:
              type: 'string'
          description: 'Filter results to the specified FactSet plant asset identifiers. If omitted, all plants matching other filter criteria are returned.'
          example:
            - 'B00121-M'
        - name: 'minCapacityMw'
          in: 'query'
          required: false
          schema:
            type: 'number'
            minimum: 0
          description: 'Filter plants by minimum nameplate capacity in megawatts (MW), inclusive. Returns plants with capacity greater than or equal to this value.'
          example: 100
        - name: 'maxCapacityMw'
          in: 'query'
          required: false
          schema:
            type: 'number'
            minimum: 0
          description: 'Filter plants by maximum nameplate capacity in megawatts (MW), inclusive. Returns plants with capacity less than or equal to this value.'
          example: 5000
        - name: '_paginationLimit'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 100
            minimum: 1
            maximum: 1000
          description: 'Maximum number of results to return per request.'
        - name: '_paginationOffset'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 0
            minimum: 0
          description: 'Number of results to skip. Use with `_paginationLimit` for paging through large result sets.'
      responses:
        '200':
          description: 'Successful response with a list of plant identifiers'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantIdsResponse'
              examples:
                Plant IDs Response:
                  $ref: '#/components/examples/PlantIdsResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /units/details:
    post:
      tags:
        - 'Units'
      summary: 'Returns power plant unit metadata and technical details'
      x-factset-sdk-main-example: true
      operationId: 'listPlantUnits'
      description: "Returns metadata and technical detail data for one of five categories, selected via the `category` discriminator in the request body:\n\n* **`Metadata`** — General plant metadata: plant name, ISO/TSO assignment, primary fuel type, nameplate capacity, operational status, owner details, and key lifecycle dates.\n* **`Pipeline`** — Gas pipeline connections: pipeline name and pipeline sequence (for units supplied by more than one pipeline).\n* **`Solar`** — Solar-specific technical specifications: installed capacity (DC), array/tracking type, tilt and azimuth angle, thin-film flag, and land area.\n* **`Wind`** — Wind turbine technical specifications: turbine count, model, manufacturer, hub height, and rotor swept area.\n* **`Thermal`** — Thermal/fossil technical specifications: design heat rate.\n\nFor unit ownership details, use `POST /units/ownership`.\n\nThis endpoint operates at the unit level, matching the underlying source data.\n\nReflects current data only; historical or point-in-time values are not retained.\n\n**Input flexibility:** You can provide either plant IDs or unit IDs. When you provide a plant ID, all units within that plant are returned. Unit names, parent plant IDs, EIA codes, project grades, and regional mappings are included in the metadata response.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantUnitsRequest'
            examples:
              Metadata Request:
                $ref: '#/components/examples/PlantMetadataRequestExample'
              Pipeline Request:
                $ref: '#/components/examples/PlantPipelineRequestExample'
              Solar Request:
                $ref: '#/components/examples/PlantSolarRequestExample'
              Wind Request:
                $ref: '#/components/examples/PlantWindRequestExample'
              Thermal Request:
                $ref: '#/components/examples/PlantThermalRequestExample'
      responses:
        '200':
          description: 'Successful response. Record shape matches the requested `category`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantUnitsResponse'
              examples:
                Metadata Response:
                  $ref: '#/components/examples/PlantMetadataResponseExample'
                Pipeline Response:
                  $ref: '#/components/examples/PlantPipelineResponseExample'
                Solar Response:
                  $ref: '#/components/examples/PlantSolarResponseExample'
                Wind Response:
                  $ref: '#/components/examples/PlantWindResponseExample'
                Thermal Response:
                  $ref: '#/components/examples/PlantThermalResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /units/ownership:
    post:
      tags:
        - 'Units'
      summary: 'Returns power plant unit ownership details'
      operationId: 'listUnitsOwnership'
      description: "Returns ownership records for the specified unit IDs, including owner name, FactSet entity ID, ownership percentage, ultimate parent entity, and the plant ID for each unit.\n\nThis endpoint is a convenience endpoint that returns ownership data with the plant ID included. For other unit detail categories (metadata, pipeline, solar, wind, thermal), use `POST /units/details`.\n\nReflects current data only; historical or point-in-time values are not retained.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitsOwnershipRequest'
            examples:
              Ownership Request:
                $ref: '#/components/examples/UnitsOwnershipRequestExample'
      responses:
        '200':
          description: 'Successful response with unit ownership records.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitsOwnershipResponse'
              examples:
                Ownership Response:
                  $ref: '#/components/examples/UnitsOwnershipResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /market-data/coverage:
    get:
      tags:
        - 'Market Data'
      summary: 'Returns balancing authority coverage'
      operationId: 'listMarketDataCoverage'
      description: "Returns the full list of balancing authority (BA) sub-regions available in the market data endpoints. Use the returned `factsetBaId` values as input for the `Generation` category, or `factsetBaSubRegId` values for the `Demand` and `Interchange` categories, of `POST /market-data`.\n"
      parameters:
        - name: 'country'
          in: 'query'
          required: false
          schema:
            type: 'string'
          description: 'Filter by country name.'
          example: 'United States'
        - name: '_paginationLimit'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 100
            minimum: 1
            maximum: 1000
          description: 'Maximum number of results to return per request.'
        - name: '_paginationOffset'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 0
            minimum: 0
          description: 'Number of results to skip.'
      responses:
        '200':
          description: 'Successful response with balancing authority coverage list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDataCoverageResponse'
              examples:
                Market Data Coverage Response:
                  $ref: '#/components/examples/MarketDataCoverageResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /market-data:
    post:
      tags:
        - 'Market Data'
      summary: 'Returns balancing authority generation, demand, or interchange'
      operationId: 'listMarketData'
      description: "Returns balancing authority time-series data for one of three categories, selected via the `category` discriminator in the request body:\n\n* **`Generation`** — Hourly net generation in MW by fuel type for the specified balancing authorities (`factsetBaId`) and date range.\n* **`Demand`** — Hourly electricity demand (load) in MW for the specified balancing authority sub-regions (`factsetBaSubRegId`).\n* **`Interchange`** — Hourly net interchange in MW between a reporting BA sub-region and its counterpart sub-regions. Positive values indicate net exports; negative values indicate net imports.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketDataRequest'
            examples:
              Generation Request:
                $ref: '#/components/examples/MarketDataGenerationRequestExample'
              Demand Request:
                $ref: '#/components/examples/MarketDataDemandRequestExample'
      responses:
        '200':
          description: 'Successful response. Record shape matches the requested `category`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDataResponse'
              examples:
                Generation Response:
                  $ref: '#/components/examples/MarketDataGenerationResponseExample'
                Demand Response:
                  $ref: '#/components/examples/MarketDataDemandResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /prices:
    post:
      tags:
        - 'Prices'
      summary: 'Returns power spot prices, spark spreads, capacity prices, or forward prices'
      operationId: 'listPrices'
      description: "Returns power market price data for one of four categories, selected via the `category` discriminator in the request body:\n\n* **`Power`** — Daily spot power prices in $/MWh at major hubs and zones. Includes on-peak, off-peak, and around-the-clock prices.\n* **`SparkSpread`** — Natural gas spark spreads in $/MWh at four fixed assumed heat rates (7,000 / 8,000 / 10,000 / 12,000 MMBtu/MWh), representing the difference between the power price and the cost of gas needed to generate one MWh.\n* **`Capacity`** — Capacity auction clearing prices in $/MW-day from ISO/RTO forward capacity markets. Includes delivery year and auction type.\n* **`Forward`** — Forward power price curves in $/MWh for future delivery months, reported as a rolling 3-day average. Includes on-peak, off-peak, and around-the-clock products.\n\nUse `GET /reference/location-mapping` to discover valid `ids` for the `Power`, `SparkSpread`, and `Forward` categories, or `GET /reference/zone-mapping` for the `Capacity` category.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricesRequest'
            examples:
              Power Prices Request:
                $ref: '#/components/examples/PowerPricesRequestExample'
              Spark Spread Request:
                $ref: '#/components/examples/SparkSpreadRequestExample'
              Capacity Prices Request:
                $ref: '#/components/examples/CapacityPricesRequestExample'
              Forward Prices Request:
                $ref: '#/components/examples/ForwardPricesRequestExample'
      responses:
        '200':
          description: 'Successful response. Record shape matches the requested `category`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
              examples:
                Power Prices Response:
                  $ref: '#/components/examples/PowerPricesResponseExample'
                Spark Spread Response:
                  $ref: '#/components/examples/SparkSpreadResponseExample'
                Capacity Prices Response:
                  $ref: '#/components/examples/CapacityPricesResponseExample'
                Forward Prices Response:
                  $ref: '#/components/examples/ForwardPricesResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /generation/hourly/units:
    post:
      tags:
        - 'Generation & Emissions'
      summary: 'Returns hourly plant unit generation and emissions'
      operationId: 'listHourlyGenerationUnits'
      description: "Returns hourly net generation and emissions for the requested power plant units over the specified date range. Each record provides net generation in MWh and reported emissions of CO₂, SO₂, and N₂O (nitrous oxide) in metric tons, along with heat input in MMBtu and steam generation.\n\nThis endpoint operates at the unit level, matching the underlying source data.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HourlyGenerationRequest'
            examples:
              Hourly Generation Request:
                $ref: '#/components/examples/HourlyGenerationRequestExample'
      responses:
        '200':
          description: 'Successful response with hourly generation and emissions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyGenerationResponse'
              examples:
                Hourly Generation Response:
                  $ref: '#/components/examples/HourlyGenerationResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /generation/monthly:
    post:
      tags:
        - 'Generation & Emissions'
      summary: 'Returns monthly plant generation and emissions'
      operationId: 'listMonthlyGeneration'
      description: "Returns monthly net generation and emissions for the requested power plants over the specified date range. Each record provides net generation in MWh, plant/fuel-type capacity and capacity factor, and total emissions of CO₂ (metric tons), SO₂ (short tons), and N₂O (nitrous oxide, short tons), along with heat input in MMBtu and a CO₂ intensity measure.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyGenerationRequest'
            examples:
              Monthly Generation Request:
                $ref: '#/components/examples/MonthlyGenerationRequestExample'
      responses:
        '200':
          description: 'Successful response with monthly generation and emissions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyGenerationResponse'
              examples:
                Monthly Generation Response:
                  $ref: '#/components/examples/MonthlyGenerationResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /reference/iso-mapping:
    get:
      tags:
        - 'Reference'
      summary: 'Returns ISO/TSO mapping data'
      operationId: 'listIsoMapping'
      description: "Returns the complete list of ISO/TSO codes and their corresponding names.\n\n**Helpful for:** Use this endpoint to understand available ISO/TSO codes for filtering in `GET /plants/ids` (via the `isoCode` parameter) and `GET /market-data/coverage`.\n\nReflects current data only; historical or point-in-time values are not retained.\n"
      parameters:
        - name: '_paginationLimit'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 100
            minimum: 1
            maximum: 1000
          description: 'Maximum number of results to return per request.'
        - name: '_paginationOffset'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 0
            minimum: 0
          description: 'Number of results to skip.'
      responses:
        '200':
          description: 'Successful response with ISO/TSO mapping records'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsoMappingResponse'
              examples:
                ISO Mapping Response:
                  $ref: '#/components/examples/IsoMappingResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /reference/zone-mapping:
    get:
      tags:
        - 'Reference'
      summary: 'Returns price zone and hub mapping data'
      operationId: 'listZoneMapping'
      description: "Returns the list of ISO/TSO load distribution area and zone codes used by `POST /prices?category=Capacity`, with their names, price units, and auction frequency. Use the returned `locationId` values as input to that endpoint.\n\nNote: these `iso_zone_code` identifiers are a distinct code space from the `iso_loc_code` identifiers used by `POST /prices` for the `Power`, `SparkSpread`, and `Forward` categories.\n\nReflects current data only; historical or point-in-time values are not retained.\n"
      parameters:
        - name: 'isoCode'
          in: 'query'
          required: false
          schema:
            type: 'string'
          description: 'Filter locations by ISO/TSO market.'
          example: 'PJM'
        - name: '_paginationLimit'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 100
            minimum: 1
            maximum: 1000
          description: 'Maximum number of results to return per request.'
        - name: '_paginationOffset'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 0
            minimum: 0
          description: 'Number of results to skip.'
      responses:
        '200':
          description: 'Successful response with zone and hub mapping records'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneMappingResponse'
              examples:
                Zone Mapping Response:
                  $ref: '#/components/examples/ZoneMappingResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /reference/location-mapping:
    get:
      tags:
        - 'Reference'
      summary: 'Returns power price location mapping data'
      operationId: 'listLocationMapping'
      description: "Returns the list of ISO/TSO power price location codes (hub codes) used by `POST /prices` for the `Power`, `SparkSpread`, and `Forward` categories, with their names. Use the returned `locationId` values as input to those endpoints.\n\nNote: these `iso_loc_code` identifiers are a distinct code space from the `iso_zone_code` identifiers used by `POST /prices?category=Capacity` — see `GET /reference/zone-mapping` for those.\n\nReflects current data only; historical or point-in-time values are not retained.\n"
      parameters:
        - name: 'isoCode'
          in: 'query'
          required: false
          schema:
            type: 'string'
          description: 'Filter locations by ISO/TSO market.'
          example: 'ERCOT'
        - name: '_paginationLimit'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 100
            minimum: 1
            maximum: 1000
          description: 'Maximum number of results to return per request.'
        - name: '_paginationOffset'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 0
            minimum: 0
          description: 'Number of results to skip.'
      responses:
        '200':
          description: 'Successful response with power price location mapping records'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationMappingResponse'
              examples:
                Location Mapping Response:
                  $ref: '#/components/examples/LocationMappingResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /reference/entity-history:
    get:
      tags:
        - 'Reference'
      summary: 'Returns entity and security history records'
      operationId: 'listEntityHistory'
      description: "Returns entity and security history records combining security-to-entity identifier mappings and entity ownership structure history, including immediate and ultimate parent entities.\n\n**Helpful for:** Understanding entity relationships and parent-subsidiary structures related to plant ownership data returned by `POST /units/ownership`.\n"
      parameters:
        - name: 'factsetEntityId'
          in: 'query'
          required: false
          schema:
            type: 'string'
          description: 'Filter records by a specific FactSet entity identifier (e.g., `"0GSF7D-E"`).'
          example: '0GSF7D-E'
        - name: '_paginationLimit'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 100
            minimum: 1
            maximum: 1000
          description: 'Maximum number of results to return per request.'
        - name: '_paginationOffset'
          in: 'query'
          required: false
          style: 'form'
          explode: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 0
            minimum: 0
          description: 'Number of results to skip.'
      responses:
        '200':
          description: 'Successful response with entity history records'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistoryResponse'
              examples:
                Entity History Response:
                  $ref: '#/components/examples/EntityHistoryResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  securitySchemes:
    FactSetOAuth2:
      type: 'oauth2'
      flows:
        clientCredentials:
          tokenUrl: 'https://auth.factset.com/as/token.oauth2'
          scopes: {}
    FactSetApiKey:
      type: 'http'
      scheme: 'basic'
  schemas:
    PlantIds:
      type: 'array'
      minItems: 1
      maxItems: 100
      description: 'Array of FactSet power plant asset identifiers (e.g., `"B00121-M"`). Use `GET /plants/ids` to discover valid identifiers.'
      items:
        type: 'string'
      example:
        - 'B00121-M'
        - 'B00987-M'
    PlantUnitIds:
      type: 'array'
      minItems: 1
      maxItems: 100
      description: 'Array of FactSet power plant and/or plant unit asset identifiers. Accepts both plant IDs (e.g., `"B00121-M"`) and unit IDs (e.g., `"05RLSM-M"`). When a plant ID is provided, all units within that plant are returned.'
      items:
        type: 'string'
      example:
        - 'B00121-M'
        - '05RLSM-M'
    BalancingAuthorityIds:
      type: 'array'
      minItems: 1
      maxItems: 100
      description: 'Array of FactSet balancing authority identifiers (e.g., `"05WTSJ-M"`). Used for the `Generation` category, which is reported at the balancing-authority level.'
      items:
        type: 'string'
      example:
        - '05WTSJ-M'
    BalancingAuthoritySubRegionIds:
      type: 'array'
      minItems: 1
      maxItems: 100
      description: 'Array of FactSet balancing authority sub-region identifiers (e.g., `"05WTTF-M"`). Used for the `Demand` and `Interchange` categories, which are reported at the sub-region level.'
      items:
        type: 'string'
      example:
        - '05WTTF-M'
    LocationIds:
      type: 'array'
      minItems: 1
      maxItems: 100
      description: 'Array of power price location identifiers such as hub or zone codes (e.g., `"HB_NORTH"`, `"PJM_ATSI_BASE"`).'
      items:
        type: 'string'
      example:
        - 'HB_NORTH'
        - 'HB_HOUSTON'
    RequestPagination:
      type: 'object'
      description: 'Pagination parameters to control the size and offset of results returned.'
      properties:
        limit:
          type: 'integer'
          format: 'int32'
          default: 100
          minimum: 1
          maximum: 1000
          description: 'Maximum number of results to return per request.'
        offset:
          type: 'integer'
          format: 'int32'
          default: 0
          minimum: 0
          description: 'Number of results to skip. Use with `limit` for paging through large result sets.'
    RequestMeta:
      type: 'object'
      description: 'Optional request metadata for pagination control.'
      properties:
        pagination:
          $ref: '#/components/schemas/RequestPagination'
    ResponsePagination:
      type: 'object'
      description: 'Pagination details included in every collection response.'
      properties:
        total:
          type: 'integer'
          format: 'int64'
          description: 'Total number of records the API returns for this query.'
          example: 4250
        isEstimatedTotal:
          type: 'boolean'
          description: 'Whether the total count is exact or an estimate. Defaulted to `false` as the API returns exact counts.'
          example: false
    ResponseMeta:
      type: 'object'
      description: 'Response metadata including pagination and request tracking.'
      properties:
        pagination:
          $ref: '#/components/schemas/ResponsePagination'
        requestedIds:
          type: 'integer'
          format: 'int32'
          description: 'Total number of identifiers submitted in the request.'
          example: 2
        failedIds:
          type: 'array'
          description: 'List of identifiers from the request that failed (invalid format, empty, or not found). Empty array when all submitted IDs resolved successfully.'
          items:
            type: 'string'
          example: []
    CollectionResponseMeta:
      type: 'object'
      description: 'Response metadata for endpoints that discover or list records rather than accepting requested identifiers. Includes pagination only.'
      properties:
        pagination:
          $ref: '#/components/schemas/ResponsePagination'
    ErrorResponse:
      type: 'object'
      description: 'Standard error response envelope.'
      properties:
        errors:
          type: 'array'
          description: 'Array of one or more error objects describing what went wrong.'
          items:
            $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: 'object'
      description: 'Individual error detail.'
      required:
        - 'code'
        - 'title'
        - 'detail'
      properties:
        id:
          type: 'string'
          format: 'uuid'
          description: 'Unique error identifier for tracing.'
          example: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code:
          type: 'string'
          description: 'Machine-readable error code in camelCase.'
          example: 'parameterError'
        title:
          type: 'string'
          description: 'Short human-readable summary matching the HTTP status reason phrase.'
          example: 'Bad Request'
        detail:
          type: 'string'
          description: 'Detailed human-readable explanation of this error occurrence.'
          example: 'The parameter ''ids'' is required and may not be empty.'
        links:
          type: 'object'
          description: 'Optional links for additional context.'
          properties:
            about:
              type: 'string'
              format: 'url'
              description: 'Link to documentation for this error.'
            pointer:
              type: 'string'
              description: 'JSON Pointer to the field that caused the error.'
              example: '/data/ids/0'
            parameter:
              type: 'string'
              description: 'Query parameter name that caused the error.'
              example: 'ids[0]'
            value:
              type: 'string'
              description: 'The value that caused the error.'
              example: 'INVALID-ID'
    CategoryMetadata:
      type: 'string'
      enum:
        - 'Metadata'
      description: 'Discriminator value for plant unit metadata records.'
      example: 'Metadata'
    CategoryPipeline:
      type: 'string'
      enum:
        - 'Pipeline'
      description: 'Discriminator value for plant pipeline connection records.'
      example: 'Pipeline'
    CategorySolar:
      type: 'string'
      enum:
        - 'Solar'
      description: 'Discriminator value for solar plant technical specifications.'
      example: 'Solar'
    CategoryWind:
      type: 'string'
      enum:
        - 'Wind'
      description: 'Discriminator value for wind plant technical specifications.'
      example: 'Wind'
    CategoryThermal:
      type: 'string'
      enum:
        - 'Thermal'
      description: 'Discriminator value for thermal/fossil plant technical specifications.'
      example: 'Thermal'
    CategoryGeneration:
      type: 'string'
      enum:
        - 'Generation'
      description: 'Discriminator value for balancing authority net generation.'
      example: 'Generation'
    CategoryDemand:
      type: 'string'
      enum:
        - 'Demand'
      description: 'Discriminator value for balancing authority electricity demand.'
      example: 'Demand'
    CategoryInterchange:
      type: 'string'
      enum:
        - 'Interchange'
      description: 'Discriminator value for balancing authority net interchange.'
      example: 'Interchange'
    CategoryPower:
      type: 'string'
      enum:
        - 'Power'
      description: 'Discriminator value for spot power prices.'
      example: 'Power'
    CategorySparkSpread:
      type: 'string'
      enum:
        - 'SparkSpread'
      description: 'Discriminator value for spark spread data.'
      example: 'SparkSpread'
    CategoryCapacity:
      type: 'string'
      enum:
        - 'Capacity'
      description: 'Discriminator value for capacity auction prices.'
      example: 'Capacity'
    CategoryForward:
      type: 'string'
      enum:
        - 'Forward'
      description: 'Discriminator value for forward power prices.'
      example: 'Forward'
    PlantUnitsRequest:
      type: 'object'
      description: 'Request body for plant unit metadata and technical details.'
      required:
        - 'data'
      properties:
        data:
          $ref: '#/components/schemas/PlantUnitsRequestData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    PlantUnitsRequestData:
      type: 'object'
      description: "Plant unit query parameters. The `category` field selects the record shape returned.\n"
      oneOf:
        - $ref: '#/components/schemas/PlantMetadataData'
        - $ref: '#/components/schemas/PlantPipelineData'
        - $ref: '#/components/schemas/PlantSolarData'
        - $ref: '#/components/schemas/PlantWindData'
        - $ref: '#/components/schemas/PlantThermalData'
      discriminator:
        propertyName: 'category'
        mapping:
          Metadata: '#/components/schemas/PlantMetadataData'
          Pipeline: '#/components/schemas/PlantPipelineData'
          Solar: '#/components/schemas/PlantSolarData'
          Wind: '#/components/schemas/PlantWindData'
          Thermal: '#/components/schemas/PlantThermalData'
    PlantMetadataData:
      type: 'object'
      description: 'Query parameters for plant unit metadata records. You may provide either plant IDs or unit IDs; when a plant ID is provided, all units within that plant are returned.'
      required:
        - 'category'
        - 'ids'
      properties:
        category:
          $ref: '#/components/schemas/CategoryMetadata'
        ids:
          $ref: '#/components/schemas/PlantUnitIds'
        plantStatus:
          type: 'string'
          nullable: true
          enum:
            - 'Operational'
            - 'Planned'
            - 'Retired'
            - 'Cancelled'
          description: 'Filter results by operational status.'
          example: 'Operational'
        minCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by minimum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity greater than or equal to this value.'
          example: 100
        maxCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by maximum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity less than or equal to this value.'
          example: 5000
    PlantPipelineData:
      type: 'object'
      description: 'Query parameters for plant gas pipeline connection records. You may provide either plant IDs or unit IDs; when a plant ID is provided, all units within that plant are returned.'
      required:
        - 'category'
        - 'ids'
      properties:
        category:
          $ref: '#/components/schemas/CategoryPipeline'
        ids:
          $ref: '#/components/schemas/PlantUnitIds'
        minCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by minimum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity greater than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 100
        maxCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by maximum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity less than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 5000
    PlantSolarData:
      type: 'object'
      description: 'Query parameters for solar plant technical specifications. You may provide either plant IDs or unit IDs; when a plant ID is provided, all units within that plant are returned.'
      required:
        - 'category'
        - 'ids'
      properties:
        category:
          $ref: '#/components/schemas/CategorySolar'
        ids:
          $ref: '#/components/schemas/PlantUnitIds'
        minCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by minimum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity greater than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 100
        maxCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by maximum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity less than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 5000
    PlantWindData:
      type: 'object'
      description: 'Query parameters for wind plant technical specifications. You may provide either plant IDs or unit IDs; when a plant ID is provided, all units within that plant are returned.'
      required:
        - 'category'
        - 'ids'
      properties:
        category:
          $ref: '#/components/schemas/CategoryWind'
        ids:
          $ref: '#/components/schemas/PlantUnitIds'
        minCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by minimum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity greater than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 100
        maxCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by maximum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity less than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 5000
    PlantThermalData:
      type: 'object'
      description: 'Query parameters for thermal/fossil plant technical specifications. You may provide either plant IDs or unit IDs; when a plant ID is provided, all units within that plant are returned.'
      required:
        - 'category'
        - 'ids'
      properties:
        category:
          $ref: '#/components/schemas/CategoryThermal'
        ids:
          $ref: '#/components/schemas/PlantUnitIds'
        minCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by minimum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity greater than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 100
        maxCapacityMw:
          type: 'number'
          nullable: true
          minimum: 0
          description: 'Filter by maximum nameplate capacity in megawatts (MW), inclusive. Returns units with capacity less than or equal to this value. Note - capacity value is only returned in the Metadata response.'
          example: 5000
    MarketDataRequest:
      type: 'object'
      description: 'Request body for balancing authority market data.'
      required:
        - 'data'
      properties:
        data:
          $ref: '#/components/schemas/MarketDataRequestData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    MarketDataRequestData:
      type: 'object'
      description: "Market data query parameters. The `category` field selects the record shape returned.\n"
      oneOf:
        - $ref: '#/components/schemas/MarketDataGenerationData'
        - $ref: '#/components/schemas/MarketDataDemandData'
        - $ref: '#/components/schemas/MarketDataInterchangeData'
      discriminator:
        propertyName: 'category'
        mapping:
          Generation: '#/components/schemas/MarketDataGenerationData'
          Demand: '#/components/schemas/MarketDataDemandData'
          Interchange: '#/components/schemas/MarketDataInterchangeData'
    MarketDataGenerationData:
      type: 'object'
      description: 'Query parameters for balancing authority net generation data. Reported at the balancing-authority level, broken out by fuel type.'
      required:
        - 'category'
        - 'ids'
        - 'startDate'
        - 'endDate'
      properties:
        category:
          $ref: '#/components/schemas/CategoryGeneration'
        ids:
          $ref: '#/components/schemas/BalancingAuthorityIds'
        startDate:
          type: 'string'
          format: 'date'
          description: 'Return records on or after this date (YYYY-MM-DD).'
          example: '2024-01-01'
        endDate:
          type: 'string'
          format: 'date'
          description: 'Return records on or before this date (YYYY-MM-DD).'
          example: '2024-01-07'
    MarketDataDemandData:
      type: 'object'
      description: 'Query parameters for balancing authority electricity demand data. Reported at the sub-region level.'
      required:
        - 'category'
        - 'ids'
        - 'startDate'
        - 'endDate'
      properties:
        category:
          $ref: '#/components/schemas/CategoryDemand'
        ids:
          $ref: '#/components/schemas/BalancingAuthoritySubRegionIds'
        startDate:
          type: 'string'
          format: 'date'
          description: 'Return records on or after this date (YYYY-MM-DD).'
          example: '2024-01-01'
        endDate:
          type: 'string'
          format: 'date'
          description: 'Return records on or before this date (YYYY-MM-DD).'
          example: '2024-01-07'
    MarketDataInterchangeData:
      type: 'object'
      description: 'Query parameters for balancing authority net interchange data.'
      required:
        - 'category'
        - 'ids'
        - 'startDate'
        - 'endDate'
      properties:
        category:
          $ref: '#/components/schemas/CategoryInterchange'
        ids:
          $ref: '#/components/schemas/BalancingAuthoritySubRegionIds'
        startDate:
          type: 'string'
          format: 'date'
          description: 'Return records on or after this date (YYYY-MM-DD).'
          example: '2024-01-01'
        endDate:
          type: 'string'
          format: 'date'
          description: 'Return records on or before this date (YYYY-MM-DD).'
          example: '2024-01-07'
        respondentFactsetBaSubRegId:
          type: 'string'
          nullable: true
          default: null
          description: 'Filter to a specific counterpart balancing authority sub-region.'
          example: '05WTT4-M'
    PricesRequest:
      type: 'object'
      description: 'Request body for power market price data.'
      required:
        - 'data'
      properties:
        data:
          $ref: '#/components/schemas/PricesRequestData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    PricesRequestData:
      type: 'object'
      description: "Price query parameters. The `category` field selects the record shape returned.\n"
      oneOf:
        - $ref: '#/components/schemas/PowerPriceData'
        - $ref: '#/components/schemas/SparkSpreadData'
        - $ref: '#/components/schemas/CapacityPriceData'
        - $ref: '#/components/schemas/ForwardPriceData'
      discriminator:
        propertyName: 'category'
        mapping:
          Power: '#/components/schemas/PowerPriceData'
          SparkSpread: '#/components/schemas/SparkSpreadData'
          Capacity: '#/components/schemas/CapacityPriceData'
          Forward: '#/components/schemas/ForwardPriceData'
    PowerPriceData:
      type: 'object'
      description: 'Query parameters for spot power prices.'
      required:
        - 'category'
        - 'ids'
        - 'startDate'
        - 'endDate'
      properties:
        category:
          $ref: '#/components/schemas/CategoryPower'
        ids:
          $ref: '#/components/schemas/LocationIds'
        startDate:
          type: 'string'
          format: 'date'
          description: 'Return price records on or after this trade date (YYYY-MM-DD).'
          example: '2024-01-01'
        endDate:
          type: 'string'
          format: 'date'
          description: 'Return price records on or before this trade date (YYYY-MM-DD).'
          example: '2024-03-31'
    SparkSpreadData:
      type: 'object'
      description: 'Query parameters for natural gas spark spread data.'
      required:
        - 'category'
        - 'ids'
        - 'startDate'
        - 'endDate'
      properties:
        category:
          $ref: '#/components/schemas/CategorySparkSpread'
        ids:
          $ref: '#/components/schemas/LocationIds'
        startDate:
          type: 'string'
          format: 'date'
          description: 'Return spark spread records on or after this date (YYYY-MM-DD).'
          example: '2024-01-01'
        endDate:
          type: 'string'
          format: 'date'
          description: 'Return spark spread records on or before this date (YYYY-MM-DD).'
          example: '2024-03-31'
    CapacityPriceData:
      type: 'object'
      description: 'Query parameters for capacity auction clearing prices.'
      required:
        - 'category'
        - 'ids'
      properties:
        category:
          $ref: '#/components/schemas/CategoryCapacity'
        ids:
          $ref: '#/components/schemas/LocationIds'
        deliveryYear:
          type: 'integer'
          format: 'int32'
          nullable: true
          default: null
          description: 'Filter by capacity delivery year.'
          example: 2026
    ForwardPriceData:
      type: 'object'
      description: 'Query parameters for forward power price curves.'
      required:
        - 'category'
        - 'ids'
        - 'startDate'
        - 'endDate'
      properties:
        category:
          $ref: '#/components/schemas/CategoryForward'
        ids:
          $ref: '#/components/schemas/LocationIds'
        startDate:
          type: 'string'
          format: 'date'
          description: 'Return forward price records with a trade date on or after this date (YYYY-MM-DD).'
          example: '2024-01-01'
        endDate:
          type: 'string'
          format: 'date'
          description: 'Return forward price records with a trade date on or before this date (YYYY-MM-DD).'
          example: '2024-06-30'
        priceType:
          type: 'string'
          nullable: true
          enum:
            - 'OnPeak'
            - 'OffPeak'
            - 'AroundTheClock'
          description: 'Filter by forward price type. `AroundTheClock` availability is pending confirmation with the data team.'
          example: 'OnPeak'
    HourlyGenerationRequest:
      type: 'object'
      description: 'Request body for hourly plant unit generation and emissions.'
      required:
        - 'data'
      properties:
        data:
          type: 'object'
          description: 'Hourly generation query parameters.'
          required:
            - 'ids'
            - 'startDate'
            - 'endDate'
          properties:
            ids:
              $ref: '#/components/schemas/PlantUnitIds'
            startDate:
              type: 'string'
              format: 'date'
              description: 'Return records on or after this date (YYYY-MM-DD).'
              example: '2024-06-01'
            endDate:
              type: 'string'
              format: 'date'
              description: 'Return records on or before this date (YYYY-MM-DD).'
              example: '2024-06-07'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    MonthlyGenerationRequest:
      type: 'object'
      description: 'Request body for monthly plant generation and emissions.'
      required:
        - 'data'
      properties:
        data:
