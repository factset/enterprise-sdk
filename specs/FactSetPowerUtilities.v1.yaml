          example: 'Proposed'
        ppSubRegion:
          type: 'string'
          nullable: true
          description: 'Sub-region name where the plant is located (e.g., county in the US).'
          example: 'Chautauqua'
        subRegionType:
          type: 'string'
          nullable: true
          description: 'Type of sub-region (e.g., "County" in the US).'
          example: 'County'
        ppRegion:
          type: 'string'
          nullable: true
          description: 'Region name where the plant is located (e.g., state in the US).'
          example: 'Massachusetts'
        regionType:
