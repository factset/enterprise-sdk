              example:
                - - 'NASA Air Traffic Management'
                  - 'ecoDemonstrator Explorer'
                - - 'X-37B'
                - - 'O3b mPOWER Satellites'
                - - 'CST-100 Starliner'
                - - 'U.S. Air Force Research Laboratories'
                  - 'Ghost Bat'
              nullable: true
    RelationshipsRequest:
      title: 'Relationships Request'
      description: 'Relationships Request for competitor or partner data'
      type: 'object'
      properties:
        data:
          description: 'Request payload containing the list of entity identifiers, relationship type, and optional filter parameters'
          type: 'object'
          properties:
            ids:
              $ref: '#/components/schemas/Ids'
            relationshipType:
              $ref: '#/components/schemas/RelationshipsRelationshipType'
            date:
              $ref: '#/components/schemas/DateSchema'
            fields:
              $ref: '#/components/schemas/RelationshipsFields'
            batch:
              $ref: '#/components/schemas/Batch'
          required:
            - 'ids'
        meta:
          $ref: '#/components/schemas/RequestMeta'
      required:
        - 'data'
    RelationshipsResponse:
      type: 'object'
      title: 'Relationships Response'
      description: "Response containing an array of relationship objects. The schema of each item depends on the `relationshipType` parameter.\n"
      properties:
        data:
          description: "Array of relationship objects - type depends on `relationshipType` parameter.\n"
          type: 'array'
          items:
            $ref: '#/components/schemas/Relationships'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Relationships:
      title: 'Relationships Object'
      type: 'object'
      description: 'Relationship information for an entity, grouped by request identifier and date, with all relationship details nested within items.'
      allOf:
        - $ref: '#/components/schemas/IdentifierResponseFields'
        - type: 'object'
          additionalProperties: true
          properties:
            type:
              type: 'string'
              description: 'Discriminator object for relationships'
              enum:
                - 'RELATIONSHIPS'
              example: 'RELATIONSHIPS'
            error:
              $ref: '#/components/schemas/ErrorObject'
            items:
              description: 'Array of relationship items for the given requestId and date.'
              type: 'array'
              items:
                $ref: '#/components/schemas/RelationshipsItem'
    RelationshipsItem:
      title: 'Relationships Item'
      type: 'object'
      description: "Unified relationship object representing either a competitor or partner. Certain fields are conditionally present based on `relationshipType`.\n"
      allOf:
        - $ref: '#/components/schemas/EntityResponseFields'
        - type: 'object'
          additionalProperties: true
          properties:
            relationshipType:
              $ref: '#/components/schemas/RelationshipTypeEnum'
            direction:
              description: 'Indicates whether the relationship is direct, reverse, or mutual. A direct relationship is disclosed by the source company, while a reverse relationship is disclosed by another company regarding the source company. A mutual relationship indicates that both companies have disclosed the relationship.'
              type: 'string'
              enum:
                - 'DIRECT'
                - 'REVERSE'
                - 'MUTUAL'
              example: 'DIRECT'
              nullable: true
            requestIdSubsidiaries:
              description: 'List of requesting entity subsidiaries involved in this relationship.'
              type: 'array'
              items:
                $ref: '#/components/schemas/Subsidiary'
              example:
                - name: 'Nuance Communications, Inc.'
                  entityId: '0FPWZD-E'
                - name: 'Nuance Health Division'
                  entityId: '0NH123-E'
              nullable: true
            targetSubsidiaries:
              description: 'List of related entity subsidiaries involved in this relationship.'
              type: 'array'
              items:
                $ref: '#/components/schemas/Subsidiary'
              example:
                - name: 'Google Cloud'
                  entityId: '000C7F-E'
                - name: 'Google AI'
                  entityId: '0GAI01-E'
              nullable: true
            overlappingSectorCount:
              description: 'Number of sectors to which both the requesting entity and the related entity are mapped. A higher count indicates greater overlap in business operations. This field is applicable only for COMPETITOR relationships and will be omitted for PARTNER relationships.'
              type: 'integer'
              example: 41
              nullable: true
            relationshipKeywords:
              description: 'Related keywords associated with the relationship to assist in discovering additional related data. Each inner array represents a grouped set of related keywords.'
              type: 'array'
              items:
                type: 'array'
                items:
                  type: 'string'
              example:
                - - 'smartphones'
                  - 'consumer electronics'
                - - '5G devices'
                - - 'semiconductors'
                  - 'chip manufacturing'
              nullable: true
    Ids:
      type: 'array'
      items:
        type: 'string'
      minItems: 1
      maxItems: 1000
      description: 'The requested list of security identifiers. Accepted ID types include Market Tickers, SEDOL, ISINs, CUSIPs, or FactSet Permanent IDs.<p><strong>IDs limit</strong> = 20 per non-batch request and 1000 per batch request.</p><p> Make Note, <strong>GET</strong> method URL request lines are limited to a total length of 8192 bytes (8 KB). For requests with large numbers of identifiers that may exceed this limit, use the corresponding <strong>POST</strong> method where available.</p>'
      example:
        - '000C7F-E'
        - '0FPWZD-E'
    SupplyChainRelationshipType:
      title: 'relationshipType'
      type: 'string'
      enum:
        - 'CUSTOMER'
        - 'SUPPLIER'
      default: 'CUSTOMER'
      description: "Controls the type of supply chain relationship returned.\n  * **CUSTOMER** = Returns entities to which the source company sells products/services.\n  * **SUPPLIER** = Returns entities from which the source company purchases goods or services."
      example: 'CUSTOMER'
    RelationshipsRelationshipType:
      title: 'relationshipType'
      type: 'array'
      default:
        - 'COMPETITOR'
      items:
        $ref: '#/components/schemas/RelationshipTypeEnum'
      description: "Controls the relationship types returned in the response. Multiple relationship types can be selected simultaneously.\n\n  * **COMPETITOR** = Returns entities disclosed by the source company as competitors or rivals.\n\n  * **ALL_PARTNERS** = Returns all available partner relationship types in a single response.\n\n  * **PARTNER_DISTRIBUTION** = Returns distribution partnership relationships.\n\n  * **PARTNER_EQUITY_INVESTMENT** = Returns equity investment partnership relationships.\n\n  * **PARTNER_INTEGRATED_PRODUCT_OFFERING** = Returns integrated product offering partnerships.\n\n  * **PARTNER_INVESTORS** = Returns investor-related partnership relationships.\n\n  * **PARTNER_JOINT_VENTURE** = Returns joint venture partnership relationships.\n\n  * **PARTNER_IN_LICENSING** = Returns in-licensing partnership relationships.\n\n  * **PARTNER_OUT_LICENSING** = Returns out-licensing partnership relationships.\n\n  * **PARTNER_MANUFACTURING** = Returns manufacturing partnership relationships.\n\n  * **PARTNER_MARKETING** = Returns marketing partnership relationships.\n\n  * **PARTNER_RESEARCH_COLLABORATION** = Returns research collaboration partnership relationships."
      example:
        - 'COMPETITOR'
        - 'PARTNER_MARKETING'
    DateSchema:
      type: 'string'
      format: 'date'
      description: 'The date requested in **YYYY-MM-DD** format. If left blank, the API will default to the most recent available data. Future dates (T+1) are not accepted in this endpoint.'
      example: '2025-12-31'
    ErrorResponse:
      type: 'object'
      title: 'Error Response'
      description: 'Default Error Response'
      properties:
        errors:
          type: 'array'
          description: 'An array containing errors'
          items:
            $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: 'object'
      description: 'Error object containing status code, error message, and detailed explanation'
      nullable: true
      properties:
        code:
          description: 'Machine-readable error code indicating the error category. Common values are BadRequest, ValidationError, Unauthorized, Forbidden, NotFound, UnsupportedMediaType, InternalServerError'
          type: 'string'
          example: 'Bad Request'
        title:
          description: 'The plain text error message'
          type: 'string'
          example: 'Invalid Parameter'
        id:
          type: 'string'
          description: 'Unique error instance identifier for tracking'
        detail:
          description: 'Error details explanation'
          type: 'string'
          example: 'The parameter ''ids'' should be valid and may not be empty.'
        source:
          type: 'object'
          description: 'Reference to error source'
          nullable: true
          properties:
            parameter:
              type: 'string'
              description: 'Query parameter that caused the error (e.g., "ids[3]")'
            pointer:
              type: 'string'
              description: 'JSON Pointer to request body field that caused the error'
            value:
              type: 'string'
              description: 'The actual value that caused the error'
  parameters:
    ids:
      name: 'ids'
