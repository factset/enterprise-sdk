openapi: '3.0.0'
info:
  version: '2.0.0'
  title: 'FactSet Supply Chain API'
  contact:
    name: 'FactSet Research Systems'
    email: 'api@factset.com'
    url: 'https://developer.factset.com/contact'
  description: "FactSet Supply Chain Relationships data exposes and classifies the business\nrelationships and interconnections among global companies.\n\nRelationship information is sourced from trusted primary sources and\nreverse-linked to non-disclosing parties, creating a comprehensive and\nconsistent relationship graph.\n\nAccess the complex networks of companies' key customers, suppliers,\ncompetitors, and strategic partners, including both direct\n(named by company) and reverse (named by other companies) relationships.\n\nOver **43,000 companies** are actively covered and involved in more than\n**735,000 relationships**.\n\nSources include primary public sources such as:\n\n- SEC 10-K annual filings\n- Investor presentations\n- Press releases\n\nThis API provides the following endpoints:\n\n- `/supply-chain` — Retrieve supplier and customer relationships with\n  centrality measures, relevance grades, and revenue percentages\n- `/relationships` — Retrieve competitor and partner relationships with\n  sector overlap and relationship keywords\n\n**Rate limits**\n\n- 10 requests per second\n- 10 concurrent requests per user\n"
  license:
    name: 'Apache License, Version 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
externalDocs:
  description: 'API Documentation'
  url: 'https://developer.factset.com/api-catalog/factset-supply-chain-api'
servers:
  - url: 'https://api.factset.com/content/factset-supply-chain/v2'
    description: 'Production'
security:
  - FactSetApiKey: []
  - FactSetOAuth2: []
tags:
  - name: 'Supply Chain'
    description: 'Retrieve supplier and customer relationships for requested entities, including subsidiaries, revenue percentages, relevance grades, centrality measures, and relationship keywords.'
  - name: 'Relationships'
    description: 'Retrieve competitor and partner relationships for requested entities. The response schema varies based on the `relationshipType` parameter - competitor responses include overlapping sector counts, while partner responses include specific partner type classifications.'
  - name: 'Batch Processing'
    description: 'Manage asynchronous requests by checking their status and retrieving results for long-running batch jobs."'
paths:
  /supply-chain:
    get:
      tags:
        - 'Supply Chain'
      summary: 'Get supply chain relationships for requested entities.'
      operationId: 'listSupplyChain'
      description: "Retrieve supplier and customer relationships for the requested\nentity or entities.\n\nIncludes:\n\n- subsidiaries\n- revenue percentages\n- relevance grades\n- centrality measures\n- relationship keywords\n\nUse the `relationshipType` parameter to filter by:\n\n- `CUSTOMER`\n- `SUPPLIER`\n\nHistorical data can be accessed only with the Historical product\nsubscription. If the product is not subscribed, data for the latest\navailable period will be returned.\n"
      parameters:
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/supplyChainRelationshipType'
        - $ref: '#/components/parameters/date'
        - $ref: '#/components/parameters/supplyChainFields'
        - $ref: '#/components/parameters/batch'
        - $ref: '#/components/parameters/_paginationLimit'
        - $ref: '#/components/parameters/_paginationOffset'
      responses:
        '200':
          description: 'Successful response containing supply chain relationships for the requested entity IDs.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyChainResponse'
              examples:
                Supply Chain relationships for successful entity:
                  $ref: '#/components/examples/supplyChainResponseExample'
                Supply Chain relationships for partial success:
                  $ref: '#/components/examples/supplyChainResponsePartialExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags:
        - 'Supply Chain'
      summary: 'Get supply chain relationships for a large list of entity IDs.'
      description: "Retrieve supplier and customer relationships for a large list of\nentity IDs.\n\nIncludes:\n\n- subsidiaries\n- revenue percentages\n- relevance grades\n- centrality measures\n- relationship keywords\n\nUse the `relationshipType` parameter to filter by:\n\n- `CUSTOMER`\n- `SUPPLIER`\n\nHistorical data can be accessed only with the Historical product\nsubscription. If the product is not subscribed, data for the latest\navailable period will be returned.\n"
      operationId: 'listSupplyChainForList'
      requestBody:
        required: true
        description: 'The Supply Chain request body, allowing the user to specify a list of IDs.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyChainRequest'
            examples:
              Request for Supply Chain:
                $ref: '#/components/examples/postSupplyChain'
      responses:
        '200':
          description: 'Successful response containing supply chain relationships for the large list of entity IDs.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyChainResponse'
              examples:
                Supply Chain relationships for successful entity:
                  $ref: '#/components/examples/supplyChainResponseExample'
                Supply Chain relationships for partial success:
                  $ref: '#/components/examples/supplyChainResponsePartialExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /relationships:
    get:
      tags:
        - 'Relationships'
      summary: 'Get competitor or partner relationships for requested entities.'
      operationId: 'listRelationships'
      description: "Retrieve competitor or partner relationships for the requested\nentity or entities.\n\nUse the `relationshipType` parameter to select one or more\nrelationship types.\n\nHistorical data can be accessed only with the Historical product\nsubscription. If the product is not subscribed, data for the latest\navailable period will be returned.\n"
      parameters:
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/relationshipsRelationshipType'
        - $ref: '#/components/parameters/date'
        - $ref: '#/components/parameters/relationshipsFields'
        - $ref: '#/components/parameters/batch'
        - $ref: '#/components/parameters/_paginationLimit'
        - $ref: '#/components/parameters/_paginationOffset'
      responses:
        '200':
          description: 'The Relationships response object. The schema of each item in the `data` array depends on the `relationshipType` parameter.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipsResponse'
              examples:
                Competitor relationships for one successful entity:
                  $ref: '#/components/examples/competitorResponseExample'
                Competitor relationships for partial successful entities:
                  $ref: '#/components/examples/competitorResponsePartialExample'
                Partner relationships for one successful entity:
                  $ref: '#/components/examples/partnerResponseExample'
                Partner relationships for partial successful entities:
                  $ref: '#/components/examples/partnerResponsePartialExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags:
        - 'Relationships'
      summary: 'Get competitor or partner relationships for a large list of entity IDs.'
      description: "Retrieve competitor or partner relationships for the requested\nentity or entities.\n\nUse the `relationshipType` parameter to select one or more\nrelationship types.\n\nHistorical data can be accessed only with the Historical product\nsubscription. If the product is not subscribed, data for the latest\navailable period will be returned.\n"
      operationId: 'listRelationshipsForList'
      requestBody:
        required: true
        description: 'The Relationships request body, allowing the user to specify a list of IDs and relationship type.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipsRequest'
            examples:
              Request for Competitors for AAPL and MSFT:
                $ref: '#/components/examples/postCompetitor'
              Request for Partners for AAPL and MSFT:
                $ref: '#/components/examples/postPartner'
      responses:
        '200':
          description: 'The Relationships response object. The schema of each item in the `data` array depends on the `relationshipType` parameter.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipsResponse'
              examples:
                Competitor relationships for one successful entity:
                  $ref: '#/components/examples/competitorResponseExample'
                Competitor relationships for partial successful entities:
                  $ref: '#/components/examples/competitorResponsePartialExample'
                Partner relationships for one successful entity:
                  $ref: '#/components/examples/partnerResponseExample'
                Partner relationships for partial successful entities:
                  $ref: '#/components/examples/partnerResponsePartialExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /batch-status:
    get:
      tags:
        - 'Batch Processing'
      summary: 'Returns the status for a Batch Request'
      description: 'Return the status for the underlying batch request that is specified by the ID.'
      operationId: 'getBatchStatus'
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '201':
          description: 'The batch Request has been completed and the response has been created.'
          headers:
            Location:
              description: 'Path to Batch Request result.'
              schema:
                type: 'string'
              example: 'batch-result?id=2df43e85-ea0f-45c6-bf4a-2baf4d1eaa3c'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatusResponse'
        '202':
          description: 'The batch Request has not finished and the result has NOT been created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatusResponse'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      deprecated: false
  /batch-result:
    get:
      tags:
        - 'Batch Processing'
      summary: 'Returns the response for a Batch Request'
      description: "Returns the response data for the underlying batch request that is specified by the ID. The response structure will be based on the endpoint that initiated the batch request.\n"
      operationId: 'getBatchData'
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '200':
          description: 'The long-running request has been completed and the result is created. The response structure will be based on the endpoint that initiated the batch request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultResponse'
              examples:
                Supply Chain relationships for successful entity:
                  $ref: '#/components/examples/supplyChainResponseExample'
                Competitor relationships for one successful entity:
                  $ref: '#/components/examples/competitorResponseExample'
                Partner relationships for one successful entity:
                  $ref: '#/components/examples/partnerResponseExample'
        '202':
          description: 'The batch Request has not finished and the result has NOT been created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatusResponse'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      x-factset-different-success-responses: true
components:
  securitySchemes:
    FactSetOAuth2:
      type: 'oauth2'
      flows:
        clientCredentials:
          tokenUrl: 'https://auth.factset.com/as/token.oauth2'
          scopes: {}
    FactSetApiKey:
      type: 'http'
      scheme: 'basic'
  schemas:
    IdentifierResponseFields:
      title: 'Common Identifier and Date Response Fields'
      description: 'Reusable component containing the standard `requestId` field used in response objects'
      type: 'object'
      additionalProperties: true
      properties:
        requestId:
          description: 'The requested identifier sent as input.'
          type: 'string'
          example: '000C7F-E'
        date:
          description: 'The requested date in YYYY-MM-DD format.'
          type: 'string'
          format: 'date'
          example: '2025-02-26'
          nullable: true
    EntityResponseFields:
      title: 'Common Entity Response Fields'
      description: 'Reusable component containing standard entity fields used in relationship response objects'
      type: 'object'
      additionalProperties: true
      properties:
        entityId:
          description: 'Unique FactSet-generated identifier representing the related entity. Six alpha-numeric characters with a -E suffix (XXXXXX-E).'
          type: 'string'
          example: '05MCSG-E'
        entityName:
          description: 'The proper name of the related entity.'
          type: 'string'
          example: 'Apple Inc.'
    RelationshipTypeEnum:
      title: 'Relationship Type Names'
      description: 'Supported relationship types'
      type: 'string'
      enum:
        - 'COMPETITOR'
        - 'ALL_PARTNERS'
        - 'PARTNER_DISTRIBUTION'
        - 'PARTNER_EQUITY_INVESTMENT'
        - 'PARTNER_INTEGRATED_PRODUCT_OFFERING'
        - 'PARTNER_INVESTORS'
        - 'PARTNER_JOINT_VENTURE'
        - 'PARTNER_IN_LICENSING'
        - 'PARTNER_OUT_LICENSING'
        - 'PARTNER_MANUFACTURING'
        - 'PARTNER_MARKETING'
        - 'PARTNER_RESEARCH_COLLABORATION'
    SupplyChainFieldsEnum:
      title: 'Supply Chain Field Names'
      description: 'Supported field names for Supply Chain responses'
      type: 'string'
      enum:
        - 'supplierSubsidiaries'
        - 'customerSubsidiaries'
        - 'relationshipKeywords'
        - 'revenuePct'
        - 'relevanceGrade'
        - 'centrality'
        - 'direction'
    SupplyChainFields:
      title: 'Supply Chain Response Attributes'
      description: "A specific set of attributes to return in the response. If omitted, all fields are returned.\n"
      type: 'array'
      items:
        $ref: '#/components/schemas/SupplyChainFieldsEnum'
      uniqueItems: true
    RelationshipsFieldsEnum:
      title: 'Relationships Field Names'
      description: 'Supported field names for Relationships responses'
      type: 'string'
      enum:
        - 'requestIdSubsidiaries'
        - 'targetSubsidiaries'
        - 'overlappingSectorCount'
        - 'relationshipKeywords'
        - 'direction'
    RelationshipsFields:
      title: 'Relationships Response Attributes'
      description: "A specific set of attributes to return in the response.\nIf omitted, all fields are returned.\n"
      type: 'array'
      items:
        $ref: '#/components/schemas/RelationshipsFieldsEnum'
      uniqueItems: true
    Subsidiary:
      title: 'Subsidiary'
      description: "Subsidiary information including the subsidiary name and its FactSet-generated entity identifier, if available.\n"
      type: 'object'
      properties:
        name:
          description: 'The proper name of the subsidiary.'
          type: 'string'
          example: 'NASA'
          nullable: true
        entityId:
          description: 'Unique FactSet-generated identifier representing the subsidiary entity. Six alpha-numeric characters with a `-E` suffix (XXXXXX-E).'
          type: 'string'
          example: '0RXZ3R-E'
          nullable: true
    RequestMeta:
      type: 'object'
      description: 'meta definition for pagination'
      properties:
        pagination:
          $ref: '#/components/schemas/RequestPagination'
    RequestPagination:
      type: 'object'
      description: 'Object defining the pagination attributes for an endpoint request.'
      properties:
        limit:
          type: 'integer'
          format: 'int32'
          description: 'The maximum number of records to return. The default is 20.'
          example: 100
          minimum: 1
          maximum: 500
          default: 20
        offset:
          type: 'integer'
          format: 'int32'
          description: 'The number of records to skip before the first record to return. The default is 0.'
          minimum: 0
          maximum: 2147483147
          example: 0
          default: 0
    ResponseMeta:
      title: 'Response Meta'
      description: 'Metadata object for the API response.'
      type: 'object'
      properties:
        pagination:
          $ref: '#/components/schemas/ResponsePagination'
    ResponsePagination:
      title: 'Pagination'
      description: 'Pagination object for the API response.'
      type: 'object'
      properties:
        total:
          description: 'Total number of records the API returns for a particular query.'
          type: 'integer'
          format: 'int64'
        isEstimatedTotal:
          description: 'Boolean value that represents whether the total count of records returned is exact or an estimate. This is defaulted to False as the API should always return the exact count.'
          type: 'boolean'
    BatchStatusResponse:
      title: 'Batch Status Response'
      description: 'Batch Status Response'
      type: 'object'
      required:
        - 'data'
      properties:
        data:
          $ref: '#/components/schemas/BatchStatus'
    BatchStatus:
      title: 'Batch Status'
      description: 'Batch Status object'
      type: 'object'
      properties:
        id:
          type: 'string'
          format: 'uuid'
          description: 'the id of batch request.'
        startTime:
          type: 'string'
          format: 'date-time'
          description: 'Time when the batch request is started. This is in Eastern Time Zone. The date-time format is expressed as `[YYYY-MM-DD]T[HH:MM:SSS]`, following ISO 8601.'
        endTime:
          type: 'string'
          format: 'date-time'
          description: 'Time when the batch request is ended. This is in Eastern Time Zone. The date-time format is expressed as `[YYYY-MM-DD]T[HH:MM:SSS]`, following ISO 8601.'
          nullable: true
        status:
          type: 'string'
          description: 'Status of the batch request'
          enum:
            - 'QUEUED'
            - 'EXECUTING'
            - 'CREATED'
            - 'FAILED'
        error:
          $ref: '#/components/schemas/ErrorObject'
    BatchResultResponse:
      title: 'Batch Data Response'
      description: 'Batch Response object'
      type: 'object'
      required:
        - 'data'
      properties:
        data:
          description: 'Batch Response object'
          type: 'array'
          items:
            $ref: '#/components/schemas/BatchResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BatchResult:
      title: 'Batch Data'
      description: 'Batch Response object'
      oneOf:
        - $ref: '#/components/schemas/SupplyChain'
        - $ref: '#/components/schemas/Relationships'
      discriminator:
        propertyName: 'type'
        mapping:
          Supplychain: '#/components/schemas/SupplyChain'
          Relationships: '#/components/schemas/Relationships'
    Batch:
      description: 'Enables the ability to asynchronously "batch" the request, supporting a long-running request. Upon requesting batch=Y, the service will respond back with an HTTP Status Code of 202. Once a batch request is submitted, use the corresponding `/batch-status` and `/batch-result` endpoints to retrieve the status and result.'
      type: 'string'
      enum:
        - 'Y'
        - 'N'
      default: 'N'
    SupplyChainRequest:
      title: 'Supply Chain Request'
      description: 'Supply Chain Request'
      type: 'object'
      properties:
        data:
          description: 'Request payload containing the list of entity identifiers and optional filter parameters'
          type: 'object'
          properties:
            ids:
              $ref: '#/components/schemas/Ids'
            relationshipType:
              $ref: '#/components/schemas/SupplyChainRelationshipType'
            date:
              $ref: '#/components/schemas/DateSchema'
            fields:
              $ref: '#/components/schemas/SupplyChainFields'
            batch:
              $ref: '#/components/schemas/Batch'
          required:
            - 'ids'
        meta:
          $ref: '#/components/schemas/RequestMeta'
      required:
        - 'data'
    SupplyChainResponse:
      type: 'object'
      title: 'Supply Chain Response'
      description: 'Response containing an array of supply chain relationship objects'
      properties:
        data:
          description: 'Array of Supply Chain Objects'
          type: 'array'
          items:
            $ref: '#/components/schemas/SupplyChain'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SupplyChain:
      title: 'Supply Chain Relationship Object'
      type: 'object'
      description: 'Comprehensive supply chain relationship information for an entity including subsidiaries, revenue percentages, relevance grades, centrality measures, and relationship keywords'
      allOf:
        - $ref: '#/components/schemas/IdentifierResponseFields'
        - type: 'object'
          additionalProperties: true
          properties:
            type:
              type: 'string'
              description: 'Discriminator object for supplychain'
              enum:
                - 'SUPPLY_CHAIN'
              example: 'SUPPLY_CHAIN'
            error:
              $ref: '#/components/schemas/ErrorObject'
            items:
              description: 'Array of supply chain relationship items for the given requestId and date.'
              type: 'array'
              items:
                $ref: '#/components/schemas/SupplyChainItem'
    SupplyChainItem:
      title: 'Supply Chain Item'
      type: 'object'
      description: 'A single supply chain relationship record containing entity details, relationship type, centrality measures, subsidiary details, revenue percentages, relevance grades, and relationship keywords.'
      allOf:
        - $ref: '#/components/schemas/EntityResponseFields'
        - type: 'object'
          additionalProperties: true
          properties:
            relationshipType:
              description: 'Code denoting the type of relationship. For supply chain endpoints, values are CUSTOMER or SUPPLIER.'
              type: 'string'
              enum:
                - 'CUSTOMER'
                - 'SUPPLIER'
              example: 'CUSTOMER'
            direction:
              description: 'Indicates whether the relationship is direct, reverse, or mutual. A direct relationship is disclosed by the source company, while a reverse relationship is disclosed by another company regarding the source company. A mutual relationship indicates that both companies have disclosed the relationship.'
              type: 'string'
              example: 'DIRECT'
              enum:
                - 'DIRECT'
                - 'REVERSE'
                - 'MUTUAL'
              nullable: true
            revenuePct:
              description: 'Percentage of revenue that the source company derived from this relationship in the reporting period. This field is only applicable to relationships reported as Customer and only then for those cases where the reporting company provides a percentage.'
              type: 'number'
              format: 'double'
              example: 15.97
              nullable: true
            relevanceGrade:
              description: 'Integer value between 1 and 10,000 indicating the relevance factors'' grade for this relationship. A higher grade indicates a more significant supply chain relationship.'
              type: 'integer'
              minimum: 0
              maximum: 10000
              format: 'int32'
              example: 8
              nullable: true
            supplierSubsidiaries:
              description: 'List of supplier subsidiaries involved in this relationship. Only present when a subsidiary is disclosed as the specific entity involved in a relationship.'
              type: 'array'
              items:
                $ref: '#/components/schemas/Subsidiary'
              example:
                - name: 'NASA'
                  entityId: '0RXZ3R-E'
                - name: 'JAXA'
                  entityId: '0645P3-E'
              nullable: true
            customerSubsidiaries:
              description: 'List of customer subsidiaries involved in this relationship. Only present when a subsidiary is disclosed as the specific entity involved in a relationship.'
              type: 'array'
              items:
                $ref: '#/components/schemas/Subsidiary'
              example:
                - name: 'Honeywell Aerospace & Defense'
                  entityId: '000KYG-E'
                - name: 'Lockheed Martin Aeronautics'
                  entityId: '0A1BCD-E'
              nullable: true
            centrality:
              description: "Centrality metrics representing the entity's relative importance and connectivity within the supply chain network.\n"
              type: 'object'
              nullable: true
              properties:
                degree:
                  description: 'Degree centrality represents the number of direct connections with suppliers and customers. The value is normalized by the number of entities in the supply chain database at each calculation date.'
                  type: 'number'
                  minimum: 0
                  maximum: 100
                  format: 'double'
                  example: 0.842697
                  nullable: true
                eigenvector:
                  description: 'Eigenvector centrality assigns higher scores to companies connected to well-connected firms. This measure is calculated in an undirected network, meaning both supplier-customer and customer-supplier relationships are considered. All scores are normalized by L2 norm at each calculation date.'
                  type: 'number'
                  minimum: 0
                  maximum: 100
                  format: 'double'
                  example: 5.420991
                  nullable: true
                productKatz:
                  description: 'Katz centrality assesses both direct and downstream connections while reducing the influence of indirect connections based on distance. PRODUCT_KATZ reflects the impact of both direct and indirect suppliers. All scores are normalized by L2 norm at each calculation date.'
                  type: 'number'
                  minimum: 0
                  maximum: 100
                  format: 'double'
                  example: 5.460563
                  nullable: true
                cashKatz:
                  description: 'Katz centrality assesses both direct and downstream connections while reducing the influence of indirect connections based on distance. CASH_KATZ reflects the impact of both direct and indirect customers. All scores are normalized by L2 norm at each calculation date.'
                  type: 'number'
                  minimum: 0
                  maximum: 100
                  format: 'double'
                  example: 0.556619
                  nullable: true
                customer:
                  description: 'Customer centrality is derived from the HITS (Hyperlink-Induced Topic Search) algorithm, assigning higher scores to customers connected to suppliers relied upon by many other customers. All scores are normalized by L1 norm at each calculation date.'
                  type: 'number'
                  minimum: 0
                  maximum: 100
                  format: 'double'
                  example: 0.268328
                  nullable: true
                supplier:
                  description: 'Supplier centrality is derived from the HITS (Hyperlink-Induced Topic Search) algorithm, assigning high scores to suppliers connected to customers with high customer centrality. All scores are normalized by L1 norm at each calculation date.'
                  type: 'number'
                  minimum: 0
                  maximum: 100
                  format: 'double'
                  example: 0.030261
                  nullable: true
            relationshipKeywords:
              description: 'Related keywords associated with the relationship to assist in discovering additional related data. Each inner array represents a grouped set of related keywords.'
