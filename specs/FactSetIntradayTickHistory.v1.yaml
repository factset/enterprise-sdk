components:
  schemas:
    Fields:
      type: 'object'
      properties:
        BID:
          type: 'number'
          description: 'The last bid price or last bid price in an interval. FID # 509'
          format: 'float'
        BID_VOL:
          type: 'integer'
          description: 'The volume of the last bid in an interval. FID # 505'
        BID_EXCH:
          type: 'string'
          description: 'The volume of the last bid or last bid in an interval. FID # 506.'
        ASK:
          type: 'number'
          description: 'The last ask price or last ask price in an interval. FID # 609'
          format: 'float'
        ASK_VOL:
          type: 'integer'
          description: 'The volume of the last ask or last ask in an interval. FID # 605'
        ASK_EXCH:
          type: 'string'
          description: 'The exchange of the last ask or last ask in an interval. FID # 606.'
        LAST_PRICE:
          type: 'number'
          description: 'The last trade price or last trade price in an interval. FID # 50'
          format: 'float'
        LAST_DATE:
          type: 'string'
          description: 'The date of the last trade or last trade in an interval. FID # 384'
        LAST_TIME:
          type: 'string'
          description: 'The time of the last trade or last trade in an interval. FID # 383'
        LAST_VOL:
          type: 'integer'
          description: 'The trade volume, or the sum of all trade volumes inside a bin. FID # 31'
        LAST_EXCH:
          type: 'string'
          description: 'The exchange of the last trade or last trade in an interval. FID # 33.'
        CVOL:
          type: 'integer'
          description: 'The symbol''s daily cumulative volume, or the last cumulative volume in an interval. FID # 132'
        VWAP:
          type: 'number'
          description: 'The daily volume weighted average price, or the last VWAP in an interval. FID # 780'
          format: 'float'
        OPEN:
          type: 'number'
          description: 'The first trade of an interval. FID # 158'
          format: 'float'
        HIGH:
          type: 'number'
          description: 'The highest trade price in an interval. FID # 107'
          format: 'float'
        LOW:
          type: 'number'
          description: 'The lowest trade price in an interval. FID # 307'
          format: 'float'
        TRADE_CONDITION:
          type: 'string'
          description: 'Trade Condition. FID # 174'
        GMT_OFFSET:
          type: 'integer'
          description: 'GMT Offset in Minutes. FID # 389'
        PRICE_CURRENCY:
          type: 'string'
          description: 'Price Currency Code. FID # 62'
      description: 'All available fields in service. FID = Field ID Number.'
    TickHistoryResponse:
      type: 'object'
      properties:
        Requested ID:
          type: 'string'
          description: 'Request Identification String.'
          example: ''
        Requested Symbol:
          type: 'string'
          description: 'Single Requested Symbol or Security.'
          example: 'IBM-USA'
        Requested Fields:
          type: 'array'
          description: 'Array of requested fields '
          example: 'LAST_1,LAST_TIME_1,LAST_VOL_1'
          items:
            $ref: '#/components/schemas/Fields'
        Request Key:
          type: 'string'
          example: '5C8926159C36F315'
        Error Code:
          type: 'string'
          example: '0'
        Error Description:
          type: 'string'
          description: 'Brief description of error response. Blank if successful.'
          example: ''
        Field Names:
          type: 'string'
          description: 'Requested Field Names'
          example: ''
        Field IDs:
          type: 'number'
          description: 'Requested Field ID numbers ''FID''. Found in Data Service Manual.'
        Key:
          type: 'string'
          description: 'Requested Symbol Key, where :D represented delayed data.'
          example: 'IBM-USA:D'
        Values:
          type: 'number'
          description: 'Array of field values. Each value is returned for requested interval query.'
      description: 'response for tick history'
    Intervals:
      title: 'intervals'
      type: 'object'
      properties:
        '0':
          type: 'string'
          description: 'Every Tick. Max days requested = 1'
        1S:
          type: 'string'
          description: '1 Second. Max days requested = 1'
        5S:
          type: 'string'
          description: '5 Seconds. Max days requested = 1'
        10S:
          type: 'string'
          description: '10 Seconds. Max days requested = 1'
        15S:
          type: 'string'
          description: '15 Seconds. Max days requested = 1'
        30S:
          type: 'string'
          description: '30 Seconds. Max days requested = 15'
        1M:
          type: 'string'
          description: '1 Minute. Max days requested = 30'
        2M:
          type: 'string'
          description: '2 Minutes. Max days requested = 60'
        5M:
          type: 'string'
          description: '5 Minutes. Max days requested = 60'
        10M:
          type: 'string'
          description: '10 Minutes. Max days requested = 60'
        15M:
          type: 'string'
          description: '15 Minutes. Max days requested = 60'
        30M:
          type: 'string'
          description: '30 Minutes. Max days requested = 60'
        1H:
          type: 'string'
          description: '1 Hour. Max days requested = 60'
    SpecialField:
      title: 'special field values'
      type: 'object'
      properties:
        NF:
          type: 'string'
          description: '**#NF#** - Not found. The requested symbol could not be found by the service.'
        NA:
          type: 'object'
          description: '**#NA#** - Not Applicable. The requested field could not be found for the requested symbol. This usually means that the field is not applicable for this type of record.'
    ErrorResponse:
      type: 'object'
      title: 'Error Response'
      description: 'Error default response.'
      properties:
        errors:
          type: 'array'
          description: 'An array containing errors'
          items:
            $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: 'object'
      properties:
        id:
          description: 'A UUID for this particular occurrence of the problem.'
          type: 'string'
          format: 'uuid'
          example: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code:
          description: 'status'
          type: 'string'
          example: 'Bad Request'
        title:
          description: 'The plain text error message.'
          type: 'string'
          example: 'Validation Error'
  parameters:
    reqId:
      name: 'req_id'
      in: 'query'
      description: 'Request Identification String. Can be used by the application to keep track of requests.  The id is not used by this service, however, it is included in the response.'
      schema:
        type: 'string'
    format:
      name: 'format'
      in: 'query'
      description: 'The format of the output file. '
      schema:
        type: 'string'
        default: 'XML'
        enum:
          - 'XML'
          - 'JSON'
          - 'CSV'
          - 'CSV_NO_HEADER'
    id:
      name: 'id'
      in: 'query'
      description: 'Requested symbol or security. The symbol can be a FactSet ticker-exchange or ticker-region symbol, CUSIP, ISIN or SEDOL.  <p>**Note**: Only one identifier can be requested per API call. </p> <p>The sandbox environment provides access to the following list of symbols: </p> <p>BABA-USA,WALMEX-MX,7203-TKS,VOD-LON,NPN-JSE,MABAX,NZF,SPY-USA,AGG-USA,GLD-USA,AOR-USA,MNA-USA,UUP-USA,SP50-SPX,ESX-STX,XAO-ASX,WD-MSX,NG00-USA,GC00-USA,CC00-USA,C00-USA,FC00-USA,ER00-USA,EURUSD-FX1,USDMXN-FX1,AUDJPY-FX1,EURCZK-FX1,USDILS-FX1,USDZAR-FX1,US10YY-TU1</p>'
      required: true
      schema:
        type: 'string'
    fields:
      name: 'fields'
      in: 'query'
      description: 'All available fields. This is a comma-separated list (no spaces). See definitions for details. Default is all fields when left blank.'
      schema:
        type: 'string'
    startDate:
      name: 'sd'
      in: 'query'
      description: 'This is the start date for the Snapshot History. Requests should be made in the format **YYYYMMDD**. Default is current business day. Field can be sd or date. **NOTE**: The sandbox environment cannot use current day.'
      schema:
        type: 'string'
    endDate:
      name: 'ed'
      in: 'query'
      description: 'This is the end date for the Snapshot History. Requests should be made in the format **YYYYMMDD**. If the period requested is larger than Max Days requested, results will be limited to the Max Days starting at sd/date. Default is sd or date. **NOTE**: The sandbox environment cannot use current day.'
      schema:
        type: 'string'
    startTime:
      name: 'st'
      in: 'query'
      description: 'Requested start time. This is the start time for the snapshot history requested. Requests should be made in a **HHMMSS** format. Range from 000000 - 235959.'
      schema:
        type: 'string'
        default: '040000'
    endTime:
      name: 'et'
      in: 'query'
      description: 'Requested end time. This is the end time for the snapshot history requested. Requests should be made in a **HHMMSS** format. Range from 000000 - 235959.'
      schema:
        type: 'string'
        default: '200000'
    interval:
      name: 'interval'
      in: 'query'
      description: 'Requested time interval. This is the interval the data is returned from the service. Possible values from 1 Second (1S) to 1 Hour (1H). A maximum of 10 Tick History Requests and a maximum of 100,000 rows of data may be made in any one-minute period. Additional subscription is available to access 20 requests/200,000 rows of data per minute. Contact your FactSet team for details.'
      schema:
        type: 'string'
        default: '1M'
        enum:
          - '0'
          - '1S'
          - '5S'
          - '10S'
          - '15S'
          - '30S'
          - '1M'
          - '2M'
          - '5M'
          - '10M'
          - '15M'
          - '30M'
          - '1H'
    includeRequest:
      name: 'include_request'
      in: 'query'
      description: 'Flag to include request id and key in the CSV output.'
      schema:
        type: 'string'
        default: 'false'
        enum:
          - 'true'
          - 'T'
          - 'false'
          - 'F'
    dataset:
      name: 'dataset'
      in: 'query'
      description: 'Decides what type of trades to return, default is all trades and quotes, alternatively charting can be selected which will filter out unofficial trades.'
      schema:
        type: 'string'
        enum:
          - 'charting'
  responses:
    BadRequest:
      description: 'Bad Request'
      content:
