openapi: '3.0.1'
info:
  title: 'Tick History'
  description: "<p>FactSet’s Tick History provides cost-effective access to real-time and delayed global exchange data. Proprietary technology normalizes over 200 global exchanges and 19 tick history fields. Asset types integrated include equities, futures, options, fixed income, mutual funds, ETFs, indices, commodities, and FX rates.</p><p>Tick History provides dynamic access to tick data for a specific security intra-day or historically via standard HTTPS protocol. History is available for all quotes and trades for a trailing 6 months or 1-year, respectively. Quotes and trade data for Options is available for 30 days. Tick History data is also available in a separate end-of-day feed.</p>\n \n"
  contact:
    url: 'https://developer.factset.com/contact'
    name: 'FactSet Research Systems'
    email: 'api@factset.com'
  license:
    name: 'Apache License, Version 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  version: '1.0.2'
externalDocs:
  description: 'API Documentation'
  url: 'https://developer.factset.com/api-catalog/factset-intraday-tick-history-api'
servers:
  - url: 'https://api.factset.com/TickHistory'
  - url: 'https://api-sandbox.factset.com/TickHistory'
security:
  - FactSetApiKey: []
  - FactSetOAuth2: []
paths:
  /history:
    get:
      tags:
        - 'Tick History'
      summary: 'Tick History service returns trade data and associated quotes for a client specified interval and time period'
      description: "When using an HTTP GET request, the search criteria is sent via the query\nstring in the URL. Please make sure that all requests contain a date\nwithin the past trailing year. Fields are added using ampersands, with\nenumerations separated by commas. Please reach out to your account manager for more information on available exchanges and venues. \nPlease note you must be logged into the Developer Portal and authenticate to access the API. Select Authorize button or visit Authentication Support for more details\nSandbox environment (api-sandbox.factset.com) is available with limited subset of symbols, no current data and with free access. \n"
      operationId: 'get_TickHistory'
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/reqId'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/startTime'
        - $ref: '#/components/parameters/endTime'
        - $ref: '#/components/parameters/interval'
        - $ref: '#/components/parameters/includeRequest'
        - $ref: '#/components/parameters/dataset'
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickHistoryResponse'
              example:
                Request ID: ''
                Requested Symbol: 'IBM-USA'
                Requested Fields: 'LAST_1,LAST_TIME_1,LAST_VOL_1'
                Request Key: '5C8926159C36F315'
                Error Code: 0
                Error Description: ''
                Field Names:
                  - 'LAST_1'
