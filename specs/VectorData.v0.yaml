              example: 2
              nullable: true
            speakerName:
              type: 'string'
              description: 'Name of the speaker.'
              example: 'Tim Cook'
              nullable: true
            speakerType:
              type: 'string'
              description: 'Type of speaker (e.g., corprep, analyst).'
              example: 'corprep'
              nullable: true
            uploadDateTime:
              type: 'string'
              format: 'date-time'
              description: 'Date and time when the document was uploaded to the system.'
              example: '2023-11-19T00:10:45Z'
            speakerTitle:
              type: 'string'
              description: 'Title of the speaker.'
              example: 'Chief Executive Officer'
              nullable: true
            speakerCompanyName:
              type: 'string'
              description: 'Company name of the speaker.'
              example: 'Apple Inc.'
              nullable: true
            speakerCompanyEntityId:
              type: 'string'
              description: 'FactSet entity ID of speaker''s company.'
              example: '000C7F-E'
              nullable: true
            speakerEntity:
              type: 'string'
              description: 'FactSet entity ID of the speaker.'
              example: '07F5D0-E'
              nullable: true
            docType:
              type: 'string'
              description: 'Type of document chunk.'
              example: 'discussion'
              nullable: true
            similarityScore:
              type: 'number'
              description: 'Score indicating the similarity between the query and the result (0-1).'
              minimum: 0
              maximum: 1
              example: 0.8547
            docNum:
              type: 'string'
              description: 'Sequential chunk identifier within the document.'
              example: 'md_2'
              nullable: true
            financialYear:
              type: 'string'
              description: 'Financial year.'
              example: '2024'
              nullable: true
            financialQuarter:
              type: 'string'
              description: 'Financial quarter.'
              example: 'Q3'
              nullable: true
    TranscriptSearch:
      type: 'string'
