            - 'fileName'
          properties:
            fileName:
              type: 'string'
              description: 'Name of the file being uploaded.'
              example: 'annual-report-2024.pdf'
            fileType:
              type: 'string'
              description: 'Type of the file being uploaded.'
              enum:
                - 'Pdf'
                - 'Text'
                - 'Html'
                - 'Md'
                - 'Xml'
              default: 'Html'
              example: 'Pdf'
    IdsDocumentUploadResponse:
      type: 'object'
      description: 'Response body for the document upload endpoint.'
      properties:
        data:
          $ref: '#/components/schemas/IdsDocumentUploadData'
    IdsDocumentUploadData:
      type: 'object'
      description: 'Upload confirmation containing the presigned upload URL.'
      properties:
        requestId:
          type: 'string'
          format: 'uuid'
          description: 'Server-generated UUID for request tracing and support.'
          example: 'b5cc289f-9cf0-4999-aa23-bfd5f7654113'
        documentID:
          type: 'string'
          description: 'Unique identifier of the document.'
          example: '0001493152-24-046748-1'
        fileName:
          type: 'string'
          description: 'fileName of the document.'
          example: 'annual-report-2024.pdf'
        uploadUrl:
          type: 'string'
          format: 'url'
          description: "### CRITICAL CLIENT UPLOAD PROTOCOL INSTRUCTIONS\nThis is a short-lived presigned HTTPS URL for uploading the document directly to S3.\n\nWhen executing your HTTP PUT binary stream transfer out to this exact URL, your client-side code **MUST** explicitly attach these exact matching metadata headers:\n* `x-amz-meta-request-id` : Set to matching response requestId value.\n* `x-amz-meta-document-id` : Set to matching response documentID value.\n\nFailure to pass these identical headers will cause an immediate HTTP 403 Forbidden error from Amazon S3.\n"
          example: 'https://fdss3-content-api-docs-dev.s3.amazonaws.com/vector_data/inbound......'
    IdsDocumentStatusRequest:
      type: 'object'
      description: 'Request body for the document status endpoint.'
      required:
        - 'data'
      properties:
        data:
          type: 'object'
          description: 'Document status query parameters.'
          required:
            - 'documentIDs'
          properties:
            documentIDs:
              type: 'array'
              items:
                type: 'string'
              description: 'Unique identifier for the document.'
              example:
                - '0001493152-24-046748-1'
                - '0001493152-24-046748-2'
            requestId:
              type: 'string'
              format: 'uuid'
              description: 'Request ID for tracing.'
              example: 'b5cc289f-9cf0-4999-aa23-bfd5f7654113'
    IdsDocumentStatusResponse:
      type: 'object'
      description: 'Response for a document in a terminal state (success or failed).'
      properties:
        data:
          $ref: '#/components/schemas/IdsDocumentStatusData'
    IdsDocumentStatusData:
      type: 'object'
      description: 'Terminal status and lifecycle metadata for a single ingested document.'
      properties:
        requestId:
          type: 'string'
          format: 'uuid'
          description: 'Request identifier for tracing.'
          example: 'b5cc289f-9cf0-4999-aa23-bfd5f7654113'
        documents:
          type: 'array'
          description: 'Documents Status'
          items:
            $ref: '#/components/schemas/DocumentsStatus'
    DocumentsStatus:
      title: 'Documents'
      description: 'Document Status'
      type: 'object'
      properties:
        documentID:
          type: 'string'
          description: 'Unique identifier of the ingested document.'
          example: '0001493152-24-046748-1'
        fileName:
          type: 'string'
          description: 'Name of the file.'
          nullable: true
          example: 'annual-report-2024.pdf'
        status:
          type: 'string'
          description: 'Terminal processing state. Success - all chunks indexed; document is searchable. Failed  - one or more chunks failed; document is not searchable.'
          enum:
            - 'AwaitingUpload'
            - 'Processing'
            - 'Success'
            - 'Failed'
          example: 'Success'
        createdAt:
          type: 'string'
          format: 'date-time'
          description: 'ISO 8601 timestamp of when the presigned upload URL was created.'
          nullable: true
          example: '2024-11-01T09:00:00Z'
        confirmedAt:
          type: 'string'
          format: 'date-time'
          description: 'ISO 8601 timestamp of when the client signalled upload completion.'
          nullable: true
          example: '2024-11-01T09:05:30Z'
        updatedAt:
          type: 'string'
          format: 'date-time'
          description: 'ISO 8601 timestamp of the most recent pipeline modification.'
          nullable: true
          example: '2024-11-01T09:12:47Z'
    IdsDocumentDownloadRequest:
      type: 'object'
      description: 'Request body for the document download endpoint.'
      required:
        - 'data'
      properties:
        data:
          type: 'object'
          description: 'Document download query parameters.'
          required:
            - 'documentIDs'
          properties:
            documentIDs:
              type: 'array'
              items:
                type: 'string'
              description: 'Unique identifier for the document.'
              example:
                - '0001493152-24-046748-1'
                - '0001493152-24-046748-2'
            requestId:
              type: 'string'
              format: 'uuid'
