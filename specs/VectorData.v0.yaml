openapi: '3.0.0'
info:
  title: 'Vector Data API'
  version: '0.4.0'
  contact:
    name: 'FactSet Research Systems'
    email: 'api@factset.com'
    url: 'https://developer.factset.com/contact'
  license:
    name: 'Apache License, Version 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  description: "\nFactSet's Vector Data API helps asset managers, hedge funds, investment banks, and financial technology firms accelerate the development of next-generation AI and machine learning solutions by simplifying and optimizing access to unstructured financial documents.\n\n This API provides streamlined access to vector data through its defined endpoints. It supports retrieving detailed vector data based on user-defined parameters. Efficiently processing associated text data for enhanced performance.\n\n This API is designed to enable developers to integrate vector data into their applications, ensuring flexibility and performance while leveraging the specified endpoint functionalities.\n\n  > Access to the AI Ready version of FactSet collected documents with enrichments. Meant as an input to a client's RAG experience.\n\n **Note:** Vector Data API performs semantic search across vectorized financial documents and returns results ranked by similarity score. Supports filtering by themes, sentiment, form types, date ranges, and entity identifiers.\n\n `API Build & Advantages:`\n\n **AI-Ready Unstructured Data Processing Pipeline:** Automate the ingestion, chunking, embedding, and indexing of high-value financial text-removing the need for manual pipeline development.\n   > **Out-of-the-box** support for FactSet proprietary and third-party datasets (StreetAccount News, CallStreet Transcripts, EDGAR Filings, MT Newswire and more to come).\n\n   > **Benchmark-driven** chunking strategies ensure optimal results for GenAI and RAG use.\n\n **Platform & Embedding Model Agnostic:** Seamlessly integrate with any AI stack-works with cloud and on-prem environments and supports any embedding model you choose.\n\n **Native Integration with Model Context Protocol (MCP):** Enable direct, standardized connectivity between your unstructured data workflows and MCP-compliant AI solutions, supporting context-aware generative AI, retrieval-augmented generation, and document-level search intelligence. Rich Metadata, Tagging, and Entity Resolution: Enhance AI models with entity and date resolution, topic tagging, sentiment labels, and links to FactSet's Unstructured Knowledge Graph, enabling richer, more accurate search and analysis.\n \n \n"
externalDocs:
  description: 'API Documentation'
  url: 'https://developer.factset.com/api-catalog/vector-data-api'
servers:
  - url: 'https://api.factset.com/content/vector/v0'
security:
  - FactSetApiKey: []
  - FactSetOAuth2: []
paths:
  /data:
    post:
      summary: 'Return vector information based on the input parameters below'
      tags:
        - 'Vector'
      responses:
        '200':
          description: 'Returns vector data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorDataResponse'
              examples:
                sampleResponse:
                  $ref: '#/components/examples/SampleVectorDataResponse'
                sampleResponseTrimmed:
                  $ref: '#/components/examples/SampleVectorDataResponseTrimmed'
        '400':
          description: 'Bad request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorDetails'
        '401':
          description: 'Unauthenticated USERNAME-SERIAL. Ensure you are logged in and have successfully generated an API KEY for the IP range you are connecting from. For more help, select the Report Issue in the top right corner of this Developer Portal specification card and choose Connectivity 401 or 403 Responses.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorDetails'
        '403':
          description: 'The USERNAME-SERIAL attempted to request the endpoint is not authorized to access. The request was a legal request, but the server is refusing to respond. Please reach out to FactSet Account Team for assistance with authorization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorDetails'
        '500':
          description: 'Internal Server Error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorDetails'
      operationId: 'postVector'
      description: 'Returns the vector information.'
      requestBody:
        description: 'Input parameters for vector data.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorDataRequest'
            examples:
              Request for data endpoint:
                $ref: '#/components/examples/dataRequest'
              Request for data endpoint for semantic query:
                $ref: '#/components/examples/searchRequestForQuery'
              Request for data endpoint for optional parameters:
                $ref: '#/components/examples/searchRequestForOptional'
