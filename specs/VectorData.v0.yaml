  parameters:
    vectorId:
      name: 'vectorId'
      in: 'query'
      required: true
      schema:
        type: 'array'
        minItems: 1
        maxItems: 50
        items:
          type: 'string'
      description: 'Unique identifier for a document'
      examples:
        oneId:
          summary: 'One ID'
          value:
            - '0001493152-24-046748-1_0001493152-24-046748-1_text_236_0'
        multipleIds:
          summary: 'Multiple IDs'
          value:
            - '0001493152-24-046748-1_0001493152-24-046748-1_text_236_0'
            - '3063689-t_3063689-t_qna_3_0'
    paginationLimit:
      schema:
        type: 'integer'
        format: 'int32'
        default: 10
        minimum: 1
        maximum: 20
      in: 'query'
      name: '_paginationLimit'
      example: 20
      description: 'Number of results to return per page.'
    paginationLimitValue:
      schema:
        type: 'integer'
        format: 'int32'
        default: 25
      in: 'query'
      name: '_paginationLimit'
      example: 20
      description: 'Number of results to return per page.'
    paginationOffset:
      schema:
        type: 'integer'
        format: 'int32'
        minimum: 0
        default: 0
      in: 'query'
      name: '_paginationOffset'
      description: 'Page number of the results to return. '
    sources:
      schema:
        type: 'array'
        minItems: 1
        maxItems: 3
        items:
          type: 'string'
      in: 'query'
      name: 'sources'
      required: false
      examples:
        oneSource:
          summary: 'One Source'
          value:
            - 'EDG'
        multipleSources:
          summary: 'Multiple Sources'
          value:
            - 'EDG'
            - 'SA'
            - 'FCST'
      description: 'Code for document source to include. This is a comma-separated list. Use the `/sources` endpoint to get the list of available sources.'
      explode: false
    trimmed:
      name: 'trimmed'
      in: 'query'
      required: false
      schema:
        type: 'boolean'
        default: false
      description: 'If true, returns metadata only without vector embeddings. If false, includes full vector embeddings in the response.'
      example: false
    entitledSources:
      name: 'entitledSources'
      in: 'query'
      required: false
      schema:
        type: 'boolean'
        default: false
      description: 'If true, returns only entitled sources. If false, returns all the available sources.'
      example: false
    sourceType:
      name: 'type'
      in: 'query'
      required: false
      schema:
        type: 'array'
        items:
          type: 'string'
          enum:
            - 'News'
            - 'Filings'
            - 'Transcripts'
      description: 'Filters type of sources.'
