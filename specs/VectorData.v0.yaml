  /documents/status:
    post:
      operationId: 'getIdsDocumentStatus'
      summary: 'Retrieve ingestion status for one or more documents.'
      description: 'Returns the current lifecycle state for each requested document ID, including timestamps and any pipeline failure details. Accepts one or more `documentIDs`. Returns `201` when all requested documents are in a terminal state (`Success`or `Failed`), and `202` while any are still in progress (`AwaitingUpload` or`Processing`). Poll until a `201` is received before calling`/documents/download` or `/documents/search`.'
      tags:
        - 'Intelligent Document Service'
      requestBody:
        required: true
        description: 'Document status request.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsDocumentStatusRequest'
      responses:
        '201':
          description: 'Terminal status returned (success or failed).'
          headers:
            Location:
              description: 'Path to Batch Request result.'
              schema:
                type: 'string'
              example: 'batch/v1/result?id=2df43e85-ea0f-45c6-bf4a-2baf4d1eaa3c'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdsDocumentStatusResponse'
              examples:
                statusSuccess:
                  $ref: '#/components/examples/SampleIdsDocumentStatusSuccess'
                statusFailed:
                  $ref: '#/components/examples/SampleIdsDocumentStatusFailed'
        '202':
          description: 'Document is still in-progress. Poll again shortly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdsDocumentStatusResponse'
              examples:
                statusProcessing:
                  $ref: '#/components/examples/SampleIdsDocumentStatusProcessing'
          headers:
            Location:
              description: 'Path to Batch Request status.'
              schema:
                type: 'string'
              example: 'batch/v1/status?id=2df43e85-ea0f-45c6-bf4a-2baf4d1eaa3c'
        '400':
          description: 'Bad request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorInfo'
        '401':
          description: 'Unauthenticated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorInfo'
        '403':
          description: 'Forbidden.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorInfo'
        '404':
          description: 'The specified documentID was not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default404Response:
                  $ref: '#/components/examples/NotFoundDetails'
        '415':
          description: 'Unsupported Media Type.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: 'Unprocessable Entity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default422Response:
                  $ref: '#/components/examples/ValidationErrorDetails'
        '429':
          description: 'Too Many Requests.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default429Response:
                  $ref: '#/components/examples/RateLimitErrorDetails'
        '500':
          description: 'Internal Server Error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorInfo'
  /documents/download:
    post:
      operationId: 'getIdsDocumentDownload'
      summary: 'Get a presigned URL to download processed document output.'
      description: 'Returns a short-lived presigned HTTPS URL for each requested document so the client can download the processed output JSON. Accepts one or more `documentIDs`. Available only when a document status is `Success` — returns `422` if status is not `Success`, and `202` if the document is still inprogress (`AwaitingUpload` or `Processing`). Prefer polling `/documents/status` until terminal before calling this endpoint.'
      tags:
        - 'Intelligent Document Service'
      requestBody:
        required: true
        description: 'Document download request.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsDocumentDownloadRequest'
      responses:
        '200':
          description: 'Presigned download URL returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdsDocumentDownloadResponse'
              examples:
                sampleDownloadResponse:
                  $ref: '#/components/examples/SampleIdsDocumentDownload'
        '202':
          description: 'Document is still being processed. Poll status before downloading.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdsDocumentStatusResponse'
              examples:
                statusProcessing:
                  $ref: '#/components/examples/SampleIdsDocumentStatusProcessing'
          headers:
            Location:
              description: 'Path to Batch Request status.'
              schema:
                type: 'string'
              example: 'batch/v1/status?id=2df43e85-ea0f-45c6-bf4a-2baf4d1eaa3c'
        '400':
          description: 'Bad request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorInfo'
        '401':
          description: 'Unauthenticated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorInfo'
        '403':
          description: 'Forbidden.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default403Response:
                  $ref: '#/components/examples/AuthorizationErrorInfo'
        '404':
          description: 'The specified documentID was not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default404Response:
                  $ref: '#/components/examples/NotFoundDetails'
        '415':
          description: 'Unsupported Media Type.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: 'Unprocessable Entity - document status is not success; download is only available after successful processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                documentNotReady:
                  $ref: '#/components/examples/IdsDownloadNotReadyError'
                default422Response:
                  $ref: '#/components/examples/ValidationErrorDetails'
        '429':
          description: 'Too Many Requests.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default429Response:
                  $ref: '#/components/examples/RateLimitErrorDetails'
        '500':
          description: 'Internal Server Error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default500Response:
                  $ref: '#/components/examples/ServerErrorInfo'
      x-factset-different-success-responses: true
  /documents/search:
