  /documents/register:
    post:
      operationId: 'createIdsDocumentUpload'
      summary: 'Register a document and receive a presigned upload URL'
      description: 'Registers a document for Intelligent Document Service ingestion and returns a document ID plus a short-lived presigned HTTPS URL. PUT the file to that URL, then poll `/documents/status` until the document reaches a terminal state (`success` or `failed`). Supported file types include Pdf, Text, Html, Md and Xml.'
      tags:
        - 'Intelligent Document Service'
      requestBody:
        required: true
        description: 'Document registration request.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsDocumentUploadRequest'
      responses:
        '202':
          description: 'Document registered. Presigned upload URL returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdsDocumentUploadResponse'
              examples:
                sampleUploadResponse:
                  $ref: '#/components/examples/SampleIdsDocumentUpload'
        '400':
          description: 'Bad request - malformed syntax or missing required fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default400Response:
                  $ref: '#/components/examples/ErrorInfo'
        '401':
          description: 'Unauthenticated - missing or invalid credentials.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                default401Response:
                  $ref: '#/components/examples/AuthErrorInfo'
        '403':
