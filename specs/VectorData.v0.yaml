      type: 'object'
      description: 'Response body for the document download endpoint.'
      properties:
        data:
          $ref: '#/components/schemas/IdsDocumentDownloadData'
    IdsDocumentDownloadData:
      type: 'object'
      description: 'Download payload for a successfully processed document.'
      properties:
        requestId:
          type: 'string'
          format: 'uuid'
          description: 'RequestId or a server-generated UUID.'
          example: 'c7de390a-1ad1-4b2e-bf10-dce7f8765524'
        documents:
          type: 'array'
          description: 'Contains list of Files'
          items:
            $ref: '#/components/schemas/DocumentsDownload'
    DocumentsDownload:
      title: 'Documents'
      description: 'Array of data objects'
      type: 'object'
      properties:
        documentID:
          type: 'string'
          description: 'Unique identifier of the ingested document.'
          example: '0001493152-24-046748-1'
        fileName:
          type: 'string'
          description: 'fileName of the ingested document.'
          nullable: true
          example: 'annual-report-2024.pdf'
        downloadUrl:
          type: 'string'
          format: 'url'
          description: 'Secure HTTPS link to the full source document.'
          example: 'https://api.factset.com/content/vector/v0/fetch-document?...'
    IdsDocumentSearchRequest:
      type: 'object'
      description: 'Request body for the document search endpoint.'
      required:
        - 'data'
      properties:
        data:
          type: 'object'
          description: 'Document search parameters.'
          required:
            - 'query'
            - 'sources'
          properties:
            query:
              type: 'string'
              description: 'Natural language search query.'
              minLength: 1
              maxLength: 1000
              example: 'What are companies saying about AI investment and infrastructure?'
            sources:
              type: 'array'
              description: 'Data sources to search.'
              minItems: 1
              uniqueItems: true
              items:
                type: 'string'
                enum:
                  - 'IdsClient'
                  - 'TrialData'
              example:
                - 'IdsClient'
            documentIDs:
              type: 'array'
              description: 'Restrict results to these document IDs.'
              items:
                type: 'string'
              example:
                - '0001493152-24-046748-1'
        meta:
          $ref: '#/components/schemas/IdsDocumentSearchRequestMeta'
    IdsDocumentSearchRequestMeta:
      type: 'object'
      description: 'Pagination and sort controls for the search request.'
      properties:
        pagination:
          $ref: '#/components/schemas/OffsetPaginationRequest'
        sort:
          type: 'array'
          description: 'Field to sort by. '
          maxItems: 1
          items:
            type: 'string'
            enum:
              - 'SimilarityScore'
          example:
            - 'SimilarityScore'
    IdsDocumentSearchResponse:
      type: 'object'
      description: 'Response body for the document search endpoint.'
      properties:
        data:
          type: 'array'
          description: 'Search results ranked by similarity score.'
          items:
            $ref: '#/components/schemas/IdsDocumentSearchResult'
        meta:
          $ref: '#/components/schemas/IdsDocumentSearchResponseMeta'
    IdsDocumentSearchResponseMeta:
      type: 'object'
      description: 'Pagination metadata echoed in the search response.'
      properties:
        pagination:
          $ref: '#/components/schemas/OffsetPaginationResponse'
    IdsDocumentSearchResult:
      type: 'object'
      description: 'A single search result returned by the document search endpoint.'
      properties:
        chunkId:
          type: 'string'
          nullable: true
          description: 'Unique identifier for the document chunk.'
          example: '0001493152-24-046748-1_text_236_0'
        documentID:
          type: 'string'
          nullable: true
          description: 'Unique identifier for the source document.'
          example: '0001493152-24-046748-1'
        similarityScore:
          type: 'number'
          format: 'double'
          description: 'Similarity score between the query and this result (0-1).'
          minimum: 0
          maximum: 1
          example: 0.8547
        content:
          type: 'string'
          nullable: true
          description: 'Text content of the document chunk.'
          example: 'Management discussed the company''s investment in AI infrastructure.'
        documentLink:
          type: 'string'
          format: 'url'
          nullable: true
          description: 'Secure HTTPS link to the full source document.'
          example: 'https://api.factset.com/content/vector/v0/fetch-document?.....'
        source:
          type: 'string'
          description: 'Data source identifier.'
          example: 'idsClient'
        textLength:
          type: 'integer'
          format: 'int32'
          nullable: true
          description: 'Character length of the content field.'
          example: 1242
        fileName:
          type: 'string'
          nullable: true
          description: 'name of the file.'
          example: 'annual-report-2024.pdf'
    OffsetPaginationRequest:
      type: 'object'
      description: 'Offset-based pagination request parameters.'
      properties:
        limit:
          type: 'integer'
          format: 'int32'
          description: 'Maximum number of results to return per page.'
          default: 10
          minimum: 1
          maximum: 50
          example: 10
        offset:
          type: 'integer'
          format: 'int32'
          description: 'Number of results to skip before returning the first result.'
          default: 0
          minimum: 0
          example: 0
    OffsetPaginationResponse:
      type: 'object'
      description: 'Offset-based pagination metadata echoed in the response.'
      properties:
        total:
          type: 'integer'
          format: 'int32'
          description: 'Total number of matching results.'
          example: 142
        isEstimatedTotal:
          type: 'boolean'
          description: 'True if the total count is an estimate rather than an exact count.'
          example: false
    IdsDocumentsListResponse:
      description: 'Ids documents List'
      type: 'object'
      properties:
        data:
          type: 'array'
          description: 'Documents Item'
          items:
            $ref: '#/components/schemas/IdsDocumentListItem'
        meta:
          $ref: '#/components/schemas/IdsDocumentSearchResponseMeta'
    IdsDocumentListItem:
      type: 'object'
      description: 'Documents List'
