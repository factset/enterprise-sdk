components:
  securitySchemes:
    FactSetOAuth2:
      type: 'oauth2'
      flows:
        clientCredentials:
          tokenUrl: 'https://auth.factset.com/as/token.oauth2'
          scopes: {}
    FactSetApiKey:
      type: 'http'
      scheme: 'basic'
  schemas:
    ErrorResponse:
      type: 'object'
      description: 'Error response object'
      properties:
        errors:
          type: 'array'
          description: 'Errors Array Object.'
          items:
            $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: 'object'
      description: 'Error Example Object.'
      properties:
        code:
          type: 'string'
          description: 'Specifies the error code.'
        title:
          type: 'string'
          description: 'Specifies the error message.'
        id:
          type: 'string'
          description: 'Specifies the id.'
        detail:
          type: 'string'
          description: 'Detailed error message.'
    ErrorObjectResponse:
      type: 'object'
      nullable: true
      description: 'error'
      properties:
        code:
          description: 'status'
          type: 'string'
          example: 'GenericError'
        title:
          description: 'The plain text error message'
          type: 'string'
          example: 'Validation Error'
        detail:
          description: 'Error details explanation'
          type: 'string'
          example: 'Validation Error'
    ErrorResult:
      type: 'object'
      description: 'Error response object'
      properties:
        errors:
          type: 'array'
          description: 'Errors Array Object.'
          items:
            $ref: '#/components/schemas/ErrorObjectData'
    ErrorObjectData:
      type: 'object'
      description: 'Error Example Object.'
      required:
        - 'code'
        - 'title'
        - 'id'
      properties:
        code:
          type: 'string'
          enum:
            - 'BadRequest'
            - 'ValidationError'
            - 'NotFound'
            - 'Forbidden'
            - 'InternalServerError'
          description: 'Machine-readable error code'
        title:
          type: 'string'
          description: 'Human-readable error summary'
        id:
          type: 'string'
          format: 'uuid'
          description: 'Unique error instance identifier for tracking'
        detail:
          type: 'string'
          description: 'Detailed error explanation'
        source:
          type: 'object'
          description: 'Reference to error source'
          properties:
            parameter:
              type: 'string'
              description: 'Query parameter that caused the error.'
            pointer:
              type: 'string'
              description: 'JSON Pointer to request body field that caused the error.'
            value:
              type: 'string'
              description: 'The actual value that caused the error.'
    VectorDataRequest:
      type: 'object'
      description: 'Parameters for querying vector data.'
      properties:
        data:
          type: 'object'
          description: 'Elements of vetctor data request.'
          properties:
            query:
              type: 'string'
              description: 'Search to include the query text.'
              example: 'Updates'
            startDate:
              type: 'string'
              format: 'date'
              description: 'Start Date. Format is YYYY-MM-DD or relative +/- days (0,-1,etc).'
              example: '2023-12-22'
            endDate:
              type: 'string'
              format: 'date'
              description: 'End Date. Format is YYYY-MM-DD or relative +/- days (0,-1,etc).'
              example: '2023-12-23'
            esgTheme:
              type: 'array'
              minItems: 1
              uniqueItems: true
              items:
                type: 'string'
              description: 'The search to include any esg themes of given sources.'
              example:
                - 'Workplace Diversity'
                - 'Accessible Food'
            searchConcept:
              type: 'array'
              minItems: 1
              uniqueItems: true
              items:
                type: 'string'
              description: 'The search to include any concept of given sources.'
              example:
                - 'Consumer Spending'
                - 'Regulatory Change'
            sentiment:
              type: 'array'
              minItems: 1
              uniqueItems: true
              items:
                type: 'string'
              description: 'It is the measure of expressed attitude or opinion of the document, such as "Negative" or "Very Positive". Use the `/meta/themes` endpoint to get a list of all available sentiment values.'
              example:
                - 'Neutral'
                - 'Negative'
            documentTypes:
              type: 'array'
              minItems: 1
              maxItems: 5
              uniqueItems: true
              items:
                type: 'string'
              description: 'The search to include one valid document type for the provided sources.'
              example:
                - '10-K'
                - '10-Q'
                - '8-K'
                - 'News'
                - 'Transcripts'
            sources:
              type: 'array'
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                type: 'string'
              description: 'Code for document source to include. Currently EDGAR, StreetAccount and FactSet Callstreet Transcripts are available.'
              example:
                - 'EDG'
                - 'FCST'
                - 'SA'
            trimmed:
              type: 'boolean'
              default: false
              description: "Trimmed the vectors from response based on provided value\n- If **true**, the vectors has been trimmed.  \n- If **false**, the vectors are been returned.\n"
            ids:
              type: 'array'
              items:
                type: 'string'
              maxItems: 100
              minItems: 1
              description: 'Requested symbols or securities. Each symbol can be a FactSet exchange symbol'
          required:
            - 'sources'
            - 'startDate'
            - 'endDate'
            - 'query'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - 'data'
    Meta:
      type: 'object'
      description: 'Object defining the sorting and pagination attributes for an endpoint request.'
      properties:
        numberOfResults:
          type: 'integer'
          format: 'int32'
          description: 'Number of results to return.'
          example: 10
          default: 10
          maximum: 50
          minimum: 1
    SourceResponse:
      description: 'Response with list of available sources'
      type: 'object'
      properties:
        data:
          type: 'array'
          description: 'List of available sources'
          items:
            $ref: '#/components/schemas/Source'
    Source:
      type: 'object'
      description: 'elements of sources'
      required:
        - 'source'
        - 'description'
      properties:
        source:
          type: 'string'
          description: 'source value'
          example: 'EDG'
        description:
          type: 'string'
          description: 'source description'
          example: 'EDGAR'
    DocumentTypesResponse:
      description: 'Response with list of available document types.'
      type: 'object'
      properties:
        data:
          type: 'array'
          description: 'List of available document types.'
          items:
            $ref: '#/components/schemas/DocumentTypes'
    DocumentTypes:
      type: 'object'
      description: 'elements of document types.'
      required:
        - 'documentType'
        - 'description'
      properties:
        documentType:
          type: 'string'
          description: 'type of the document'
          example: '10-K'
        description:
          type: 'string'
          description: 'document type description'
          example: '10-K'
    SchemasResponse:
      description: 'Response with list of available schemas.'
      type: 'object'
      properties:
        data:
          type: 'array'
          description: 'List of available schemas.'
          items:
            $ref: '#/components/schemas/Schemas'
    Schemas:
      type: 'object'
      description: 'Elements of schemas.'
      required:
        - 'source'
        - 'property'
        - 'type'
      properties:
        property:
          type: 'string'
          description: 'The name of the schema.'
          example: 'content'
        type:
          type: 'string'
          description: 'The type of the schema.'
          example: 'text'
        source:
          type: 'string'
          description: 'Source of the schema.'
          example: 'EDG'
    ThemesResponse:
      description: 'Response with list of available themes.'
      type: 'object'
      properties:
        data:
          type: 'array'
          description: 'List of available schemas.'
          items:
            $ref: '#/components/schemas/Themes'
    Themes:
      type: 'object'
      description: 'elements of themes.'
      properties:
        esgTheme:
          type: 'string'
          description: 'theme of the source.'
          example: 'Accessible Food'
        searchConcept:
          type: 'string'
          description: 'theme of the source.'
          example: 'Tariff'
        sentiment:
          type: 'string'
          description: 'Sentiment is the measure of expressed attitude or opinion of the document, such as "Negative" or "Very Positive" etc.'
          example: 'Negative'
        description:
          type: 'string'
          description: 'theme description'
          example: 'A tax imposed by a government on imports or exports of goods.'
      required:
        - 'description'
    VectorDataResponse:
      type: 'object'
      description: 'Response format for vector data endpoint.'
      properties:
        data:
          type: 'array'
          description: 'Provides vector and vectorid.'
          items:
            $ref: '#/components/schemas/VectorDataResult'
        meta:
          type: 'object'
          description: 'Object defining the sorting and pagination attributes for an endpoint request.'
          properties:
            numberOfResults:
              type: 'integer'
              format: 'int32'
              description: 'Number of results returned.'
    VectorDataResult:
      type: 'object'
      description: 'Returns vector information.'
      properties:
        vector:
          type: 'array'
          items:
            type: 'string'
          description: 'Chuncked emedding vector.'
        vectorId:
          type: 'string'
          description: 'Unique vector identifier associated with the document.'
        similarityScore:
          type: 'number'
          description: 'Score indicating the similarity.'
        storyDate:
          type: 'string'
          format: 'date'
          description: 'Date associated with the story.'
          example: '2020-10-01'
        themes:
          type: 'string'
          description: 'Theme of the document.'
          example: 'doc'
        documentType:
          type: 'string'
          description: 'Type of the document.'
        source:
          type: 'string'
          description: 'Name of the source'
          example: 'EDG'
        documentID:
          type: 'string'
          description: 'Unique identifier for a document.'
          example: '20230307-5b36f2cf'
        property:
          type: 'string'
          description: 'The name of the schema.'
          example: 'content'
        type:
          type: 'string'
          description: 'The type of the schema.'
          example: 'text'
        ids:
          type: 'array'
          items:
            type: 'string'
          description: 'List of related IDs.'
        trimmed:
          type: 'boolean'
          description: "Trimmed attribute indicates whether the vectors are trimmed or not. \n- If **true**, the vectors has been trimmed.  \n- If **false**, the vectors are been returned.\n"
        sentiment:
          type: 'string'
          description: 'Sentiment is the measure of expressed attitude or opinion of the document, such as "Negative" or "Very Positive". The `/meta/themes` endpoint gives list of all available sentiment values.'
    ChunkTextResponse:
      type: 'object'
      description: 'Response format for chunk text endpoint.'
      properties:
        data:
          type: 'array'
          description: 'List of chunked text data results.'
          items:
            $ref: '#/components/schemas/ChunkTextResult'
        meta:
          type: 'object'
          description: 'Metadata about the response'
          properties:
            pagination:
              type: 'object'
              description: 'Information about pagination of results'
              properties:
                isEstimatedTotal:
                  type: 'boolean'
                  description: 'This field acts as a flag for the exact count of results and is defaulted to false as the API should always return the exact count of results.'
                total:
                  type: 'integer'
                  description: 'Total number of files the API returns for a particular query.'
    ChunkTextResult:
      type: 'object'
      description: 'Contains content and link for a single vector ID.'
      properties:
        vectorId:
          type: 'string'
          description: 'Unique vector identifier associated with the document.'
        content:
          type: 'string'
          description: 'Unique identifier for a document.'
        storyLink:
          type: 'string'
          description: 'A secure HTTPS link for downloading the associated document.'
        storyDate:
          type: 'string'
          format: 'date'
          description: 'Date associated with the story.'
          example: '2020-10-01'
        themes:
          type: 'string'
          description: 'Theme of the document.'
          example: 'doc'
        documentType:
          type: 'string'
          description: 'Type of the document.'
        source:
          type: 'string'
          description: 'Name of the source'
          example: 'EDG'
        documentID:
          type: 'string'
          description: 'Unique identifier for a document.'
          example: '20230307-5b36f2cf'
        ids:
          type: 'array'
          items:
            type: 'string'
          description: 'List of related IDs.'
        textLength:
          type: 'integer'
          format: 'int32'
          description: 'Length of the text.'
          example: 1242
        tokenCount:
          type: 'integer'
          format: 'int32'
          description: 'Number of tokens.'
          example: 257
        speakerId:
          type: 'integer'
          format: 'int32'
          description: 'Unique identifier of the speaker.'
          example: 2
        speakerName:
          type: 'string'
          description: 'Name of the speaker.'
          example: 'Luca Maestri'
        speakerType:
          type: 'string'
          description: 'Type of the speaker.'
          example: 'corprep'
        speakerTitle:
          type: 'string'
          description: 'Actual title of the speaker.'
          example: 'Chief Financial Officer & Senior Vice President'
        speakerCompanyName:
          type: 'string'
          description: 'Name of the company the speaker belongs to.'
          example: 'Apple, Inc.'
        speakerCompanyEntityId:
          type: 'string'
          description: 'Entity id of the company the speaker belongs to.'
          example: '000C7F-E'
        speakerEntity:
          type: 'string'
          description: 'Entity id of the speaker.'
          example: '07F5D0-E'
        docType:
          type: 'string'
          description: 'Type(s) of document chunk'
          example: 'discussion'
        docNum:
          type: 'string'
          description: 'Alphanumeric id for the chunk.'
          example: 'md_2'
        financialYear:
          type: 'string'
          description: 'Financial year of the earnings call.'
          example: '2024'
        financialQuarter:
          type: 'string'
          description: 'Financial quarter(s) of the earnings call'
          example: 'Q3'
        sectionName:
          type: 'string'
          description: 'Name of the filing section.'
          example: 'legal proceedings'
        sectionNumber:
          type: 'string'
          description: 'Bullet numeric representing the filing section.'
          example: '1A'
        tableText:
          type: 'string'
          description: 'Full table text for the chunk. Can contain multiple lines and repeated entries.'
          example: "June 29, 2024 June 29, 2024 June 29, 2024 ...\nAdjusted[break-line]Cost Adjusted[break-line]Cost ...\nCash $ 22,866 $  $  $ 22,866 $ 22,866 $  $ \nLevel 1:\nMoney market funds 1\n"
        sentiment:
          type: 'string'
          description: 'Sentiment is the measure of expressed attitude or opinion of the document, such as "Negative" or "Very Positive". The `/meta/themes` endpoint gives list of all available sentiment values.'
    SearchRequest:
      type: 'object'
      description: 'Parameters for semantic search.'
      required:
        - 'data'
      properties:
        data:
          type: 'object'
          description: 'Elements of search request.'
          required:
            - 'sources'
            - 'startDate'
            - 'endDate'
            - 'query'
          properties:
            query:
              type: 'string'
              description: "> Natural language search query.\n> **Note:** currently, we allow the following special characters: space, `,`, `%`, `&`, `/`,` -`, `?`"
              example: 'What are companies saying about AI investment and infrastructure?'
              minLength: 1
              maxLength: 1000
            startDate:
              type: 'string'
              format: 'date'
              description: 'The date for (or from which) the data is required. Supports in YYYY-MM-DD format.'
              example: '2024-01-01'
            endDate:
              type: 'string'
              format: 'date'
              description: 'The date to which data is required. Supports in YYYY-MM-DD format.'
              example: '2024-12-31'
            formTypes:
              type: 'array'
              maxItems: 3
              uniqueItems: true
              items:
                type: 'string'
              description: "> The search to include valid form type for the provided sources. Use the `/form-types` endpoint to get a list of all available form types.\n> **Note:** When used in conjunction with the `sources` parameter set to 'EDG', the API considers these form type values for data retrieval. For non-EDGAR/filings sources, this parameter is ignored."
              example:
                - '10-K'
                - '10-Q'
                - '8-K'
            sources:
              type: 'array'
              minItems: 1
              maxItems: 4
              uniqueItems: true
              items:
                type: 'string'
              description: 'Data sources to search. Use the `/sources` endpoint to get a list of all available sources. Available sources include EDGAR (EDG), StreetAccount News (SA), FactSet CallStreet Transcripts (FCST), MT Newswire (MTN).'
              example:
                - 'EDG'
                - 'FCST'
                - 'SA'
                - 'MTN'
            ids:
              type: 'array'
              items:
                type: 'string'
              maxItems: 100
              description: 'Requested symbols or securities. Each symbol can be a FactSet exchange symbol'
              example:
                - 'AAPL-US'
                - 'MSFT-US'
            resultsBySource:
              type: 'boolean'
              description: "When true, applies the `limit` parameter individually to each specified source.\nFor example, if you specify sources EDG, FCST, SA and MTN with `limit=10` and `resultsBySource=true`, you will receive up to 10 results from each source (up to 30 total).\nWhen false or omitted, `limit` applies to the overall number of results across all sources.\n"
              default: false
        meta:
          type: 'object'
          description: 'Metadata for controlling result pagination and sorting behavior.'
          properties:
            pagination:
              type: 'object'
              description: 'Pagination controls for limiting and offsetting results.'
              properties:
                limit:
                  type: 'integer'
                  format: 'int32'
                  default: 10
                  maximum: 50
                  minimum: 0
                  description: 'Specifies the maximum number of results to return.'
                offset:
                  type: 'integer'
                  format: 'int32'
                  minimum: 0
                  default: 0
                  description: 'Specifies the starting point for pagination. This parameter is used to identify the beginning of the next set of results.'
            sort:
              description: "Sorting the results by `similarityScore` where this field is a part of response.\n\n *  ` similarityScore` - sorting results based on similarityScore.\n"
              type: 'array'
              items:
                type: 'string'
                enum:
                  - 'similarityScore'
              maxItems: 1
    SearchResponse:
      type: 'object'
      description: 'Response format for search endpoint.'
      properties:
        data:
          type: 'array'
          description: 'Array of search results with similarity scores.'
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          type: 'object'
          description: 'Metadata about the response'
          properties:
            pagination:
              type: 'object'
              description: 'Information about pagination of results'
              properties:
                isEstimatedTotal:
                  type: 'boolean'
                  description: 'This field acts as a flag for the exact count of results and is defaulted to false as the API should always return the exact count of results.'
                total:
                  type: 'integer'
                  description: 'Total number of results the API returns for a particular query.'
    SearchResult:
      description: 'Search result discriminated by source type. Each source has specific metadata fields relevant to that content type.'
      oneOf:
        - $ref: '#/components/schemas/EDGARSearchResult'
        - $ref: '#/components/schemas/TranscriptSearchResult'
        - $ref: '#/components/schemas/NewsSearchResult'
      discriminator:
        propertyName: 'source'
        mapping:
          EDG: '#/components/schemas/EDGARSearchResult'
          FCST: '#/components/schemas/TranscriptSearchResult'
          SA: '#/components/schemas/NewsSearchResult'
          MTN: '#/components/schemas/NewsSearchResult'
    EDGARSearchResult:
      type: 'object'
      description: 'Search result from EDGAR filing sources with filing-specific metadata.'
      allOf:
        - $ref: '#/components/schemas/BaseResult'
        - type: 'object'
          additionalProperties: true
          required:
            - 'source'
          properties:
            source:
              $ref: '#/components/schemas/EDGARSearch'
            formType:
              type: 'string'
              description: 'Document form type (e.g., 10-K, 10-Q, 8-K).'
              example: '10-Q'
            sectionName:
              type: 'string'
              description: 'Name of the filing section.'
              example: 'Management''s Discussion and Analysis'
              nullable: true
            sectionNumber:
              type: 'string'
              description: 'Section number in the filing.'
              example: '7A'
              nullable: true
            docType:
              type: 'string'
              description: 'Type of document chunk.'
              example: 'table'
              nullable: true
            similarityScore:
              type: 'number'
              description: 'Score indicating the similarity between the query and the result (0-1).'
              minimum: 0
              maximum: 1
              example: 0.8547
            tableText:
              type: 'string'
              description: 'Full table text if chunk contains tabular data.'
              nullable: true
    EDGARSearch:
      type: 'string'
      enum:
        - 'EDG'
      description: 'Source identifier for EDGAR filing sources.'
    TranscriptSearchResult:
      type: 'object'
      description: 'Search result from transcript sources (FCST) with speaker and call metadata.'
      required:
        - 'source'
      allOf:
        - $ref: '#/components/schemas/BaseResult'
        - type: 'object'
          additionalProperties: true
          properties:
            source:
              $ref: '#/components/schemas/TranscriptSearch'
            speakerId:
              type: 'integer'
              format: 'int32'
