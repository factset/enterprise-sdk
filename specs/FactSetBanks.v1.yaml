    ErrorResponse:
      type: 'object'
      description: 'Object representing an error response.'
      required:
        - 'errors'
      properties:
        errors:
          type: 'array'
          description: 'An array of error objects.'
          items:
            $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: 'object'
      description: 'An object representing an error.'
      required:
        - 'code'
        - 'title'
        - 'id'
      properties:
        code:
          type: 'string'
          description: 'Machine-readable error code'
        title:
          type: 'string'
          description: 'Human-readable error summary'
        id:
          type: 'string'
          format: 'uuid'
          description: 'Unique error instance identifier for tracking'
        detail:
          type: 'string'
          description: 'Detailed error explanation'
        source:
          type: 'object'
          description: "Reference to the request field that caused the error.\nFor POST requests, `pointer` is used (JSON Pointer to the request body field, e.g. `/ids/1`).\nFor GET requests, `parameter` is used (query parameter name, e.g. `ids[3]`).\n"
          properties:
            pointer:
              type: 'string'
              description: "JSON Pointer (RFC 6901) to the request body field that caused the error.\nUsed for POST requests (e.g., `/ids/1` for the second element of the `ids` array).\n"
              example: '/ids/1'
            parameter:
              type: 'string'
              description: "Query parameter name that caused the error.\nUsed for GET requests (e.g., `ids[3]`).\n"
              example: 'ids[3]'
            value:
              type: 'string'
              description: 'The actual value that caused the error.'
              example: 'INVALID-ID'
  responses:
    '400':
      description: 'Bad Request. This can occur for several reasons. Please review the "detail" for more details.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Bad Request - Missing Required Parameter:
              $ref: '#/components/examples/badRequestRequiredParameter'
            Bad Request - Invalid Parameter:
              $ref: '#/components/examples/badRequestInvalidParameter'
            Bad Request - Malformed JSON:
              $ref: '#/components/examples/badRequestMalformedJSON'
    '401':
      description: 'Unauthenticated USERNAME-SERIAL. Ensure you are logged in and have successfully generated an API KEY for the IP range you are connecting from. For more help, select the **Report Issue** in the top right corner of this Developer Portal specification card and choose Connectivity 401 or 403 Responses.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            User Authentication - Failed:
              $ref: '#/components/examples/unauthenticated'
    '403':
      description: 'The USERNAME-SERIAL attempted to request the endpoint is not authorized to access. The request was a legal request, but the server is refusing to respond. Please reach out to FactSet Account Team for assistance with authorization.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Forbidden:
              $ref: '#/components/examples/forbidden'
    '404':
      description: 'The requested endpoint could not be found.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Not Found:
              $ref: '#/components/examples/notFound'
    '415':
      description: 'Unsupported Media Type. This error may be returned when the caller sends a resource in a format that is not accepted by the server. This can be fixed by ensuring that Content-Type header is set to the correct value. In this instance, "application/json" would be the appropriate value.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unsupported Media Type:
              $ref: '#/components/examples/unsupportedMediaType'
    '422':
      description: "Unprocessable Entity. Your request data was syntactically correct but semantically invalid.\nCheck the required parameters and their value constraints.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Validation Error - Invalid Date Range:
              $ref: '#/components/examples/unprocessableEntityDateRange'
            Validation Error - Invalid Metric Code:
              $ref: '#/components/examples/unprocessableEntityMetricCode'
    '500':
      description: 'Internal Server Error.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Internal Server Error - General Exception:
              $ref: '#/components/examples/generalException'
  examples:
    badRequestRequiredParameter:
      summary: 'Bad Request - Required Parameter Missing'
      description: 'This error message occurs when the request does not include the required parameters. Required parameters are indicated with a red asterisk symbol in the specification file.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Bad Request'
            title: 'Missing Required Parameter'
            detail: 'The parameter ''ids'' is required and may not be empty.'
    badRequestInvalidParameter:
      summary: 'Bad Request - Invalid Parameter'
      description: 'This error message occurs when a request parameter is not recognized or contains an invalid value. Please revise your request to use parameters and values outlined in the specification.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Bad Request'
            title: 'Invalid Parameter'
            detail: 'The ''coverage'' field must be one of: US, CANADA, AUSTRALIA, CREDIT_UNION'
    badRequestMalformedJSON:
      summary: 'Bad Request - Malformed JSON Request'
      description: 'This error may be returned when the request body is specified as JSON but is not in proper JSON format.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Bad Request'
            title: 'Malformed JSON Request'
            detail: 'Malformed JSON Request'
    unauthenticated:
      summary: 'User Authentication Failed'
      description: 'This occurs when a user is not properly authenticated or recognized by the service. Please double check the USERNAME-SERIAL and API-Key used to request and ensure you are within the IP range specified for the Key.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Bad Request'
            title: 'Authentication Failed'
            detail: 'User Authentication Failed.'
    forbidden:
      summary: 'Forbidden'
      description: 'The USERNAME-SERIAL attempted to request an endpoint it is not authorized to access. Please reach out to your FactSet Account Team for assistance with authorization.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Forbidden'
            title: 'Authentication Failed'
            detail: 'USERNAME-SERIAL does not have permission to use /factset-banks/v1/{endpoint}'
    notFound:
      summary: 'Not Found'
      description: 'The requested endpoint could not be found.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Not Found'
            title: 'No endpoint found'
            detail: 'The requested endpoint could not be found.'
    unsupportedMediaType:
      summary: 'Unsupported Media Type'
      description: 'This bad request occurs when the media type passed in the request is not supported. Currently the APIs only support ''application/json''.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Unsupported Media Type'
            title: 'Unsupported Media Type'
            detail: 'text/html media type is not supported. Supported media types are application/json'
    unprocessableEntityDateRange:
      summary: 'Validation Error - Invalid Date Range'
      description: 'This error occurs when startDate is after endDate.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'ValidationError'
            title: 'Invalid Date Range'
            detail: 'startDate ''2024-12-31'' cannot be after endDate ''2024-01-01'''
    unprocessableEntityMetricCode:
      summary: 'Validation Error - Invalid Metric Code'
      description: 'This error occurs when one or more metric codes supplied in the request are not valid for the requested coverage or endpoint.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'ValidationError'
            title: 'Invalid Metric Code'
            detail: 'The metric ''INVALID_METRIC'' is not valid. Use the /metrics endpoint to retrieve available metric codes.'
    generalException:
      summary: 'Internal Server Error - General Exception'
      description: 'This is the most general error that can be returned by the service. Please Report Issue to FactSet.'
      value:
        errors:
          - id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
            code: 'Internal Server Error'
            title: 'Internal Server Error'
            detail: 'An unexpected error occurred. Please try again later or contact FactSet support.'
