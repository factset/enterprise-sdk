openapi: '3.0.0'
info:
  version: '1.0.0'
  title: 'FactSet Banks API'
  contact:
    name: 'FactSet Research Systems'
    email: 'api@factset.com'
    url: 'https://developer.factset.com/contact'
  license:
    name: 'Apache License, Version 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  description: "The FactSet Banks API provides comprehensive banking industry data including regulatory financials, performance metrics, branch networks, and specialized reporting across US, Canadian, and Australian institutions.\n\n**Key Features:**\n- Multi-jurisdiction regulatory financials (US, Canada, Australia)\n- Unified endpoint structure for banks, credit unions, and specialty finance\n- UBPR performance metrics and peer group analysis\n- Branch and ATM location data with market share\n- Country exposure and risk metrics\n- Regulatory filings (10-D, UCC-1)\n- Deposit rates and specialty finance reporting\n"
externalDocs:
  description: 'API Documentation'
  url: 'https://developer.factset.com/api-catalog/factset-banks-api'
servers:
  - url: 'https://api.factset.com/content/factset-banks/v1'
    description: 'Production'
security:
  - FactSetApiKey: []
  - FactSetOAuth2: []
x-factset-sdk-has-main-example: true
tags:
  - name: 'Financials'
    description: 'Regulatory financial statements across jurisdictions (US, Canada, Australia)'
  - name: 'Branches'
    description: 'Branch and ATM locations with geographic data and market share'
  - name: 'UBPR Performance'
    description: 'UBPR ratios, performance metrics, and peer group analysis'
  - name: 'Exposure'
    description: 'Country exposure and risk concentration data (Form 009a)'
  - name: 'Filings'
    description: 'Regulatory filings including 10-D and UCC-1'
  - name: 'Deposit Rates'
    description: 'Deposit rates and product-level pricing data'
  - name: 'Specialty Finance'
    description: 'Form ADV (AUM) and FOCUS reports for specialty finance institutions'
  - name: 'Metrics'
    description: 'Metric definitions'
paths:
  /financials:
    post:
      tags:
        - 'Financials'
      summary: 'Returns bank financial statement data'
      x-factset-sdk-main-example: true
      operationId: 'getFinancials'
      description: "Returns regulatory financial statements for banks and financial institutions. Use the `coverage` field to specify the data source:\n\n* **US** — US banks, thrifts, and depository institutions (FFIEC/FDIC/Federal Reserve sources). Covers 11,000+ bank holding companies (forms FR Y-9C/SP/LP/15) and 10,000+ banking institutions (FFIEC 031/041/051/101/102), with history back to 1991 for BHCs and 2002 for institutions. Includes demographics (charter class, specialization, established and deposit-insurance dates) and 3,000+ metrics covering profitability, capital adequacy (Basel III), loan/deposit composition, asset quality, yields, and funding costs. Also includes industry aggregates for 800+ US banking institutions with annual, quarterly, LTM, and YTD data since 2010.\n* **CANADA** — Canadian banks regulated by OSFI. 148+ institutions; 800+ data items; history since 2017. Balance sheet data is updated monthly; supplementary reports (Capital Components, Credit Losses, Derivative Contracts, Foreign Bank Branch, Income Statement) are updated quarterly.\n* **AUSTRALIA** — Australian banks regulated by APRA. 100+ institutions, interim-period balance sheet data; LTM history since 2002; 30+ data items.\n* **CREDIT_UNION** — US credit unions regulated by NCUA. 5,800+ credit unions, quarterly data since 2017; 2,400+ data items.\n\nFind available metrics via [`/metrics`](#operation/getMetrics) with:\n\n* **category**: `FINANCIALS`\n* **subcategory**: `US`, `CANADA`, `AUSTRALIA`, `CREDIT_UNION`, `INDUSTRY`\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialsRequest'
            examples:
              US Bank Request:
                $ref: '#/components/examples/FinancialsRequestUSBank'
              Canadian Bank Request:
                $ref: '#/components/examples/FinancialsRequestCanadianBank'
              Australian Bank Request:
                $ref: '#/components/examples/FinancialsRequestAustralianBank'
              Credit Union Request:
                $ref: '#/components/examples/FinancialsRequestCreditUnion'
      responses:
        '200':
          description: 'Successful response with financial statement data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialsResponse'
              examples:
                US Bank Response:
                  $ref: '#/components/examples/FinancialsResponseUSBank'
                Canadian Bank Response:
                  $ref: '#/components/examples/FinancialsResponseCanadianBank'
                Australian Bank Response:
                  $ref: '#/components/examples/FinancialsResponseAustralianBank'
                Credit Union Response:
                  $ref: '#/components/examples/FinancialsResponseCreditUnion'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /branches:
    post:
      tags:
        - 'Branches'
      summary: 'Returns bank branch and location data'
      operationId: 'getBranches'
      description: "Returns branch and location data for banks and financial institutions. Use the `coverage` field to specify the data source:\n\n* **US** — FDIC-insured bank branches with branch counts and deposit market share by county, ZIP, and MSA. 85,000+ current branches across 9,000+ banks and BHCs. Sourced from the FDIC Summary of Deposits (annual) and Institutions and Locations (weekly). Current-only feed; deposit balances as of the most recent June 30.\n* **CREDIT_UNION** — US credit union branches and ATMs with service flags. 5,800+ credit unions, 21,000+ branches, and 17,000+ ATM addresses; reported quarterly since September 2022.\n* **AUSTRALIA** — Service channel locations with remoteness classifications. 149+ banks; 30,000+ branches, 47,000+ ATMs, 6,600+ other face-to-face, and 4.9M+ EFTPOS channels. Annual data as of June 30.\n* **GLOBAL** — Global bank branches and ATMs ex-US with country, region, city, lat/long, postal, and street details where available. 300,000+ banks, 800,000+ locations, 180+ countries. Current-only feed.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchesRequest'
            examples:
              US Bank Branches:
                $ref: '#/components/examples/BranchesRequestUSBank'
              Credit Union Branches:
                $ref: '#/components/examples/BranchesRequestCreditUnion'
              Australia Branches:
                $ref: '#/components/examples/BranchesRequestAustralia'
              Global Branches:
                $ref: '#/components/examples/BranchesRequestGlobal'
      responses:
        '200':
          description: 'Branch and location data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchesResponse'
              examples:
                US Bank Branches:
                  $ref: '#/components/examples/USBranchesResponseExample'
                Credit Union Branches:
                  $ref: '#/components/examples/CUBranchesResponseExample'
                Australia Bank Branches:
                  $ref: '#/components/examples/AustraliaBranchesResponseExample'
                Global Bank Branches:
                  $ref: '#/components/examples/GlobalBranchesResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /ubpr:
    post:
      tags:
        - 'UBPR Performance'
      summary: 'Returns UBPR performance metrics'
      operationId: 'getPerformance'
      description: "Returns Uniform Bank Performance Report (UBPR) metrics — financial ratios, peer group rankings, and performance analytics — sourced from FFIEC reports of condition and income (call reports). Supports analysis of earnings, liquidity, capital, asset/liability management, and growth across three data views: the bank's own data, peer group data (banks similar in size and economic environment), and percentile rankings.\n\nCovers 10,000+ insured commercial banks and FDIC-supervised savings banks across 249 peer groups. Quarterly history since 2002; 1,600+ data items.\n\nFind available metrics via [`/metrics`](#operation/getMetrics) with:\n\n* **category**: `PERFORMANCE`\n* **subcategory**: `UBPR`\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceRequest'
            examples:
              UBPR Performance Request:
                $ref: '#/components/examples/PerformanceRequestExample'
      responses:
        '200':
          description: 'Performance metrics data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResponse'
              examples:
                UBPR Performance - Peer Group Rankings:
                  $ref: '#/components/examples/PerformanceResponseExample'
                UBPR Performance - Institution Ratios:
                  $ref: '#/components/examples/PerformanceInstitutionResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /country-exposure:
    post:
      tags:
        - 'Exposure'
      summary: 'Returns country exposure data (Form 009a)'
      operationId: 'getCountryExposure'
      description: "Returns Form 009a country exposure data — the distribution by country of claims on foreigners held by US banks — for screening countries and assessing risks in US bank lending activities. Viewable by metric and by country.\n\nCovers ~100 US commercial banks; history since 2013. Updated quarterly.\n\nFind available metrics via [`/metrics`](#operation/getMetrics) with:\n\n* **category**: `EXPOSURE`\n* **subcategory**: `COUNTRY`\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureRequest'
            examples:
              Country Exposure Request:
                $ref: '#/components/examples/ExposureRequestExample'
      responses:
        '200':
          description: 'Country exposure data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureResponse'
              examples:
                Country Exposure:
                  $ref: '#/components/examples/ExposureResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /ten-d:
    post:
      tags:
        - 'Filings'
      summary: 'Returns Form 10-D distribution reports'
      operationId: 'getTenDFilings'
      description: "Returns SEC Form 10-D distribution reports for bank-issued asset-backed securities — pool performance and credit enhancement data including payments received, delinquencies, defaults, and cash flow distributions. Offers more frequent (monthly) insight into credit card receivables than 8-K/10-K filings.\n\nCovers credit cards (110 data items) and auto loans (254 data items). History since 2017. Updated monthly.\n\nFind available metrics via [`/metrics`](#operation/getMetrics) with:\n\n* **category**: `FILINGS`\n* **subcategory**: `TEN_D`\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenDFilingsRequest'
            examples:
              10-D Filing Request:
                $ref: '#/components/examples/Filings10DRequestExample'
      responses:
        '200':
          description: '10-D filing data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filings10DResponse'
              examples:
                10-D Filing:
                  $ref: '#/components/examples/Filings10DResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /ucc1:
    post:
      tags:
        - 'Filings'
      summary: 'Returns UCC-1 filings data'
      operationId: 'getUcc1Filings'
      description: "Returns UCC-1 financing statement filings — notices filed by creditors of an interest in a debtor's personal property. Includes secured party (banking institution), debtor name, and filing details such as expiration date.\n\nCovers 4,500+ banking institutions; history since 2002. Updated monthly.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ucc1FilingsRequest'
            examples:
              UCC-1 Filing Request:
                $ref: '#/components/examples/FilingsUCC1RequestExample'
      responses:
        '200':
          description: 'UCC-1 filing data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingsUCC1Response'
              examples:
                UCC-1 Filing:
                  $ref: '#/components/examples/FilingsUCC1ResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /deposit-rates:
    post:
      tags:
        - 'Deposit Rates'
      summary: 'Returns deposit rates'
      operationId: 'getRates'
      description: "Returns current and historical deposit rates from US banks and credit unions — APY, previous APY, national APY averages, terms, and minimum balances — across CD, Savings, Interest Checking, Money Market, Fixed IRA, and Variable IRA products. Identifies where banks offer better rates than geographic competitors.\n\nCovers 500+ financial institutions (US banks, credit unions, internet banks); 40+ data items.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatesRequest'
            examples:
              Deposit Rates Request:
                $ref: '#/components/examples/RatesRequestExample'
      responses:
        '200':
          description: 'Deposit rates data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesResponse'
              examples:
                Deposit Rates:
                  $ref: '#/components/examples/RatesResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /aum:
    post:
      tags:
        - 'Specialty Finance'
      summary: 'Returns Form ADV AUM data'
      operationId: 'getAUM'
      description: "Returns SEC Form ADV assets under management data for investment advisers — 19,000+ public and private US companies, wealth managers, traditional asset managers, private equity hedge funds, and Business Development Companies (BDCs). BDC coverage includes 120+ companies with annual history since 2014.\n\nForm ADV history since 2017. Updated annually.\n\nFind available metrics via [`/metrics`](#operation/getMetrics) with:\n\n* **category**: `FINANCIALS`\n* **subcategory**: `SPECIALTY_FINANCE`\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AUMRequest'
            examples:
              AUM Request:
                $ref: '#/components/examples/AUMRequestExample'
      responses:
        '200':
          description: 'Form ADV AUM data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AUMResponse'
              examples:
                Form ADV AUM:
                  $ref: '#/components/examples/AUMResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /focus:
    post:
      tags:
        - 'Specialty Finance'
      summary: 'Returns FOCUS report data'
      operationId: 'getFOCUS'
      description: "Returns FOCUS report financial data for SEC-registered broker-dealers, derived from Form X-17A-5 — income statement, balance sheet, and net capital data covering financial and operating status.\n\nCovers 3,000+ broker-dealers; 300+ data items; history since 2015. Updated annually.\n\nIncome statement data is rarely reported by filers, so it is expected that users will see income statement values populated infrequently.\n\nFind available metrics via [`/metrics`](#operation/getMetrics) with:\n\n* **category**: `FINANCIALS`\n* **subcategory**: `SPECIALTY_FINANCE`\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FOCUSRequest'
            examples:
              FOCUS Request:
                $ref: '#/components/examples/FOCUSRequestExample'
      responses:
        '200':
          description: 'FOCUS report data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FOCUSResponse'
              examples:
                FOCUS Report:
                  $ref: '#/components/examples/FOCUSResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /metrics:
    get:
      tags:
        - 'Metrics'
      summary: 'Returns available metrics and their definitions'
      operationId: 'getMetrics'
      description: "Returns list of available metrics that can be used in the metrics parameter of related endpoints.\n\nUse this endpoint to discover available financial metrics, their definitions, and metadata. Filter by category and subcategory to narrow results.\n\n**For methodology definitions**, reference the `oaPageId` or `oaUrl` response items to launch the available methodology page.\n"
      parameters:
        - name: 'searchText'
          in: 'query'
          required: false
          schema:
            type: 'string'
          description: "Free-text search to filter metrics whose metric code or description contains the supplied text. Case-insensitive partial matching.\n"
          example: 'return on assets'
        - name: 'category'
          in: 'query'
          required: false
          schema:
            type: 'string'
            enum:
              - 'FINANCIALS'
              - 'FILINGS'
              - 'PERFORMANCE'
              - 'EXPOSURE'
          description: "Filter metrics by major category:\n- **FINANCIALS** - Financial statement data, demographics, and core institution identifiers (US, Canada, Australia, Credit Union, Industry, Specialty Finance). Endpoint: `/financials`, `/aum`, `/focus`\n- **FILINGS** - Regulatory filing data (10-D). Endpoint: `/ten-d`\n- **PERFORMANCE** - Uniform Bank Performance Report (UBPR) metrics. Endpoint: `/ubpr`\n- **EXPOSURE** - Country exposure data (Form 009a). Endpoint: `/country-exposure`\n"
        - name: 'subcategory'
          in: 'query'
          required: false
          schema:
            type: 'string'
            enum:
              - 'US'
              - 'CANADA'
              - 'AUSTRALIA'
              - 'CREDIT_UNION'
              - 'INDUSTRY'
              - 'SPECIALTY_FINANCE'
              - 'TEN_D'
              - 'UBPR'
              - 'COUNTRY'
          description: "Sub-category filter for the primary category:\n- **US** - United States regulatory financials. Endpoint: `/financials`\n- **CANADA** - Canadian OSFI regulatory financials. Endpoint: `/financials`\n- **AUSTRALIA** - Australian regulatory financials. Endpoint: `/financials`\n- **CREDIT_UNION** - Credit union financial data. Endpoint: `/financials`\n- **INDUSTRY** - Industry-level financial aggregates. Endpoint: `/financials`\n- **SPECIALTY_FINANCE** - Specialty finance industry data including FOCUS reports, Form ADV, and Business Development Corporations. Endpoint: `/aum`, `/focus`\n- **TEN_D** - Form 10-D securitization filings. Endpoint: `/ten-d`\n- **UBPR** - Uniform Bank Performance Report metrics. Endpoint: `/ubpr`\n- **COUNTRY** - Country exposure metrics. Endpoint: `/country-exposure`\n"
        - name: 'dataType'
          in: 'query'
          required: false
          schema:
            type: 'string'
            enum:
              - 'string'
              - 'number'
              - 'date'
              - 'boolean'
          description: 'Filter by metric data type'
      responses:
        '200':
          description: 'Available metrics data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              examples:
                Metrics Response:
                  $ref: '#/components/examples/MetricsResponseExample'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
components:
  securitySchemes:
    FactSetOAuth2:
      type: 'oauth2'
      flows:
        clientCredentials:
          tokenUrl: 'https://auth.factset.com/as/token.oauth2'
          scopes: {}
    FactSetApiKey:
      type: 'http'
      scheme: 'basic'
  schemas:
    Ids:
      type: 'array'
      minItems: 1
      description: 'Array of security identifiers. Accepted ID types include Market Tickers, SEDOL, ISINs, CUSIPs, or FactSet Entity IDs.'
      items:
        type: 'string'
      example:
        - '000BDX-E'
    USStateCode:
      type: 'string'
      description: 'Two-letter US state or territory code (ISO 3166-2:US).'
      enum:
        - 'AL'
        - 'AK'
        - 'AZ'
        - 'AR'
        - 'CA'
        - 'CO'
        - 'CT'
        - 'DE'
        - 'FL'
        - 'GA'
        - 'HI'
        - 'ID'
        - 'IL'
        - 'IN'
        - 'IA'
        - 'KS'
        - 'KY'
        - 'LA'
        - 'ME'
        - 'MD'
        - 'MA'
        - 'MI'
        - 'MN'
        - 'MS'
        - 'MO'
        - 'MT'
        - 'NE'
        - 'NV'
        - 'NH'
        - 'NJ'
        - 'NM'
        - 'NY'
        - 'NC'
        - 'ND'
        - 'OH'
        - 'OK'
        - 'OR'
        - 'PA'
        - 'RI'
        - 'SC'
        - 'SD'
        - 'TN'
        - 'TX'
        - 'UT'
        - 'VT'
        - 'VA'
        - 'WA'
        - 'WV'
        - 'WI'
        - 'WY'
        - 'DC'
        - 'PR'
        - 'VI'
        - 'GU'
        - 'AS'
        - 'MP'
    FinancialsRequest:
      type: 'object'
      description: 'Request body for financial data endpoints.'
      properties:
        data:
          type: 'object'
          description: 'Financial data query parameters.'
          properties:
            ids:
              $ref: '#/components/schemas/Ids'
            periodicity:
              type: 'string'
              enum:
                - 'ANN'
                - 'QTR'
                - 'SEMI'
              description: "Periodicity or frequency of the fiscal periods, where\n  * **ANN**  = Annual - Original\n  * **QTR**  = Quarterly - Original\n  * **SEMI** = Semi-Annual\n\nIf omitted, defaults to `ANN`.\n"
              example: 'ANN'
            startDate:
              $ref: '#/components/schemas/StartDateFiscal'
            endDate:
              $ref: '#/components/schemas/EndDateFiscal'
            coverage:
              type: 'string'
              enum:
                - 'US'
                - 'CANADA'
                - 'AUSTRALIA'
                - 'CREDIT_UNION'
              description: "Data source region or institution type.\n  * **US** — US banks, thrifts, and depository institutions, including bank holding companies (FFIEC/FDIC)\n  * **CANADA** — Canadian banks regulated by OSFI\n  * **AUSTRALIA** — Australian banks regulated by APRA\n  * **CREDIT_UNION** — US credit unions regulated by NCUA\n"
              example: 'US'
            metrics:
              type: 'array'
              minItems: 1
              items:
                type: 'string'
              description: "Array of metric codes to retrieve. Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.\n"
              example:
                - 'FB_SM_BHC_ASSETS'
            currency:
              $ref: '#/components/schemas/CurrencyCode'
          required:
            - 'ids'
            - 'coverage'
            - 'metrics'
        meta:
          $ref: '#/components/schemas/RequestMeta'
      required:
        - 'data'
    PerformanceRequest:
      type: 'object'
      description: 'Request body for UBPR performance metrics.'
      properties:
        data:
          type: 'object'
          description: 'UBPR performance metrics query parameters.'
          properties:
            ids:
              $ref: '#/components/schemas/Ids'
            periodicity:
              type: 'string'
              enum:
                - 'ANN'
                - 'QTR'
              description: "Periodicity of the UBPR fiscal periods, where\n  * **ANN** = Annual\n  * **QTR** = Quarterly\n\nIf omitted, defaults to `ANN`.\n"
              example: 'ANN'
            startDate:
              $ref: '#/components/schemas/StartDateFiscal'
            endDate:
              $ref: '#/components/schemas/EndDateFiscal'
            currency:
              $ref: '#/components/schemas/CurrencyCode'
            metrics:
              type: 'array'
              minItems: 1
              items:
                type: 'string'
              description: "Array of UBPR metric codes to retrieve. Examples include financial ratios, performance metrics, and peer group statistics. Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.\n"
              example:
                - 'FF_ROA'
                - 'FF_ROE'
          required:
            - 'ids'
            - 'metrics'
        meta:
          $ref: '#/components/schemas/RequestMeta'
      required:
        - 'data'
    BranchesRequest:
      type: 'object'
      description: 'Request body for bank branch and location data.'
      properties:
        data:
          type: 'object'
          description: 'Branch query parameters.'
          properties:
            ids:
              $ref: '#/components/schemas/Ids'
            coverage:
              type: 'string'
              enum:
                - 'US'
                - 'CREDIT_UNION'
                - 'AUSTRALIA'
                - 'GLOBAL'
              description: "Data source region or institution type:\n* **US** — US FDIC-insured bank branches — branch counts and deposit market share by county, ZIP, and MSA\n* **CREDIT_UNION** — US credit union individual locations (NCUA)\n* **AUSTRALIA** — Australian bank service channels (APRA)\n* **GLOBAL** — Global bank locations (ex-US)\n"
              example: 'US'
            marketShareType:
              type: 'string'
              enum:
                - 'COUNTY'
                - 'ZIP'
                - 'MSA'
                - 'STATE'
                - 'ALL'
              default: 'ALL'
              description: "Geographic aggregation level for US FDIC deposit data (Applicable only to US):\n* **COUNTY** — Aggregated by FIPS county code (`marketShareCode` = 5-digit FIPS)\n* **ZIP** — Aggregated by ZIP code (`marketShareCode` = 5-digit ZIP)\n* **MSA** — Aggregated by Metropolitan Statistical Area (`marketShareCode` = MSA code)\n* **STATE** — One row per state (the only rows carrying a populated `state_province_code` in the underlying data)\n* **ALL** — All aggregation levels (default)\n\nUse the `stateCode` filter alongside any `marketShareType` to narrow\nresults to a single state — e.g. `stateCode=NY` with\n`marketShareType=COUNTY` returns every New York county row.\n"
            stateCode:
              $ref: '#/components/schemas/USStateCode'
            countyFipsCodes:
              type: 'array'
              items:
                type: 'string'
              description: "Filter by 5-digit FIPS county codes (e.g. \"36059\" = Nassau, NY).\nImplicitly narrows results to county-type rows. (Applicable only to US)\n"
              example:
                - '36059'
                - '36103'
            msaCodes:
              type: 'array'
              items:
                type: 'string'
              description: "Filter by MSA (Metropolitan Statistical Area) codes (e.g. \"35620\" = NY-Newark-Jersey City).\nImplicitly narrows results to msa-type rows. (Applicable only to US)\n"
              example:
                - '35620'
            zipCodes:
              type: 'array'
              items:
                type: 'string'
              description: "Filter by 5-digit ZIP codes. Implicitly narrows results to zip-type rows. (Applicable only to US)\n"
              example:
                - '11501'
                - '11701'
            locationNames:
              type: 'array'
              items:
                type: 'string'
              description: "Case-insensitive substring match against the county/city portion of `locationDescription`\n(e.g. [\"Nassau\", \"Suffolk\"] to match \"New York, Nassau\" and \"New York, Suffolk\").\nUse this when you know the place name but not the FIPS/MSA code. (Applicable only to US)\n"
              example:
                - 'Nassau'
                - 'Suffolk'
            branchTypes:
              type: 'array'
              items:
                type: 'string'
              description: "Filter by branch type string (matches the `branchType` response field exactly).\n(Applicable only to US)\n"
              example:
                - 'Full service brick and mortar branch'
            minTotalDeposits:
              type: 'number'
              description: "Minimum `totalDeposits` (in thousands) to include. (Applicable only to US)\n"
              example: 1000
            maxTotalDeposits:
              type: 'number'
              description: "Maximum `totalDeposits` (in thousands) to include. (Applicable only to US)\n"
            minBranchCount:
              type: 'integer'
              description: 'Minimum `branchCount` to include. (Applicable only to US)'
              example: 1
            maxBranchCount:
              type: 'integer'
              description: 'Maximum `branchCount` to include. (Applicable only to US)'
            stateName:
              type: 'string'
              description: 'Australian state or territory full name filter (Applicable only to AUSTRALIA)'
              example: 'New South Wales'
            city:
              type: 'string'
              description: 'City name filter (Applicable only to CREDIT_UNION, GLOBAL)'
              example: 'San Francisco'
            postalCode:
              type: 'string'
              description: 'Postal/ZIP code filter (Applicable only to CREDIT_UNION, GLOBAL)'
              example: '94102'
            locationType:
              type: 'string'
              enum:
                - 'BRANCH'
                - 'ATM'
                - 'ALL'
              default: 'ALL'
              description: 'Type of location to return (Applicable only to CREDIT_UNION, GLOBAL)'
            serviceChannelType:
              type: 'string'
              enum:
                - 'BRANCH'
                - 'ATMS'
                - 'OTHER_FACE_TO_FACE'
                - 'ALL'
              default: 'ALL'
              description: 'Type of service channel (Applicable only to AUSTRALIA)'
            country:
              type: 'string'
              description: 'ISO country code filter (Applicable only to GLOBAL)'
              example: 'CA'
            region:
              type: 'string'
              description: 'State/province/territory code (Applicable only to GLOBAL)'
              example: 'ON'
            isMainOffice:
              type: 'boolean'
              description: 'Return only main office/headquarters (Applicable only to CREDIT_UNION)'
            hasDriveThru:
              type: 'boolean'
              description: 'Filter for locations with drive-thru service (Applicable only to CREDIT_UNION)'
            hasMemberServices:
              type: 'boolean'
              description: 'Filter for locations with full member services (Applicable only to CREDIT_UNION)'
            hasAtm:
              type: 'boolean'
              description: 'Filter for locations with ATM on-site (Applicable only to CREDIT_UNION)'
          required:
            - 'ids'
            - 'coverage'
        meta:
          $ref: '#/components/schemas/RequestMeta'
      required:
        - 'data'
    ExposureRequest:
      type: 'object'
