      properties:
        entityProperName:
          type: 'string'
          nullable: true
          description: 'Institution legal name'
          example: 'JPMorgan Chase Bank, National Association'
        factsetEntityId:
          type: 'string'
          nullable: true
          description: 'FactSet entity identifier'
          example: '000BDX-E'
    MetricValueBase:
      type: 'object'
      description: 'Common fields for metric-based data.'
      additionalProperties: true
      properties:
        metric:
          type: 'string'
          nullable: true
          description: 'Metric code'
          example: 'FB_ASSETS'
        value:
          type: 'number'
          nullable: true
          description: 'Metric value'
          example: 1234567.89
        description:
          type: 'string'
          nullable: true
          description: 'Detailed description of the metric'
    StartDateFiscal:
      type: 'string'
      format: 'date'
      description: "Filters for fiscal periods ending on or after this date in YYYY-MM-DD format.\nUse with `endDate` for a date range, or alone to return all periods from this date forward.\nIf both `startDate` and `endDate` are omitted, the most recent available period is returned.\n"
      example: '2023-01-01'
    EndDateFiscal:
      type: 'string'
      format: 'date'
      description: "Filters for fiscal periods ending on or before this date in YYYY-MM-DD format.\nUse with `startDate` for a date range, or alone to return the most recent period on or before this date.\nIf both `startDate` and `endDate` are omitted, the most recent available period is returned.\n"
      example: '2023-12-31'
    StartDateFiling:
      type: 'string'
      format: 'date'
      description: "Filters for filings with a `filingDate` on or after this date in YYYY-MM-DD format.\nUse with `endDate` for a date range, or alone to return all filings from this date forward.\nIf both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.\n"
      example: '2024-01-01'
    EndDateFiling:
      type: 'string'
      format: 'date'
      description: "Filters for filings with a `filingDate` on or before this date in YYYY-MM-DD format.\nUse with `startDate` for a date range, or alone to return the most recent filings on or before this date.\nIf both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.\n"
      example: '2024-12-31'
    StartDateUCC1:
      type: 'string'
      format: 'date'
      description: "Filters for UCC-1 filings with an `effectiveDate` on or after this date in YYYY-MM-DD format.\nUse with `endDate` for a date range, or alone to return all filings from this date forward.\nIf both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.\n"
      example: '2024-01-01'
    EndDateUCC1:
      type: 'string'
      format: 'date'
      description: "Filters for UCC-1 filings with an `effectiveDate` on or before this date in YYYY-MM-DD format.\nUse with `startDate` for a date range, or alone to return all filings up to this date.\nIf both `startDate` and `endDate` are omitted, the most recent 30 days of filings are returned.\n"
      example: '2024-12-31'
    StartDateRates:
      type: 'string'
      format: 'date'
      description: "Filters for deposit rate records with an `asOfDate` on or after this date in YYYY-MM-DD format.\nUse with `endDate` for a date range, or alone to return all records from this date forward.\nIf both `startDate` and `endDate` are omitted, the most recent available rates are returned.\n"
      example: '2024-01-01'
    EndDateRates:
      type: 'string'
      format: 'date'
      description: "Filters for deposit rate records with an `asOfDate` on or before this date in YYYY-MM-DD format.\nUse with `startDate` for a date range, or alone to return the most recent rates on or before this date.\nIf both `startDate` and `endDate` are omitted, the most recent available rates are returned.\n"
      example: '2024-12-31'
    Pagination:
      type: 'object'
      description: 'Pagination metadata for the response.'
      properties:
        total:
          type: 'integer'
          format: 'int32'
          description: 'Total number of records available for the query.'
          example: 2500
        isEstimatedTotal:
          type: 'boolean'
          description: 'Whether the total count is an estimate. False indicates an exact count.'
          example: false
      required:
        - 'total'
        - 'isEstimatedTotal'
    Meta:
      type: 'object'
      description: 'Response metadata including pagination and request tracking information.'
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        requestedIds:
          type: 'integer'
          format: 'int32'
          description: 'Total number of identifiers submitted in the request.'
          example: 5
        failedIds:
          type: 'array'
          items:
            type: 'string'
          description: 'Identifiers from the request that failed (invalid format, empty, or not found). Empty array when all submitted identifiers resolved successfully.'
          example:
            - 'INVALID-ID-1'
            - 'INVALID-ID-2'
            - 'INVALID-ID-3'
      required:
        - 'pagination'
