          type: 'object'
          description: 'Country exposure query parameters.'
          properties:
            ids:
              $ref: '#/components/schemas/Ids'
            startDate:
              $ref: '#/components/schemas/StartDateFiscal'
            endDate:
              $ref: '#/components/schemas/EndDateFiscal'
            country:
              type: 'string'
