                type: 'string'
              description: "Array of country exposure metric codes to retrieve. Available metrics include:\n- CB_CLAIMS_EXCL_DERIV_GT: Cross-border claims excluding derivatives\n- CLAIMS_DERIV_GT: Gross claims from derivative products\n- CLAIMS_GT: Total cross-border and local claims\n- LR_CLAIMS_EXCL_DERIV_GT: Local resident claims excluding derivatives\n- CLAIMS_GT_BK: Claims by borrower type - Banks\n- CLAIMS_GT_NBFI: Claims by borrower type - Non-bank financial institutions\n- CLAIMS_GT_PUB: Claims by borrower type - Public sector\n- CLAIMS_GT_OTH: Claims by borrower type - Other\n\nOmit to retrieve all available metrics. Use the `/metrics` endpoint to retrieve the full list of available metric codes and their definitions.\n"
              example:
                - 'CB_CLAIMS_EXCL_DERIV_GT'
                - 'CLAIMS_DERIV_GT'
                - 'CLAIMS_GT'
          required:
