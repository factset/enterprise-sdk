          format: 'int32'
          default: 0
          minimum: 0
          description: 'Number of results to skip. Use with limit for paging through results.'
    RequestMeta:
      type: 'object'
      description: 'Optional request metadata for pagination control.'
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationRequest'
    CurrencyCode:
      type: 'string'
      nullable: true
      minLength: 3
      maxLength: 3
      description: 'Currency code (ISO 4217). For a list of currency codes, see [OA Page 1470](https://my.apps.factset.com/oa/pages/1470).'
      example: 'USD'
    EntityIdentification:
      type: 'object'
      description: 'Common entity identification fields.'
