openapi: '3.0.3'
info:
  version: '1.0.1'
  title: 'Exchange Snapshot API'
  license:
    name: 'Apache License, Version 2.0'
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  description: 'A service that provides access to Real Time or Delayed data snapped at hourly intervals for an entire Exchange. Clients that need access to the DFSnapshot product for a custom watchlist snapped at a client specified interval should use this API'
  contact:
    url: 'https://developer.factset.com/contact'
    name: 'FactSet Research Systems'
    email: 'api@factset.com'
externalDocs:
  description: 'API Documentation'
  url: 'https://developer.factset.com/api-catalog/exchange-datafeed-snapshot-api-entire-exchange'
security:
  - FactSetApiKey: []
  - FactSetOAuth2: []
servers:
  - url: 'https://api.factset.com/bulk-documents/exchange-snapshot/v1'
tags:
  - name: 'ExchangeSnapshot'
    description: 'Operations for retrieving exchange data snapshots'
paths:
  /list-files:
    get:
      summary: 'List Files service returns downloadable Real Time, Delayed or Static Exchange Snapshot files for a specified product, date range, and time range'
      tags:
        - 'ExchangeSnapshot'
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntireExchangeSnapshotResponse'
              examples:
                sampleResponse:
                  $ref: '#/components/examples/sampleResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '408':
          $ref: '#/components/responses/408'
        '500':
          $ref: '#/components/responses/500'
      operationId: 'getListFiles'
      description: 'A service that provides access to Real Time or Delayed data snapped at hourly intervals for an entire Exchange'
      parameters:
        - $ref: '#/components/parameters/product'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/startTime'
        - $ref: '#/components/parameters/endTime'
        - $ref: '#/components/parameters/access'
    parameters: []
components:
  schemas:
    EntireExchangeSnapshotResponse:
      type: 'object'
      description: 'Response containing the list of matching exchange snapshot files along with pagination metadata.'
      properties:
        data:
          type: 'array'
          description: 'Array of exchange snapshot file entries matching the requested product, date, and time range.'
          items:
            $ref: '#/components/schemas/EntireExchangeItems'
        meta:
          title: 'meta'
          type: 'object'
          description: 'Metadata about the response'
          properties:
            sort:
              type: 'array'
              description: ''
              items:
                type: 'string'
            pagination:
              type: 'object'
              description: 'Pagination details for the returned `data` array.'
              properties:
                total:
                  type: 'integer'
                  description: 'Total number of records available'
                isEstimatedTotal:
                  type: 'boolean'
                  description: 'Whether the total is an estimate'
                limit:
                  type: 'integer'
                  description: 'Maximum number of records returned'
                offset:
                  type: 'integer'
                  description: 'Number of records skipped'
            partial:
              type: 'object'
              description: 'Indicates whether the returned data set is incomplete.'
              properties:
                isPartial:
                  type: 'boolean'
                  description: 'Whether the response contains partial data'
    EntireExchangeItems:
      type: 'object'
      description: 'Entire Exchange Item'
      properties:
        product:
          description: 'Product (Exchange) Code for which the data is requested'
          type: 'string'
        date:
          type: 'string'
          description: 'Date for which the snapshot is generated'
        time:
          type: 'string'
          description: 'Time for which the snapshot is generated'
        responseType:
          type: 'string'
          description: 'Type of data "RT" or "DL"'
        fileName:
          type: 'string'
          description: 'fileName a combination of product code, date of snapshot & time of snapshot'
        url:
          type: 'string'
          description: 'download link of snapshot file'
    ErrorResponse:
      type: 'object'
      title: 'Error Response'
      description: 'Error Default Response'
      properties:
        id:
          description: 'A UUID for this particular occurrence of the problem.'
          type: 'string'
          format: 'uuid'
          example: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code:
          description: 'A short code identifying the error type.'
          type: 'string'
          example: 'notAuthorized'
        title:
          description: 'The plain text error message'
          type: 'string'
          example: 'Error: Invalid start date parameter'
  parameters:
    product:
      schema:
        type: 'integer'
        example: 10001
      in: 'query'
      name: 'product'
      required: true
      description: 'any product subscribed by client'
    startDate:
      schema:
        type: 'string'
        format: 'date'
      in: 'query'
      name: 'startDate'
      required: true
      description: 'YYYYMMDD (Choose between 1 and 4 previous trading days). Also accepts `start_date` (snake_case), which is deprecated and exists for backward compatibility.'
    endDate:
      schema:
        type: 'string'
        format: 'date'
      in: 'query'
      name: 'endDate'
      description: 'YYYYMMDD (Choose between 1 and 4 previous trading days, greater than or equal to start date). Also accepts `end_date` (snake_case), which is deprecated and exists for backward compatibility.'
      required: true
    startTime:
      schema:
        type: 'string'
      in: 'query'
      name: 'startTime'
      required: true
      description: 'HHMM (24 hour time EST). Also accepts `start_time` (snake_case), which is deprecated and exists for backward compatibility.'
    endTime:
      schema:
        type: 'string'
      in: 'query'
      name: 'endTime'
      required: true
      description: 'HHMM (24 hour time EST). Also accepts `end_time` (snake_case), which is deprecated and exists for backward compatibility.'
    access:
      schema:
        type: 'string'
        enum:
          - 'static'
          - 'DL'
          - 'RT'
        default: 'DL'
      in: 'query'
      name: 'access'
      required: false
      description: 'Option to select from static, DL or RT data'
  securitySchemes:
    FactSetOAuth2:
      type: 'oauth2'
      flows:
        clientCredentials:
          tokenUrl: 'https://auth.factset.com/as/token.oauth2'
          scopes: {}
    FactSetApiKey:
      type: 'http'
      scheme: 'basic'
  responses:
    '400':
      description: 'Bad Request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              $ref: '#/components/examples/badRequest'
    '401':
      description: 'Authentication Failed'
      content:
        text/plain:
          schema:
            type: 'string'
            example: 'Authentication Failed'
    '403':
      description: 'The USERNAME-SERIAL attempted to request the endpoint is not authorized to access. The request was legal, but the server is refusing to respond. Please reach out to FactSet Account Team for assistance with authorization.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthorized:
              $ref: '#/components/examples/forbidden'
    '408':
      description: 'Request Timeout'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthorized:
              $ref: '#/components/examples/timeout'
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalServerError:
              $ref: '#/components/examples/internalServerError'
  examples:
    sampleResponse:
      summary: 'Sample Response'
      value:
        data:
          - product: '10001'
            date: '20210604'
            time: '0800'
            responseType: 'DL'
            fileName: '10001_20210604-0800.csv.gz'
            url: 'https://cdn.example.com/file.csv.gz'
        meta:
          sort:
            - ''
          pagination:
            total: 1
            isEstimatedTotal: false
            limit: 1
            offset: 1
          partial:
            isPartial: false
    forbidden:
      summary: 'Forbidden'
      description: 'The USERNAME-SERIAL attempted to request the endpoint/ID which is not authorized to access. The request was legal, but the server is refusing to respond. Please reach out to FactSet Account Team for assistance with authorization.'
      value:
        id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code: 'notAuthorized'
        title: 'USERNAME-SERIAL does not have permission to use this endpoint.'
    badRequest:
      summary: 'Bad Request'
      description: 'The User is forbidden access or has provided incorrect parameters.'
      value:
        id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code: 'parameterError'
        title: 'Error:User is forbidden access with current credentials'
    timeout:
      summary: 'Request Time Outstanding.'
      description: 'Request Timed Out as it too long for the server to respond.'
      value:
        id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code: 'Request Timeout'
        title: 'Error:Request Timeout'
    internalServerError:
      summary: 'Internal Server Error'
      description: 'An unexpected error occurred while processing the request.'
      value:
        id: 'adb01824-252f-4420-b0c6-35a1e3507ef5'
        code: 'genericServerError'
        title: 'Error: An unexpected error occurred while processing the request.'
