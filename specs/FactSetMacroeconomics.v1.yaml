          - itemType: 'TIMEZONE'
            code: 'GMT+10:00'
            description: 'AET'
          - itemType: 'TIMEZONE'
            code: 'GMT+00:00'
            description: 'Africa/Abidjan'
          - itemType: 'TIMEZONE'
            code: 'GMT+01:00'
