          - itemType: 'TIMEZONE'
            code: 'GMT'
            description: 'GMT'
    FdsCodeMappingSingleExample:
      summary: 'Single series metadata'
      description: 'Returns the series ID, FDS code, name, category, and unit details for a single series lookup with hierarchy path.'
      value:
        data:
          - seriesId: 'ABMI'
            seriesName: 'GDP at Market Prices, Chain Volume, 2019 Prices, SA - United Kingdom'
            fdsCodes:
