            eventName: 'Foreign Direct Investment'
            sourceName: 'BEA - US Bureau of Economic Analysis'
    TimezonesExample:
      summary: 'Available time zones'
      description: 'Returns supported time zone values in GMT offset format for use with the `timeZone` parameter.'
      value:
        data:
          - itemType: 'TIMEZONE'
            code: 'GMT+09:30'
